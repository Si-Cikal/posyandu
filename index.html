        /* ===== TAMPILAN v4: Lingkar Hidup (5 siklus hidup ILP) ===== */
        :root {

            --ok:#047857; --ok-tint:#d7f5e6; --bad:#b91c1c; --bad-tint:#fde4e4;

        .sk-balita    { --sc:#0284c7; --st:#e0f2fe; --sx:#075985; }
        .sk-remaja    { --sc:#059669; --st:#d8f5e8; --sx:#065f46; }
        .sk-dewasa    { --sc:#d97706; --st:#fdefc6; --sx:#92400e; }
        .sk-lansia    { --sc:#7c3aed; --st:#ece3ff; --sx:#5b21b6; }

        .dark .sk-ibu_hamil { --sc:#fb7185; --st:#3b1623; --sx:#fecdd3; }
        .dark .sk-balita    { --sc:#38bdf8; --st:#0c2c42; --sx:#bae6fd; }
        .dark .sk-remaja    { --sc:#34d399; --st:#0d3226; --sx:#a7f3d0; }
        .dark .sk-dewasa    { --sc:#fbbf24; --st:#3a2a0a; --sx:#fde68a; }

        html { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

        .ab-names em { font-style:normal; color:var(--muted); margin-left:.3rem; font-size:.72rem; }
    
        /* ===== Animasi Lingkar Hidup ===== */
        .life-ring::before { content:""; position:absolute; inset:14%; border-radius:50%; background:radial-gradient(circle, rgba(124,58,237,.28), transparent 68%); animation:ringglow 4s ease-in-out infinite; pointer-events:none; }
        .ring-spin { position:absolute; inset:0; animation:ringspin 50s linear infinite; }
        .ring-badge { animation:badgepop .7s cubic-bezier(.34,1.56,.64,1) both, ringcounter 50s linear infinite; animation-delay:calc(.5s + var(--i) * .12s), 0s; cursor:default; transition:box-shadow .25s; }
        .ring-badge::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--sc); opacity:0; animation:badgepulse 3.2s ease-out infinite; animation-delay:calc(1.4s + var(--i) * .64s); }
        .ring-badge i { animation:iconbob 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * .35s); }
        .ring-runner { stroke:#fff; filter:drop-shadow(0 0 5px rgba(255,255,255,.95)); animation:ringrun 5.5s linear infinite; }
        .ring-logo { z-index:2; animation:heartbeat 2.4s ease-in-out infinite; }
        .ring-pulse { position:absolute; left:50%; top:50%; width:34%; aspect-ratio:1; border-radius:22%; border:2px solid var(--brand); opacity:0; transform:translate(-50%,-50%); animation:ripple 3s ease-out infinite; pointer-events:none; }
        .ring-pulse.d2 { animation-delay:1.5s; }
        .life-ring:hover .ring-spin, .life-ring:hover .ring-badge { animation-play-state:running, paused; }
        .life-ring:hover .ring-spin { animation-play-state:paused; }
        .ring-badge:hover { box-shadow:0 0 0 6px var(--st), 0 10px 22px -8px rgba(21,26,52,.55); }
        @keyframes ringspin { to { transform:rotate(360deg); } }
        @keyframes ringcounter { to { transform:rotate(-360deg); } }
        @keyframes ringrun { to { stroke-dashoffset:calc(var(--C) * -1); } }
        @keyframes badgepop { from { scale:0; opacity:0; } to { scale:1; opacity:1; } }
        @keyframes badgepulse { 0% { transform:scale(1); opacity:.7; } 70%,100% { transform:scale(1.7); opacity:0; } }
        @keyframes iconbob { 0%,100% { transform:translateY(1.5px); } 50% { transform:translateY(-2.5px); } }
        @keyframes heartbeat { 0%,40%,100% { transform:translate(-50%,-50%) scale(1); } 12% { transform:translate(-50%,-50%) scale(1.08); } 24% { transform:translate(-50%,-50%) scale(.98); } 32% { transform:translate(-50%,-50%) scale(1.05); } }
        @keyframes ripple { 0% { transform:translate(-50%,-50%) scale(1); opacity:.55; } 100% { transform:translate(-50%,-50%) scale(2.1); opacity:0; } }
        @keyframes ringglow { 0%,100% { opacity:.55; transform:scale(.95); } 50% { opacity:1; transform:scale(1.08); } }
        @media (prefers-reduced-motion: reduce) {
            .life-ring::before, .ring-spin, .ring-badge, .ring-badge::after, .ring-badge i, .ring-runner, .ring-logo { animation:none !important; }
            .ring-pulse { display:none; }
        }
    </style>

<body class="antialiased">

    <script type="text/babel">

        const ILP_CATEGORIES = [
            { id: 'ibu_hamil', name: 'Ibu Hamil & Menyusui', icon: 'fa-person-pregnant', desc: 'Kehamilan, ANC, Gizi & TTD' },
            { id: 'balita', name: 'Bayi & Balita', icon: 'fa-baby', desc: 'Timbang, Ukur, Imunisasi & KMS' },
            { id: 'remaja', name: 'Anak & Remaja', icon: 'fa-child-reaching', desc: 'Gizi, Skrining Anemia & Edukasi' },
            { id: 'dewasa', name: 'Usia Dewasa & Produktif', icon: 'fa-user-tie', desc: 'Skrining PTM (Hipertensi, Diabetes)' },
            { id: 'lansia', name: 'Lansia', icon: 'fa-person-cane', desc: 'Tekanan Darah, Gula Darah & Kronis' }
        ];


        /* ===== Absen mandiri: 5 siklus hidup + kader, bisa dibuka dari halaman masuk ===== */
        const ABSEN_GROUPS = [
            { id: 'ibu_hamil', short: 'Ibu hamil', icon: 'fa-person-pregnant' },
            { id: 'balita', short: 'Bayi & balita', icon: 'fa-baby' },
            { id: 'remaja', short: 'Anak & remaja', icon: 'fa-child-reaching' },
            { id: 'dewasa', short: 'Dewasa', icon: 'fa-user-tie' },
            { id: 'lansia', short: 'Lansia', icon: 'fa-person-cane' },
            { id: 'kader', short: 'Kader', icon: 'fa-user-nurse' }
        ];

        function AbsenMandiri({ onClose, cadres, participants, attendances, posyanduList, isPosyanduOpen, schedule, syncData, showNotification }) {
            const posList = posyanduList.filter(p => p.id !== 'admin');
            const [pos, setPos] = useState(() => getSafeLocal('pos_ilp_lastpos', ''));
            const [grp, setGrp] = useState('all');
            const [q, setQ] = useState('');
            const [cam, setCam] = useState(false);
            const [last, setLast] = useState(null);
            const lastScan = useRef({ id: '', t: 0 });
            const today = new Date().toISOString().split('T')[0];
            const open = isPosyanduOpen();
            const posName = (id) => posyanduList.find(x => x.id === id)?.name || id;

            const everyone = [
                ...(cadres || []).map(c => ({ ...c, kind: 'cadre', g: 'kader' })),
                ...(participants || []).map(x => ({ ...x, kind: 'participant', g: x.ilpCategory }))
            ];
            const scoped = everyone.filter(x => !pos || x.posyandu === pos);
            const todayAtt = (attendances || []).filter(a => a.date === today && (!pos || a.posyandu === pos));
            const attIds = new Set((attendances || []).filter(a => a.date === today).map(a => a.personId));
            const gOf = (a) => a.type === 'cadre' ? 'kader' : (a.ilpCategory || (participants || []).find(x => x.id === a.personId)?.ilpCategory);
            const stat = (g) => ({ total: scoped.filter(x => x.g === g).length, hadir: todayAtt.filter(a => gOf(a) === g).length });

            const choosePos = (id) => { setPos(id); try { localStorage.setItem('pos_ilp_lastpos', JSON.stringify(id)); } catch (e) {} };

            const mark = async (person) => {
                if (!isPosyanduOpen()) return showNotification('Absen ditutup. Saat ini di luar jadwal pelayanan.', 'error');
                if (attIds.has(person.id)) return showNotification(`${person.name} sudah hadir hari ini.`, 'error');
                await syncData('attendances', `ATT-${Date.now()}`, {
                    personId: person.id, name: person.name, type: person.kind,
                    ilpCategory: person.g, posyandu: person.posyandu, date: today,
                    time: new Date().toTimeString().slice(0, 5), via: 'mandiri'
                });
                setLast(person); setQ('');
            };

            const onScan = (raw) => {
                const id = (raw || '').trim().toUpperCase();
                const now = Date.now();
                if (lastScan.current.id === id && now - lastScan.current.t < 4000) return;
                lastScan.current = { id, t: now };
                const person = everyone.find(x => x.id === id);
                if (!person) return showNotification('Kartu tidak dikenali / belum terdaftar.', 'error');
                if (pos && person.posyandu !== pos) choosePos(person.posyandu);
                mark(person);
            };

            const results = q.trim().length >= 2
                ? scoped.filter(x => (grp === 'all' || x.g === grp) && ((x.name || '').toLowerCase().includes(q.trim().toLowerCase()) || (x.id || '').toLowerCase() === q.trim().toLowerCase())).slice(0, 12)
                : [];
            const catName = (g) => g === 'kader' ? 'Kader' : (ILP_CATEGORIES.find(c => c.id === g)?.name || '-');
            const tanggal = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            return (
                <div className="ab-wrap" role="dialog" aria-modal="true" aria-label="Absen kehadiran">
                    <header className="ab-top">
                        <button onClick={onClose} className="ab-x" aria-label="Tutup"><i className="fa-solid fa-arrow-left"></i></button>
                        <div><h2>Absen kehadiran</h2><p>{tanggal}</p></div>
                        <span className={`ab-state ${open ? 'on' : ''}`}>{open ? `Dibuka · s.d. ${schedule?.endTime || '13:00'}` : 'Sedang ditutup'}</span>
                    </header>

                    <div className="ab-body">
                        {!open && <div className="ab-closed ab-full"><i className="fa-solid fa-lock mt-1"></i><div><b>Absen hanya bisa dilakukan saat jadwal pelayanan.</b><br/>Jam layanan: {schedule?.startTime || '07:00'} – {schedule?.endTime || '13:00'}.</div></div>}
                        {last && <div className="ab-ok ab-full" role="status"><i className="fa-solid fa-circle-check text-xl"></i><span>{last.name} tercatat hadir ({catName(last.g)}, {posName(last.posyandu)}).</span></div>}

                        <section className="ab-card">
                            <h3>1. Pilih posyandu</h3>
                            <div className="ab-chips scrollbar-hide">
                                <button className={`flt ${pos === '' ? 'on' : ''}`} onClick={() => choosePos('')}>Semua</button>
                                {posList.map(x => <button key={x.id} className={`flt ${pos === x.id ? 'on' : ''}`} onClick={() => choosePos(x.id)}>{x.name.replace('Posyandu ', '')}</button>)}
                            </div>

                            <p className="ab-lbl">2. Siklus hidup (ketuk untuk menyaring)</p>
                            <div className="ab-tiles">
                                {ABSEN_GROUPS.map(g => { const st = stat(g.id); return (
                                    <button key={g.id} className={`ab-tile sk-${g.id} ${grp === g.id ? 'on' : ''}`} onClick={() => setGrp(grp === g.id ? 'all' : g.id)} aria-pressed={grp === g.id}>
                                        <i className={`fa-solid ${g.icon}`}></i><span>{g.short}</span><b>{st.hadir}<small> / {st.total}</small></b>
                                    </button>
                                ); })}
                            </div>

                            <p className="ab-lbl">3. Cari nama atau scan kartu</p>
                            <div className="ab-seg">
                                <button className={!cam ? 'on' : ''} onClick={() => setCam(false)}><i className="fa-solid fa-magnifying-glass mr-2"></i>Cari nama</button>
                                <button className={cam ? 'on' : ''} onClick={() => setCam(true)}><i className="fa-solid fa-qrcode mr-2"></i>Scan kartu</button>
                            </div>
                            {!cam ? (
                                <div>
                                    <input className="field" value={q} onChange={e => setQ(e.target.value)} placeholder="Ketik minimal 2 huruf nama, atau ID kartu" aria-label="Cari nama atau ID" disabled={!open} />
                                    {results.map(x => (
                                        <div key={x.id} className={`ab-row sk-${x.g}`}>
                                            <span className="sk-badge"><i className={`fa-solid ${ABSEN_GROUPS.find(g => g.id === x.g)?.icon || 'fa-user'}`}></i></span>
                                            <div className="min-w-0"><p className="nm">{x.name}</p><p className="sub">{catName(x.g)} · {posName(x.posyandu)}</p></div>
                                            <button className="ab-hadir" disabled={!open || attIds.has(x.id)} onClick={() => mark(x)}>{attIds.has(x.id) ? <><i className="fa-solid fa-check"></i> Hadir</> : 'Hadir'}</button>
                                        </div>
                                    ))}
                                    {q.trim().length >= 2 && results.length === 0 && <p className="ab-empty">Nama tidak ditemukan{pos ? ` di ${posName(pos)}` : ''}. Coba pilih “Semua” atau hubungi kader.</p>}
                                    {q.trim().length < 2 && <p className="ab-empty">Daftar nama muncul setelah Anda mengetik.</p>}
                                </div>
                            ) : <CameraScanner onScan={onScan} isPosyanduOpen={open} />}
                        </section>

                        <section className="ab-card">
                            <h3><span>Sudah hadir hari ini</span><span className="sk-chip sk-kader">{todayAtt.length} orang</span></h3>
                            {todayAtt.length === 0 && <p className="ab-empty"><i className="fa-regular fa-clipboard text-3xl block mb-2 opacity-40"></i>Belum ada yang absen.</p>}
                            {['kader', ...ABSEN_GROUPS.map(g => g.id).filter(id => id !== 'kader')].map(gid => {
                                const rows = todayAtt.filter(a => gOf(a) === gid).sort((a, b) => (b.time || '') > (a.time || '') ? 1 : -1);
                                if (!rows.length) return null;
                                const g = ABSEN_GROUPS.find(x => x.id === gid);
                                return (
                                    <div key={gid} className={`ab-grp sk-${gid}`}>
                                        <span className="sk-chip"><i className={`fa-solid ${g.icon}`}></i> {g.short} · {rows.length}</span>
                                        <div className="ab-names">{rows.map(a => <span key={a.id}>{a.name}{a.time && <em>{a.time}</em>}</span>)}</div>
                                    </div>
                                );
                            })}
                        </section>
                    </div>
                </div>
            );
        }

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center bg-red-50 dark:bg-slate-900 p-8 text-center">
                            <i className="fa-solid fa-triangle-exclamation text-red-600 text-6xl mb-4"></i>
                            <h1 className="text-3xl font-black text-red-800 dark:text-red-400 mb-2">Sistem Sedang Memulihkan Diri</h1>
                            <p className="text-red-700 dark:text-red-300 font-bold mb-6">Kami mengamankan data Anda dari benturan memori browser.</p>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="bg-red-600 text-white px-8 py-4 rounded-xl font-black shadow-lg hover:bg-red-700 transition-all">MUAT ULANG APLIKASI</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const getSafeLocal = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
        const setLocal = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

        function exportToExcel(filename, rows, headers) {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += headers.join(",") + "\r\n";
            rows.forEach(row => { csvContent += row.map(e => `"${(e || '').toString().replace(/"/g, '""')}"`).join(",") + "\r\n"; });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a"); link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${filename}_${new Date().toISOString().split('T')[0]}.xls`);
            document.body.appendChild(link); link.click(); link.remove();
        }

        const getAnalysis = (form, cat) => {
            let diag = [], rec = [];
            const isBalita = cat === 'balita';

            if (form.weight && form.height) {
                const h = parseFloat(form.height)/100;
                const bmi = parseFloat(form.weight) / (h*h);
                if (!isBalita) {
                    if (bmi >= 30) { diag.push("Obesitas"); rec.push("Diet rendah kalori & lemak, olahraga teratur."); }
                    else if (bmi >= 25) { diag.push("Overweight"); rec.push("Jaga pola makan, kurangi konsumsi gula berlebih."); }
                    else if (bmi < 18.5) { diag.push("Underweight"); rec.push("Tingkatkan asupan gizi sehat dan protein."); }
                }
            }
            
            if (isBalita) {
                if (form.headCirc && parseFloat(form.headCirc) < 32) { diag.push("Lingkar Kepala Kurang"); rec.push("Pantau perkembangan saraf & otak secara intensif."); }
                if (form.armCirc && parseFloat(form.armCirc) < 11.5) { diag.push("Risiko Gizi Buruk (LILA < 11.5cm)"); rec.push("Segera berikan PMT (Pemberian Makanan Tambahan) tinggi protein."); }
                if (diag.length===0 && form.weight) { diag.push("Pertumbuhan Balita Normal"); rec.push("Lanjutkan ASI/MPASI bergizi seimbang."); }
            } else {
                if (form.tension) {
                    const sys = parseInt(form.tension.split('/')[0]);
                    if (sys >= 140) { diag.push("Hipertensi (Darah Tinggi)"); rec.push("Kurangi asupan garam/natrium, rutin cek tekanan darah, kurangi stres."); }
                    else if (sys <= 90) { diag.push("Hipotensi (Darah Rendah)"); rec.push("Istirahat cukup, perbanyak asupan cairan dan makanan bergizi."); }
                }
                if (form.bloodSugar && parseFloat(form.bloodSugar) >= 200) { diag.push("Gula Darah Tinggi"); rec.push("Kurangi karbohidrat, hindari minuman manis, segera rujuk ke faskes."); }
                if (form.cholesterol && parseFloat(form.cholesterol) >= 200) { diag.push("Hiperkolesterolemia"); rec.push("Hindari makanan bersantan, gorengan, dan lemak jenuh."); }
                if (form.uricAcid && parseFloat(form.uricAcid) >= 7.0) { diag.push("Asam Urat Tinggi"); rec.push("Kurangi asupan jeroan, kacang-kacangan, dan perbanyak minum air putih."); }
                if (form.armCirc && parseFloat(form.armCirc) < 23.5 && cat === 'ibu_hamil') { diag.push("Risiko KEK Kehamilan"); rec.push("Tingkatkan asupan makanan padat kalori & protein hewani."); }
                if (form.bellyCirc && parseFloat(form.bellyCirc) > 90) { diag.push("Risiko Sindrom Metabolik"); rec.push("Olahraga kardio rutin 30 menit sehari & pantau diet."); }
                
                if (diag.length===0 && (form.weight||form.tension)) { diag.push("Indikator Normal"); rec.push("Pertahankan gaya hidup sehat (CERDIK) dan olahraga teratur."); }
            }
            return { diagnosis: diag.length ? diag.join(", ") : "Menunggu Data", recommendation: rec.length ? rec.join(" ") : "-" };
        };

        function CustomBarChart({ data }) {
            return (
                <div className="flex items-end justify-around h-full pt-4 border-b-2 border-slate-200 dark:border-slate-700 gap-2">
                    {data.map((item, i) => (
                        <div key={i} className="flex flex-col items-center flex-1 h-full justify-end group">
                            <div className="w-full flex justify-center gap-1.5 items-end h-[85%] relative">
                                <div style={{height: Math.min((item.Terdaftar||0) * 5, 100) + '%'}} className="w-1/3 bg-slate-300 dark:bg-slate-700 rounded-t-lg transition-all"></div>
                                <div style={{height: Math.min((item.Hadir||0) * 10, 100) + '%'}} className="w-1/3 bg-indigo-500 rounded-t-lg transition-all shadow-md"></div>
                            </div>
                            <p className="text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-2 text-center leading-tight truncate w-full">{item.name}</p>
                        </div>
                    ))}
                </div>
            )
        }

        function TrendChart({ title, data, color }) {
            if (!data || data.length < 2) return null;
            const width = 280; const height = 110; const padX = 25; const padY = 30;
            const vals = data.map(d => d.value);
            const max = Math.max(...vals); const min = Math.min(...vals);
            const range = max - min || 1;

            const pts = data.map((d, i) => {
                const x = padX + (i * ((width - 2 * padX) / (data.length - 1)));
                const y = height - padY - (((d.value - min) / range) * (height - 2 * padY));
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm flex-1 min-w-[260px]">
                    <h5 className="text-xs font-black text-slate-500 dark:text-slate-400 mb-2">{title}</h5>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-24 overflow-visible">
                        <line x1={padX} y1={padY} x2={width-padX} y2={padY} stroke="#cbd5e1" strokeDasharray="4" className="dark:opacity-30" />
                        <line x1={padX} y1={height-padY} x2={width-padX} y2={height-padY} stroke="#cbd5e1" strokeDasharray="4" className="dark:opacity-30" />
                        <polyline points={pts} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                        {data.map((d, i) => {
                            const x = padX + (i * ((width - 2 * padX) / (data.length - 1)));
                            const y = height - padY - (((d.value - min) / range) * (height - 2 * padY));
                            return (
                                <g key={i}>
                                    <circle cx={x} cy={y} r="4" fill="white" stroke={color} strokeWidth="2" />
                                    <text x={x} y={y - 8} fontSize="10" fill="currentColor" className="text-slate-700 dark:text-slate-200 font-black" textAnchor="middle">{d.value}</text>
                                    <text x={x} y={height} fontSize="9" fill="currentColor" className="text-slate-400 font-bold" textAnchor="middle">{d.label}</text>
                                </g>
                            )
                        })}
                    </svg>
                </div>
            );
        }

        function ParticipantCharts({ participant, records }) {
            const chartHist = [...records].sort((a,b) => (a.date||'') > (b.date||'') ? 1 : -1); 
            
            if (chartHist.length < 2) return (
                <div className="mb-6 bg-indigo-50 dark:bg-indigo-950/40 p-5 rounded-3xl border-2 border-indigo-100 dark:border-indigo-900 text-center text-sm font-bold text-indigo-700 dark:text-indigo-300 shadow-sm animate-fade-in">
                    <i className="fa-solid fa-chart-line text-indigo-400 text-4xl mb-3 block"></i>
                    Grafik Tren Kesehatan Warga akan otomatis muncul di sini setelah warga memiliki <br/> <b>minimal 2 (dua) riwayat pemeriksaan</b> di tanggal yang berbeda.
                </div>
            );

            const wData = chartHist.filter(r=>r.weight).map(r=>({label:r.date.slice(5), value:parseFloat(r.weight)}));
            const tData = chartHist.filter(r=>r.tension).map(r=>({label:r.date.slice(5), value:parseInt((r.tension||'').split('/')[0])})).filter(d=>!isNaN(d.value));
            const sData = chartHist.filter(r=>r.bloodSugar).map(r=>({label:r.date.slice(5), value:parseFloat(r.bloodSugar)})).filter(d=>!isNaN(d.value));

            return (
                <div className="mb-6">
                    <h5 className="font-black text-sm text-slate-800 dark:text-slate-100 mb-3 flex items-center gap-2"><i className="fa-solid fa-chart-line text-indigo-500"></i> Grafik Perkembangan ILP</h5>
                    <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar">
                        {wData.length >= 2 && <TrendChart title="Grafik Berat Badan (kg)" data={wData} color="#3b82f6" />}
                        {tData.length >= 2 && <TrendChart title="Tensi Darah (Sistolik)" data={tData} color="#a855f7" />}
                        {sData.length >= 2 && <TrendChart title="Grafik Gula Darah" data={sData} color="#f59e0b" />}
                    </div>
                </div>
            );
        }

        function MainApp() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [localMode, setLocalMode] = useState(false);
            const [firebaseDb, setFirebaseDb] = useState(null);

            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [showPwd, setShowPwd] = useState(false);
            const [siklus, setSiklus] = useState('all');
            const [menuGroups, setMenuGroups] = useState({ master: true, report: true, service: true, siklus: true });
            const toggleGroup = (key) => setMenuGroups(prev => ({...prev, [key]: !prev[key]}));

            const [darkMode, setDarkMode] = useState(() => getSafeLocal('pos_ilp_dark', false));
            const [fontSizeScale, setFontSizeScale] = useState(() => getSafeLocal('pos_ilp_font', 'normal'));

            const [complaints, setComplaints] = useState(() => getSafeLocal('pos_ilp_complaints', []));
            const [schedule, setSchedule] = useState(() => getSafeLocal('pos_ilp_schedule', { days: [1,2,3,4,5,6], startTime: '07:00', endTime: '13:00', isOpen: true, serviceDate: '' }));
            const [credentials, setCredentials] = useState(() => getSafeLocal('pos_ilp_creds', { admin: '123', mawar1: '123', mawar2: '123', mawar3: '123', mawar4: '123', mawar5: '123' }));

                    if (!finalConfig) { setLocalMode(true); return; }
                    try {
                        const app = fb.initializeApp(finalConfig); const auth = fb.getAuth(app); const db = fb.getFirestore(app);
                        setFirebaseDb(db); await fb.signInAnonymously(auth); fb.onAuthStateChanged(auth, (u) => { setUser(u); });
                    } catch(e) { setLocalMode(true); }
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (localMode || !firebaseDb || !user) return;
                const fb = window.FirebaseMod;
                const unsubs = [];
                const handleError = (e) => { setLocalMode(true); };
                try {
                    unsubs.push(fb.onSnapshot(fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', 'schedule'), d => { if (d.exists()) { setSchedule(d.data()); setLocal('pos_ilp_schedule', d.data()); } }, handleError));
                    unsubs.push(fb.onSnapshot(fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', 'credentials'), d => { if (d.exists()) { setCredentials(d.data()); setLocal('pos_ilp_creds', d.data()); } }, handleError));
                    const collections = ['cadres', 'participants', 'attendances', 'health', 'complaints'];
                    const setters = [setCadres, setParticipants, setAttendances, setHealthRecords, setComplaints];
                    collections.forEach((colName, index) => {
                        unsubs.push(fb.onSnapshot(fb.collection(firebaseDb, 'artifacts', appId, 'public', 'data', colName), snap => {
                            const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setters[index](data); setLocal(`pos_ilp_${colName}`, data);
                        }, handleError));
                    });
                } catch(e) { handleError(e); }
                return () => { unsubs.forEach(u => u()); };
            }, [user, localMode, firebaseDb]);

            const syncData = async (colName, id, data, isDelete = false) => {
                const payload = { id, ...data, timestamp: new Date().toISOString() };
                const updater = (setFunc) => setFunc(prev => { 
                    const safePrev = Array.isArray(prev) ? prev : []; 
                    return isDelete ? safePrev.filter(i => i.id !== id) : [...safePrev.filter(i => i.id !== id), payload]; 
                });
                
                if (colName === 'cadres') updater(setCadres);
                if (colName === 'participants') updater(setParticipants);
                if (colName === 'attendances') updater(setAttendances);
                if (colName === 'health') updater(setHealthRecords);
                if (colName === 'complaints') updater(setComplaints);
                if (colName === 'settings') { if (id === 'schedule') setSchedule(data); if (id === 'credentials') setCredentials(data); }

                if (localMode || !firebaseDb || !user) return; 
                try {
                    const fb = window.FirebaseMod;
                    if (isDelete) { await fb.deleteDoc(fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', colName, id)); } 
                    else {
                        const path = colName === 'settings' ? fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', id) : fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', colName, id);

                    <div className="bottom-nav md:hidden no-print">
                        {(isAdmin

        function LifeRing() {
            const R = 118, C = 2 * Math.PI * R, GAP = 5, SEG = (360 - GAP * 5) / 5, segLen = C * SEG / 360;
            return (
                <div className="life-ring" role="img" aria-label="Lima siklus hidup: ibu hamil dan menyusui, bayi dan balita, anak dan remaja, usia dewasa, lansia">
                    <div className="ring-spin">
                    <svg viewBox="0 0 320 320" className="life-ring-svg" aria-hidden="true">
                        {ILP_CATEGORIES.map((c, i) => (
                            <circle key={c.id} className={`ring-arc sk-${c.id}`} cx="160" cy="160" r={R} fill="none" strokeWidth="18"
                                strokeDasharray={`${segLen} ${C - segLen}`}
                                transform={`rotate(${-90 + GAP / 2 + i * (SEG + GAP)} 160 160)`}
                                style={{ stroke: 'var(--sc)', '--len': segLen, '--i': i }} />
                        ))}
                        <circle className="ring-runner" cx="160" cy="160" r={R} fill="none" strokeWidth="5" strokeLinecap="round" strokeDasharray={`10 ${C - 10}`} style={{ '--C': C }} />
                    </svg>
                    {ILP_CATEGORIES.map((c, i) => {
                        const a = (-90 + GAP / 2 + i * (SEG + GAP) + SEG / 2) * Math.PI / 180;
                        const x = 50 + (R / 320 * 100) * Math.cos(a), y = 50 + (R / 320 * 100) * Math.sin(a);
                        return <span key={c.id} className={`ring-badge sk-${c.id}`} style={{ left: x + '%', top: y + '%', '--i': i }}><i className={`fa-solid ${c.icon}`}></i></span>;
                    })}
                    </div>
                    <span className="ring-pulse"></span><span className="ring-pulse d2"></span>
                    <img className="ring-logo" src={window.POS_LOGO} alt="" />
                </div>
            );
        }

        function NavItem({ icon, label, active, onClick, sk, count }) {

                    <span className="truncate">{label}</span>

        }

        /* ===== Agen AI: mesin penalaran lokal atas data nyata aplikasi ===== */
        const AI_KB = [
            { k:['stunting','pendek','tinggi badan anak'], t:'Stunting', a:'Stunting adalah gagal tumbuh akibat kurang gizi kronis dan infeksi berulang, terutama pada 1.000 hari pertama kehidupan. Pencegahan: ASI eksklusif 6 bulan, MPASI kaya protein hewani (telur, ikan, hati ayam) mulai usia 6 bulan, timbang dan ukur panjang/tinggi badan setiap bulan, imunisasi lengkap, air bersih dan sanitasi, serta TTD dan ANC pada ibu hamil. Bila tinggi menurut umur di bawah -2 SD, rujuk ke Puskesmas.' },
            { k:['ttd','tablet tambah darah'], t:'TTD', a:'Ibu hamil perlu minimal 90 tablet tambah darah selama kehamilan, 1 tablet per hari. Minum malam hari atau bersama jeruk/vitamin C, jangan dengan teh, kopi, atau susu. Tinja kehitaman dan mual ringan itu wajar; bila mengganggu, minum setelah makan.' },
            { k:['anc','kunjungan hamil','periksa hamil','tanda bahaya hamil','usg'], t:'ANC', a:'Pemeriksaan kehamilan (ANC) minimal 6 kali: 1 kali di trimester 1 (dengan USG dokter), 2 kali di trimester 2, dan 3 kali di trimester 3 (dengan USG dokter). Tanda bahaya yang harus segera ke fasilitas kesehatan: perdarahan, kejang, bengkak wajah/tangan, sakit kepala hebat, pandangan kabur, gerak janin berkurang, ketuban pecah dini, demam tinggi.' },
            { k:['imunisasi','vaksin'], t:'Imunisasi', a:'Imunisasi dasar lengkap untuk bayi meliputi HB-0, BCG, polio, DPT-HB-Hib, IPV, dan campak-rubela (MR) usia 9 bulan, dilanjutkan imunisasi lanjutan sekitar usia 18 bulan. Cek jadwal tepatnya di buku KIA dan kejar imunisasi yang terlewat ke posyandu atau Puskesmas.' },
            { k:['mpasi','mp-asi','makanan pendamping'], t:'MPASI', a:'MPASI dimulai tepat usia 6 bulan dengan tekstur bertahap. Pastikan ada karbohidrat, protein hewani, protein nabati, lemak, serta sayur dan buah. Hindari gula dan garam berlebih, dan jangan beri madu sebelum usia 1 tahun.' },
            { k:['asi','menyusui','imd'], t:'ASI', a:'Mulai dengan Inisiasi Menyusu Dini, ASI eksklusif sampai 6 bulan tanpa makanan atau minuman lain, lalu lanjutkan ASI hingga 2 tahun bersama MPASI. Ibu menyusui perlu tambahan makan dan cairan, dan tetap lanjut TTD sesuai anjuran.' },
            { k:['hipertensi','darah tinggi','tensi','tekanan darah'], t:'Hipertensi', a:'Hipertensi bila tekanan darah 140/90 mmHg atau lebih pada pengukuran berulang. Anjuran: batasi garam (sekitar 1 sendok teh per hari), olahraga 150 menit per minggu, jauhi rokok, jaga berat badan, kontrol rutin dan minum obat teratur bila diresepkan. Tekanan 180/110 atau lebih, atau disertai nyeri dada, sesak, lemah satu sisi tubuh: segera ke IGD.' },
            { k:['diabetes','kencing manis','gula darah'], t:'Diabetes', a:'Gula darah sewaktu 200 mg/dL atau lebih dengan gejala (sering haus, sering kencing, berat badan turun) mengarah ke diabetes; gula puasa 126 atau lebih juga demikian. Skrining posyandu belum cukup untuk diagnosis, jadi rujuk ke Puskesmas untuk pemeriksaan konfirmasi. Kurangi minuman manis dan karbohidrat berlebih, perbanyak aktivitas fisik.' },
            { k:['kolesterol'], t:'Kolesterol', a:'Kolesterol total 200 mg/dL atau lebih termasuk batas tinggi. Kurangi gorengan, santan, jeroan, dan lemak jenuh; tambah serat (sayur, buah, kacang-kacangan) dan olahraga rutin 30 menit per hari.' },
            { k:['asam urat'], t:'Asam urat', a:'Asam urat tinggi bila di atas sekitar 7 mg/dL pada pria atau 6 mg/dL pada wanita. Batasi jeroan, emping, sebagian seafood, dan alkohol; minum air putih sekitar 2 liter per hari; jaga berat badan. Nyeri sendi berat dan bengkak perlu diperiksa dokter.' },
            { k:['anemia','hb','hemoglobin','rematri','kurang darah'], t:'Anemia', a:'Anemia bila Hb di bawah 11 g/dL pada ibu hamil, di bawah 12 pada remaja putri dan wanita, di bawah 13 pada pria. Remaja putri dianjurkan minum 1 tablet tambah darah per minggu. Perbanyak hati ayam, daging merah, ikan, sayur hijau, dengan sumber vitamin C.' },
            { k:['kek','kurang energi kronis','lila'], t:'KEK', a:'Ibu hamil atau wanita usia subur dengan LILA di bawah 23,5 cm berisiko KEK. Beri makan lebih sering dalam porsi kecil yang padat gizi (protein hewani, kacang-kacangan), dapatkan PMT, dan pantau berat badan setiap bulan. Pada balita, LILA di bawah 11,5 cm berarti risiko gizi buruk.' },
            { k:['jatuh','lansia aktif','aks','pikun','demensia'], t:'Lansia', a:'Cegah jatuh pada lansia: lantai tidak licin, pencahayaan cukup, alas kaki sesuai, pegangan di kamar mandi, latihan keseimbangan, dan bangun perlahan dari posisi duduk. Skrining rutin tekanan darah, gula darah, kemandirian aktivitas harian, dan daya ingat.' },
            { k:['cerdik','gaya hidup sehat','ptm'], t:'CERDIK', a:'CERDIK: Cek kesehatan berkala, Enyahkan asap rokok, Rajin aktivitas fisik, Diet seimbang, Istirahat cukup, Kelola stres. Ini kunci mencegah penyakit tidak menular (hipertensi, diabetes, jantung, stroke).' },
            { k:['gizi seimbang','isi piringku','porsi makan','gula garam lemak'], t:'Isi Piringku', a:'Isi Piringku: setengah piring sayur dan buah, setengah piring makanan pokok dan lauk-pauk. Batas harian gula-garam-lemak: gula 4 sendok makan, garam 1 sendok teh, lemak 5 sendok makan.' }
        ];
        const AI_SIK = [
            ['ibu_hamil','Ibu hamil & menyusui',['hamil','bumil','menyusui','busui','ibu hamil']],
            ['balita','Bayi & balita',['balita','bayi','batita','kms']],
            ['remaja','Anak & remaja',['remaja','anak sekolah','rematri']],
            ['dewasa','Dewasa produktif',['dewasa','produktif']],
            ['lansia','Lansia',['lansia','manula','jompo']]
        ];
        const aiNum = (v) => parseFloat(String(v == null ? '' : v).replace(',', '.'));
        const aiFlags = (h) => {
            const f = [];
            if (h.tension) { const [sy, di] = String(h.tension).split('/').map(aiNum); if (sy >= 140 || di >= 90) f.push('Hipertensi'); }
            if (aiNum(h.bloodSugar) >= 200) f.push('Gula darah tinggi');
            if (aiNum(h.cholesterol) >= 200) f.push('Kolesterol tinggi');
            if (aiNum(h.uricAcid) >= 7) f.push('Asam urat tinggi');
            if (h.ilpCategory === 'balita' && aiNum(h.armCirc) < 11.5) f.push('Risiko gizi buruk');
            if (h.ilpCategory === 'balita' && aiNum(h.headCirc) < 32) f.push('Lingkar kepala kurang');
            if (h.ilpCategory === 'ibu_hamil' && aiNum(h.armCirc) < 23.5) f.push('Risiko KEK');
            if (h.weight && h.height && h.ilpCategory !== 'balita') { const m = aiNum(h.height) / 100; if (aiNum(h.weight) / (m * m) >= 30) f.push('Obesitas'); }
            return f;
        };

        function aiBrain(q, d, mem) {
            const t = ' ' + q.toLowerCase().replace(/[?!]/g, ' ') + ' ';
            const m = (w) => new RegExp('(^|[^a-z])' + w.replace(/[-.]/g, '\\$&')).test(t);
            const has = (...ws) => ws.some(m);
            const steps = [];
            const staff = !!d.role, admin = d.role === 'admin';
            const scopeP = (!staff || admin) ? null : d.role;
            const posName = (id) => d.posyanduList.find(p => p.id === id)?.name || id;
            const today = new Date().toISOString().split('T')[0];
            const parts = d.participants.filter(p => !scopeP || p.posyandu === scopeP);
            const cads = d.cadres.filter(c => !scopeP || c.posyandu === scopeP);
            const atts = d.attendances.filter(a => !scopeP || a.posyandu === scopeP);
            const attToday = atts.filter(a => a.date === today);
            const lastH = {};
            d.healthRecords.filter(h => !scopeP || h.posyandu === scopeP).forEach(h => { if (!lastH[h.participantId] || (h.date || '') > (lastH[h.participantId].date || '')) lastH[h.participantId] = h; });
            const label = scopeP ? posName(scopeP) : 'seluruh posyandu';
            const gOf = (a) => a.type === 'cadre' ? 'kader' : (a.ilpCategory || d.participants.find(p => p.id === a.personId)?.ilpCategory);
            const skObj = AI_SIK.find(s => s[2].some(m));
            let sk = skObj ? skObj[0] : null;
            const skName = (id) => id === 'kader' ? 'Kader' : (AI_SIK.find(s => s[0] === id)?.[1] || id);
            const pct = (a, b) => b ? Math.round(a * 100 / b) + '%' : '-';
            steps.push(`Cakupan data: ${label}${staff ? '' : ' (mode umum, hanya angka agregat)'}`);

            const num = (re) => { const r = t.match(re); return r ? aiNum(r[r.length - 1]) : NaN; };
            const tn = t.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
            const gl = num(/(gula|gds|gdp|glukosa)[^0-9]{0,18}(\d{2,3})/);
            const kl = num(/kolesterol[^0-9]{0,18}(\d{2,3})/);
            const au = num(/asam urat[^0-9]{0,18}(\d{1,2}(?:[.,]\d)?)/);
            const la = num(/(lila|lingkar lengan)[^0-9]{0,18}(\d{1,2}(?:[.,]\d)?)/);
            const hb = num(/(hb|hemoglobin)[^0-9]{0,18}(\d{1,2}(?:[.,]\d)?)/);
            const bb = num(/(bb|berat)[^0-9]{0,18}(\d{2,3}(?:[.,]\d)?)/);
            const tb = num(/(tb|tinggi)[^0-9]{0,18}(\d{2,3})/);
            const readings = [];
            if (tn) { const sy = +tn[1], di = +tn[2]; readings.push(sy >= 180 || di >= 110 ? `Tekanan darah ${sy}/${di}: **sangat tinggi (kategori berat)**. Jika disertai nyeri dada, sesak, sakit kepala hebat atau lemah satu sisi, segera ke IGD; bila tanpa gejala, rujuk ke Puskesmas hari ini.` : sy >= 140 || di >= 90 ? `Tekanan darah ${sy}/${di}: **di atas batas skrining (hipertensi)**. Ulangi ukur setelah istirahat 5 menit; bila tetap tinggi, rujuk ke Puskesmas. Kurangi garam dan pantau rutin.` : sy >= 120 || di >= 80 ? `Tekanan darah ${sy}/${di}: **batas atas normal / pra-hipertensi**. Jaga pola makan rendah garam, olahraga, dan cek berkala.` : sy < 90 || di < 60 ? `Tekanan darah ${sy}/${di}: **cenderung rendah**. Perbanyak cairan, bangun perlahan, dan periksa bila pusing atau pingsan.` : `Tekanan darah ${sy}/${di}: **normal**.`); }
            if (gl === gl) readings.push(gl >= 200 ? `Gula darah ${gl} mg/dL: **tinggi**, perlu pemeriksaan konfirmasi (gula puasa/HbA1c) di Puskesmas.` : gl >= 140 ? `Gula darah ${gl} mg/dL: **di atas normal (batas)**. Jika sewaktu, periksa gula puasa untuk memastikan.` : gl < 70 ? `Gula darah ${gl} mg/dL: **rendah**. Beri minuman manis segera, lalu rujuk bila tidak membaik.` : `Gula darah ${gl} mg/dL: **dalam batas normal**.`);
            if (kl === kl) readings.push(kl >= 240 ? `Kolesterol ${kl}: **tinggi**. Rujuk dan ubah pola makan.` : kl >= 200 ? `Kolesterol ${kl}: **batas tinggi**. Kurangi lemak jenuh dan gorengan.` : `Kolesterol ${kl}: **normal**.`);
            if (au === au) readings.push(au >= 7 ? `Asam urat ${au}: **tinggi**. Batasi jeroan dan alkohol, banyak minum air putih.` : `Asam urat ${au}: **dalam batas normal**.`);
            if (la === la) readings.push(has('balita', 'bayi', 'anak') ? (la < 11.5 ? `LILA ${la} cm pada balita: **risiko gizi buruk**. Beri PMT tinggi protein dan rujuk ke Puskesmas.` : `LILA ${la} cm pada balita: **normal**.`) : (la < 23.5 ? `LILA ${la} cm: **risiko KEK**. Tingkatkan makanan padat gizi dan beri PMT.` : `LILA ${la} cm: **normal**.`));
            if (hb === hb) readings.push(hb < 11 ? `Hb ${hb} g/dL: **anemia** (ambang ibu hamil 11, wanita/remaja putri 12). Beri TTD, perbanyak hati ayam dan sayur hijau, rujuk bila Hb di bawah 8.` : hb < 12 ? `Hb ${hb} g/dL: **anemia pada remaja putri/wanita**, normal untuk pria bila di atas 13 tidak terpenuhi. Beri TTD dan makanan kaya zat besi.` : `Hb ${hb} g/dL: **dalam batas normal**.`);
            if (bb === bb && tb === tb) { const mm = tb / 100, bmi = bb / (mm * mm); readings.push(`IMT ${bmi.toFixed(1)}: **${bmi >= 30 ? 'obesitas' : bmi >= 25 ? 'berat badan lebih' : bmi < 18.5 ? 'kurus' : 'normal'}** (untuk dewasa; balita memakai kurva pertumbuhan).`); }
            if (readings.length) {
                steps.push(`Mengenali ${readings.length} angka pada pertanyaan, lalu membandingkan dengan ambang skrining yang dipakai aplikasi`);
                return { intent: 'angka', sk, steps, text: readings.join('\n') + '\n\nIni skrining awal, bukan diagnosis. Hasil di luar batas normal perlu dikonfirmasi tenaga kesehatan.', chips: ['Peringatan dini hari ini', 'Cara menurunkan tensi', 'Ringkasan kehadiran'] };
            }

            let intent = null;
            if (has('cara', 'bagaimana', 'gimana', 'langkah', 'tutorial', 'dimana', 'di mana', 'caranya') && has('absen', 'hadir', 'scan', 'tambah', 'daftar', 'cetak', 'kartu', 'export', 'excel', 'backup', 'cadangan', 'pengaduan', 'sandi', 'password', 'gelap', 'rekam medis', 'skrining', 'jadwal')) intent = 'howto';
            else if (has('halo', 'hai', 'hallo', 'selamat', 'bantu', 'bisa apa', 'fitur', 'menu', 'help')) intent = 'menu';
            else if (has('peringatan', 'risiko', 'bahaya', 'rujuk', 'kritis', 'berisiko', 'waspada', 'abnormal', 'prioritas')) intent = 'alert';
            else if (has('belum diskrining', 'cakupan', 'belum diperiksa', 'belum skrining', 'sudah diskrining', 'capaian')) intent = 'coverage';
            else if (has('kader') && has('hadir', 'absen', 'kehadiran', 'siapa')) intent = 'cadre';
            else if (has('hari ini', 'kehadiran', 'hadir', 'absen', 'rekap', 'ringkasan', 'laporan', 'kunjungan')) intent = 'attendance';
            else if (has('jadwal', 'buka', 'tutup', 'jam layanan', 'kapan')) intent = 'schedule';
            else if (staff && parts.some(p => p.name && p.name.length > 2 && t.includes(p.name.toLowerCase()))) intent = 'person';
            else if (has('berapa', 'jumlah', 'total', 'terdaftar', 'warga', 'peserta', 'data')) intent = 'count';
            const kb = AI_KB.find(e => e.k.some(m));
            if (!intent && kb) intent = 'edu';
            if (intent === 'edu' && !kb) intent = null;
            if (!intent && sk) intent = mem.intent && ['attendance', 'alert', 'coverage', 'count'].includes(mem.intent) ? mem.intent : 'count';
            if (!intent && mem.intent && has('lalu', 'kalau', 'bagaimana dengan', 'terus', 'itu', 'tadi', 'selanjutnya')) { intent = mem.intent; steps.push('Pertanyaan lanjutan: memakai topik sebelumnya'); }
            if (sk == null && has('itu', 'tadi', 'mereka') && mem.sk) { sk = mem.sk; steps.push(`Konteks dipertahankan: ${skName(sk)}`); }
            if (intent === 'edu' && kb && ['hipertensi', 'diabetes', 'kolesterol', 'asam urat'].includes(kb.t.toLowerCase()) && false) intent = 'edu';
            steps.push(`Maksud dikenali: ${intent || 'tidak jelas'}${sk ? ' · siklus ' + skName(sk) : ''}`);

            const mk = (text, chips) => ({ intent, sk, steps, text, chips: chips || [] });

            if (intent === 'attendance') {
                const keys = sk ? [sk] : ['ibu_hamil', 'balita', 'remaja', 'dewasa', 'lansia', 'kader'];

                const dates = [...new Set(atts.map(a => a.date))].filter(x => x < today).sort();
                if (dates.length) { const pd = dates[dates.length - 1]; const pc = atts.filter(a => a.date === pd).length; out += `\n\nPembanding: pelayanan terakhir (${pd}) tercatat ${pc} hadir, hari ini ${attToday.length >= pc ? 'sama atau lebih tinggi' : 'lebih rendah ' + (pc - attToday.length) + ' orang'}.`; }

            if (intent === 'cadre') {

            if (intent === 'alert') {

            if (intent === 'person') {

                const hadir = attToday.some(a => a.personId === p.id);

            if (intent === 'schedule') {

                return mk(`Layanan ${d.isOpen ? '**sedang dibuka**' : '**sedang tutup**'}.\n` + (sc.serviceDate ? `Tanggal pelayanan khusus: ${sc.serviceDate}\n` : `Hari buka: ${(sc.days || []).map(x => hari[x]).join(', ') || '-'}\n`) + `Jam: ${sc.startTime || '07:00'} sampai ${sc.endTime || '13:00'}. Absen hanya bisa dilakukan pada jam tersebut.`, ['Cara absen']);

            if (intent === 'howto') {
                steps.push('Mencocokkan panduan fitur aplikasi');
                if (has('absen', 'hadir', 'scan')) return mk('**Absen:** dari halaman login ketuk "Absen sekarang", pilih posyandu, cari nama atau scan kartu QR, lalu ketuk Hadir. Petugas juga bisa memakai menu "Scan kehadiran". Absen hanya terbuka pada jam pelayanan.', ['Jadwal layanan']);
                if (has('tambah', 'daftar')) return mk('**Tambah warga:** masuk sebagai petugas, buka "Data warga", pilih Tambah, isi NIK dan data diri, tentukan siklus hidup, lalu Simpan.', ['Cara cetak kartu']);

                if (has('export', 'excel')) return mk('**Export:** buka Laporan kehadiran atau Laporan pelayanan, lalu ketuk tombol Export Excel.', []);

                setTimeout(() => {
                    let r;

                    catch (e) { r = { text: 'Maaf, terjadi kendala saat membaca data. Coba ulangi pertanyaannya.', steps: [], chips: [], intent: null, sk: null }; }
                    mem.current = { intent: r.intent || mem.current.intent, sk: r.sk || mem.current.sk };
                    const id = Date.now() + 1; const words = r.text.split(/(\s+)/); let i = 0, cur = '';
                    setMsgs(p => [...p, { id, sender: 'ai', text: '', steps: r.steps, chips: [], done: false }]);
                    const iv = setInterval(() => {
                        const step = Math.min(words.length, i + 6); cur = words.slice(0, step).join(''); i = step;
                        setMsgs(p => p.map(x => x.id === id ? { ...x, text: cur } : x));
                        if (i >= words.length) { clearInterval(iv); setMsgs(p => p.map(x => x.id === id ? { ...x, text: r.text, chips: r.chips, done: true } : x)); setBusy(false); }
                    }, 25);

                    </button>

        function CycleRing({ items, total }) {
            const R = 78, C = 2 * Math.PI * R, GAP = 4;
            let acc = 0;
            return (
                <svg viewBox="0 0 200 200" className="w-full h-full" role="img" aria-label="Komposisi warga menurut siklus hidup">
                    <circle cx="100" cy="100" r={R} fill="none" strokeWidth="20" style={{ stroke: 'var(--surface-2)' }} />
                    {total > 0 && items.filter(s => s.total > 0).map(s => {
                        const share = s.total / total;
                        const len = Math.max(share * C - GAP, 1);
                        const start = acc; acc += share * C;
                        return <circle key={s.id} className={`sk-${s.id}`} cx="100" cy="100" r={R} fill="none" strokeWidth="20"
                            strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-start} transform="rotate(-90 100 100)"
                            style={{ stroke: 'var(--sc)' }} />;
                    })}
                </svg>
            );
        }

        function AttendanceService({ role, cadres, participants, attendances, isPosyanduOpen, schedule, syncData, showNotification }) {
            const [manualId, setManualId] = useState(''); const [useCamera, setUseCamera] = useState(false);
            const today = new Date().toISOString().split('T')[0];

            const handleScan = async (scannedId) => {
                if (!isPosyanduOpen()) return showNotification(`Sistem Tertutup. Di luar jadwal pelayanan.`, "error");
                const idToUse = scannedId || manualId; if (!idToUse) return;
                const cleanId = idToUse.trim().toUpperCase();
                const isCadre = cleanId.startsWith('KDR'); const isPart = cleanId.startsWith('ILP');
                if (!isCadre && !isPart) return showNotification("Format Barcode Tidak Dikenali!", "error");
                
                const person = isCadre ? (cadres||[]).find(c=>c.id===cleanId&&c.posyandu===role) : (participants||[]).find(p=>p.id===cleanId&&p.posyandu===role);
                if (!person) return showNotification(`ID ${cleanId} tidak terdaftar di Posyandu ini.`, "error");
                if ((attendances||[]).find(a=>a.personId===cleanId && a.date===today)) return showNotification(`${person.name} sudah hadir hari ini!`, "error");

                await syncData('attendances', `ATT-${Date.now()}`, { personId: cleanId, name: person.name, type: isCadre?'cadre':'participant', posyandu: role, date: today });
                showNotification(`BERHASIL: Kehadiran ${person.name} tercatat!`); setManualId('');
            };
            const tAtt = (attendances||[]).filter(a => a.posyandu === role && a.date === today);

            return (
                <div className="space-y-6">

                    {!isPosyanduOpen() && <div className="bg-red-50 dark:bg-red-950/40 p-6 rounded-3xl flex gap-5 border-l-8 border-red-500 shadow-sm items-center"><i className="fa-solid fa-triangle-exclamation text-red-600 text-4xl"></i><div><p className="font-black text-red-900 dark:text-red-200 text-lg">Sistem Scanner Terkunci Otomatis</p><p className="text-sm text-red-700 dark:text-red-400 font-bold mt-1">Saat ini di luar jadwal jam/tanggal pelayanan resmi.</p></div></div>}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm">
                            <div className="flex bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl mb-6"><button onClick={()=>setUseCamera(false)} className={`flex-1 py-3 rounded-xl font-black text-sm transition-all ${!useCamera?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-keyboard mr-2"></i> Ketik Manual</button><button onClick={()=>setUseCamera(true)} className={`flex-1 py-3 rounded-xl font-black text-sm flex justify-center items-center gap-2 transition-all ${useCamera?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-camera text-base"></i> Pakai Kamera</button></div>
                            {!useCamera ? (<div className="flex gap-2"><input type="text" value={manualId} onChange={e=>setManualId(e.target.value.toUpperCase())} placeholder="Ketik ID Barcode (ILP-XXX)" className="flex-1 border-2 dark:border-slate-700 rounded-2xl p-4 font-mono font-bold outline-none focus:border-indigo-500 text-lg uppercase bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100" disabled={!isPosyanduOpen()} /><button onClick={()=>handleScan(null)} disabled={!isPosyanduOpen()||!manualId} className="bg-indigo-600 text-white font-black px-8 py-4 rounded-2xl disabled:bg-slate-300 dark:disabled:bg-slate-800 shadow-md hover:bg-indigo-700 transition-all">HADIR</button></div>) : (<CameraScanner onScan={handleScan} isPosyanduOpen={isPosyanduOpen()} />)}

        /* Modul Kamera (Telah Dipulihkan 100%) */
        function CameraScanner({ onScan, isPosyanduOpen }) {
            const onScanRef = useRef(onScan);
            const [camError, setCamError] = useState(false);
            
            useEffect(() => { onScanRef.current = onScan; }, [onScan]);

            const startCam = () => {
                setCamError(false);
                if (isPosyanduOpen && window.Html5Qrcode) {
                    const scanner = new window.Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (t) => { onScanRef.current(t); }, () => {}).catch((e)=>{ setCamError(true); });
                    return scanner;
                }
                return null;
            };

            useEffect(() => {
                let scannerInst = startCam();
                return () => { if (scannerInst) { scannerInst.stop().then(() => scannerInst.clear()).catch(()=>{}); } };
            }, [isPosyanduOpen]);

            if (!isPosyanduOpen) return <div className="p-10 bg-slate-100 dark:bg-slate-800 text-slate-400 text-center rounded-2xl font-bold border-4 border-dashed border-slate-200 flex flex-col items-center h-64 justify-center"><i className="fa-solid fa-camera-slash text-5xl mb-4 opacity-50"></i>Kamera nonaktif karena posyandu tutup.</div>;
            return (
                <div className="text-center">
                    <div id="reader" className="w-full max-w-sm mx-auto bg-black rounded-3xl overflow-hidden shadow-inner min-h-[250px] border-4 border-indigo-200 relative flex items-center justify-center">
                        {camError && <div className="text-white p-4 font-bold text-sm"><p className="mb-3 text-rose-400"><i className="fa-solid fa-triangle-exclamation text-3xl"></i><br/>Kamera terhalang/ditolak.</p><button onClick={()=>{window.location.reload()}} className="bg-indigo-600 px-4 py-2 rounded-xl text-white font-black">Muat Ulang Halaman</button></div>}
                    </div>
                    <p className="mt-4 text-xs font-extrabold text-slate-500">Arahkan Kartu Barcode ke Kamera Anda</p>
                </div>
            );
        }

            const [sel, setSel] = useState(null); const [showChart, setShowChart] = useState(false);

            const handleSave = async (e) => { 
                e.preventDefault(); if(!sel) return;
                const analysis = getAnalysis(form, sel.ilpCategory);
                await syncData('health', `HLT-${sel.id}-${today}`, { participantId: sel.id, participantName: sel.name, ilpCategory: sel.ilpCategory, posyandu: role, date: today, autoDiagnosis: analysis.diagnosis, autoRecommendation: analysis.recommendation, ...form });
                showNotification(`Skrining kesehatan ${sel.name} tersimpan sukses!`); setShowChart(true); 
            };

            const catDetails = ilpCategories.find(c => c.id === sel?.ilpCategory) || {};
            const analysisData = sel ? getAnalysis(form, sel.ilpCategory) : {diagnosis:'', recommendation:''};

            return (
                <div className="space-y-6">

        function AdminAnalyticReport({ healthRecords, posyanduList, participants, ilpCategories }) {
            const [filterPos, setFilterPos] = useState('all');

            const alerts = [];
            let totalHipertensi = 0; let totalGulaTinggi = 0; let totalKolesterolTinggi = 0; let totalAsamUratTinggi = 0;

            (healthRecords || []).forEach(hr => {
                if (filterPos !== 'all' && hr.posyandu !== filterPos) return;
                const p = (participants || []).find(part => part.id === hr.participantId);
                if (!p) return;
                
                let issues = []; let isDanger = false;
                if (hr.tension) {
                    const parts = hr.tension.split('/');
                    if (parts.length === 2) {
                        const sys = parseInt(parts[0]); const dia = parseInt(parts[1]);
                        if (sys >= 140 || dia >= 90) { issues.push(`Hipertensi (${hr.tension})`); totalHipertensi++; isDanger = true; }
                    }
                }
                if (hr.bloodSugar) {
                    const sugar = parseInt(hr.bloodSugar.toString().replace(/[^0-9]/g, ''));
                    if (sugar >= 200) { issues.push(`Gula Tinggi (${hr.bloodSugar})`); totalGulaTinggi++; isDanger = true; }
                }
                if (hr.cholesterol) {
                    const chol = parseInt(hr.cholesterol.toString().replace(/[^0-9]/g, ''));
                    if (chol >= 200) { issues.push(`Kolesterol Tinggi (${hr.cholesterol})`); totalKolesterolTinggi++; isDanger = true; }
                }
                if (hr.uricAcid) {
                    const uric = parseFloat(hr.uricAcid.toString().replace(/[^0-9.]/g, ''));
                    if (uric >= 7.0) { issues.push(`Asam Urat Tinggi (${hr.uricAcid})`); totalAsamUratTinggi++; isDanger = true; }
                }

                if (isDanger) { alerts.push({ ...hr, issues, participantInfo: p }); }
            });

            alerts.sort((a,b) => (a.date||'') > (b.date||'') ? -1 : 1);

            return (
                <div className="bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 p-8 shadow-sm space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b dark:border-slate-800 pb-4">
                        <div>
                            <h2 className="text-2xl font-black flex items-center gap-3 text-slate-800 dark:text-slate-100">
                                <i className="fa-solid fa-triangle-exclamation text-rose-500"></i> Rekap Peringatan Dini PTM
                            </h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 font-bold mt-1">
                                Deteksi otomatis risiko PTM (Hipertensi, Diabetes, Kolesterol, Asam Urat).
                            </p>
                        </div>
                        <select value={filterPos} onChange={e=>setFilterPos(e.target.value)} className="border-2 dark:border-slate-700 p-3 rounded-xl font-bold outline-none focus:border-indigo-500 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm">
                            <option value="all">Semua Posyandu</option>
                            {posyanduList.filter(p=>p.id!=='admin').map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-rose-50 dark:bg-rose-950/40 p-4 rounded-2xl border border-rose-200 dark:border-rose-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-heart-pulse text-3xl text-rose-500 mb-2"></i>
                            <p className="text-[10px] font-black text-rose-700 dark:text-rose-400 uppercase">Hipertensi</p>
                            <p className="text-2xl font-black text-rose-900 dark:text-rose-200">{totalHipertensi} <span className="text-xs">Warga</span></p>
                        </div>
                        <div className="bg-amber-50 dark:bg-amber-950/40 p-4 rounded-2xl border border-amber-200 dark:border-amber-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-droplet text-3xl text-amber-500 mb-2"></i>
                            <p className="text-[10px] font-black text-amber-700 dark:text-amber-400 uppercase">Gula Tinggi</p>
                            <p className="text-2xl font-black text-amber-900 dark:text-amber-200">{totalGulaTinggi} <span className="text-xs">Warga</span></p>
                        </div>
                        <div className="bg-indigo-50 dark:bg-indigo-950/40 p-4 rounded-2xl border border-indigo-200 dark:border-indigo-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-bacon text-3xl text-indigo-500 mb-2"></i>
                            <p className="text-[10px] font-black text-indigo-700 dark:text-indigo-400 uppercase">Kolesterol</p>
                            <p className="text-2xl font-black text-indigo-900 dark:text-indigo-200">{totalKolesterolTinggi} <span className="text-xs">Warga</span></p>
                        </div>
                        <div className="bg-orange-50 dark:bg-orange-950/40 p-4 rounded-2xl border border-orange-200 dark:border-orange-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-bone text-3xl text-orange-500 mb-2"></i>
                            <p className="text-[10px] font-black text-orange-700 dark:text-orange-400 uppercase">Asam Urat</p>
                            <p className="text-2xl font-black text-orange-900 dark:text-orange-200">{totalAsamUratTinggi} <span className="text-xs">Warga</span></p>
                        </div>
                    </div>

                    <div className="overflow-x-auto custom-scrollbar pb-2">
                        <table className="w-full text-left whitespace-nowrap">
                            <thead>
                                <tr className="bg-slate-50 dark:bg-slate-800/80 border-b dark:border-slate-700">
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Tgl Periksa</th>
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Nama & Posyandu</th>
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Indikator Berbahaya</th>
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Rekomendasi Bidan</th>
                                </tr>
                            </thead>
                            <tbody>
                                {alerts.map(a => {
                                    const cObj = ilpCategories.find(c=>c.id===a.ilpCategory);
                                    return (
                                        <tr key={a.id} className="border-b dark:border-slate-800 text-sm hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            <td className="p-4 font-mono font-bold text-slate-500">{a.date}</td>
                                            <td className="p-4">
                                                <span className="font-black text-base text-slate-800 dark:text-slate-100">{a.participantName}</span><br/>
                                                <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400">{posyanduList.find(p=>p.id===a.posyandu)?.name} | {cObj?.name}</span>
                                            </td>
                                            <td className="p-4">
                                                <div className="flex flex-col gap-1.5">
                                                    {a.issues.map((issue, idx) => (
                                                        <span key={idx} className="bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 px-3 py-1 rounded-lg text-xs font-black border border-rose-200 dark:border-rose-800 w-fit">
                                                            <i className="fa-solid fa-circle-exclamation mr-1"></i> {issue}
                                                        </span>
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="p-4 text-xs font-bold text-slate-600 dark:text-slate-400 whitespace-normal min-w-[200px]">
                                                Rujuk warga ke Faskes (Puskesmas) untuk penanganan medis lanjutan dan sarankan diet seimbang.
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        {alerts.length === 0 && (
                            <div className="text-center py-16 text-slate-400">
                                <i className="fa-solid fa-shield-heart text-5xl mb-4 opacity-30 block"></i>
                                <p className="font-black text-lg">Bagus! Tidak ada warga dengan peringatan bahaya PTM.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                const headers = ["ID Unik", "Tanggal Masuk", "Jam", "Nama Individu", "Tipe Kehadiran", "Siklus", "Posyandu Pelaksana"];
                const rows = validAttendances.map(a => [a.personId || '-', a.date, a.time || '', a.name, a.type, sikOf(a), posyanduList.find(p=>p.id===a.posyandu)?.name || '']);
