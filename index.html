                    <div className="module-grid">{metrics.map(([label,value,icon])=><div className="module-metric" key={label}><span className="mi"><i className={`fa-solid ${icon}`}></i></span><div><div className="mn">{value}</div><div className="ml">{label}</div></div></div>)}</div>
                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                        <section className="module-card"><div className="module-card-head"><div><h3>Komposisi warga per siklus hidup</h3><p className="text-xs muted mt-1">Berdasarkan data warga aktif.</p></div><span className="module-tag">{p.length} warga</span></div><div className="space-y-4">{cycleData.map(x=><div key={x.id}><div className="flex justify-between gap-3 text-sm mb-1"><span>{x.name}</span><b>{x.total}</b></div><div className="h-2.5 rounded-full bg-[var(--surface-2)] overflow-hidden"><div className={`h-full rounded-full sk-${x.id}`} style={{width:p.length?`${Math.round(x.total/p.length*100)}%`:'0%',background:'var(--sc)'}}></div></div></div>)}</div></section>
                        <section className="module-card"><div className="module-card-head"><div><h3>Daftar yang perlu perhatian</h3><p className="text-xs muted mt-1">Pengecekan administratif berdasarkan catatan aplikasi.</p></div><span className="module-tag warn">{pendingRefs.length+lowStock.length+overdueVisits.length+expiredStock.length} item</span></div><div className="space-y-3">
                            <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-truck-medical mr-2 text-rose-500"></i>Rujukan belum selesai</span><b>{pendingRefs.length}</b></div>
                            <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-calendar-xmark mr-2 text-amber-500"></i>Kunjungan lewat jadwal</span><b>{overdueVisits.length}</b></div>
                            <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-box-open mr-2 text-orange-500"></i>Stok mencapai batas minimum</span><b>{lowStock.length}</b></div>
                            <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-calendar-xmark mr-2 text-rose-500"></i>Barang kedaluwarsa</span><b>{expiredStock.length}</b></div>
                            {lowStock.slice(0,4).map(x=><p key={x.id} className="text-xs muted">• {x.item}: {x.quantity} {x.unit||''} (minimum {x.minimum||0})</p>)}
                        </div></section>
                    </div>
                    <section className="module-card"><div className="module-card-head"><div><h3>Aktivitas terbaru</h3><p className="text-xs muted mt-1">10 aktivitas terbaru pada periode terpilih.</p></div><span className="module-tag">{activity.length} aktivitas</span></div><div className="module-table-wrap"><table className="module-table"><thead><tr><th>Tanggal</th><th>Aktivitas</th><th>Sasaran / topik</th><th>Posyandu</th></tr></thead><tbody>{activity.map((x,i)=><tr key={`${x.id||i}-${x._type}`}><td>{x.date||'-'}</td><td>{x._type}</td><td>{x._name||'-'}</td><td>{posyanduList.find(z=>z.id===x.posyandu)?.name||x.posyandu||'-'}</td></tr>)}{activity.length===0&&<tr><td colSpan="4" className="module-empty">Belum ada aktivitas pada periode ini.</td></tr>}</tbody></table></div></section>
                    <p className="module-note">Indikator ini merupakan ringkasan operasional dari catatan aplikasi, bukan pelaporan resmi e-PPGBM / ASIK / SATUSEHAT dan bukan penilaian klinis. Cocokkan dengan register, Buku KIA, dan format pelaporan Puskesmas sebelum digunakan untuk keputusan program.</p>
                </div>
            );
        }

        function FollowUpWorkspace({ role, isAdmin, participants, ancRecords, immunizations, homeVisits, referrals, posyanduList, onGo }) {
            const [filter, setFilter] = useState('all');
            const [selectedPos, setSelectedPos] = useState(isAdmin ? 'all' : role);
            const [search, setSearch] = useState('');
            const today = localDate();
            const plusDays = (n) => { const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return localDate(d); };
            const inScope = r => selectedPos === 'all' || r.posyandu === selectedPos;
            const getPersonName = r => {
                const p = (participants||[]).find(x=>x.id===r.participantId);
                return r.name || p?.name || r.item || 'Sasaran belum dipilih';
            };
            const items = [];
            const add = (rows, kind, tab) => (rows||[]).filter(inScope).forEach(r => {
                if (r.status === 'selesai') return;
                const due = String(r.nextDate || '').slice(0,10);
                const needsAction = !!due || ['perlu_tindak_lanjut','perlu_dikirim','dirujuk','dipantau','terjadwal'].includes(r.status);
                if (!needsAction) return;
                const bucket = !due ? 'unscheduled' : due < today ? 'overdue' : due === today ? 'today' : due <= plusDays(7) ? 'upcoming' : 'later';
                items.push({ id:r.id, key:`${kind}-${r.id}`, kind, tab, name:getPersonName(r), detail:r.type || r.topic || r.detail || r.destination || kind, date:due, bucket, status:r.status || 'tercatat', posyandu:r.posyandu, notes:r.notes || r.detail || '' });
            });
            add(ancRecords,'Pemantauan ibu','ilp-anc');
            add(immunizations,'Imunisasi / suplementasi','ilp-immun');
            add(homeVisits,'Kunjungan rumah','ilp-home');
            add(referrals,'Rujukan','ilp-referral');
            const matchQuery = x => !search.trim() || [x.name,x.kind,x.detail,x.notes].join(' ').toLowerCase().includes(search.trim().toLowerCase());

            const count = (b) => items.filter(x=>x.bucket===b).length;
            const label = x => ({overdue:'Terlambat',today:'Hari ini',upcoming:'Dalam 7 hari',later:'Jadwal lainnya',unscheduled:'Belum dijadwalkan'}[x]||x);
            const exportAgenda = () => exportToExcel('Agenda_Tindak_Lanjut',visible.map(x=>[x.date||'',label(x.bucket),x.name,x.kind,x.detail,x.posyandu||'',x.status||'',x.notes||'']),['Tanggal','Kategori','Nama sasaran','Modul','Layanan','Posyandu','Status','Catatan']);
            const posOptions = posyanduList.filter(x=>x.id!=='admin');
            return (
                <div className="module-shell">
                    <header className="module-hero">
                        <div className="relative z-10 flex items-start gap-4">
                            <span className="grid place-items-center w-12 h-12 rounded-2xl bg-white/15 text-2xl"><i className="fa-solid fa-calendar-check"></i></span>
                            <div><div className="module-eyebrow">PENGELOLAAN LAYANAN</div><h2>Agenda & tindak lanjut</h2><p>Satu daftar untuk memantau jadwal yang perlu dikerjakan dari seluruh modul ILP.</p><div className="mt-3 text-xs text-teal-100">{isAdmin ? 'Ruang kerja administrator · lintas posyandu' : `Ruang kerja · ${posyanduList.find(p=>p.id===role)?.name || role}`}</div></div>
                        </div>
                    </header>
                    <div className="module-grid">
                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-triangle-exclamation"></i></span><div><div className="mn">{count('overdue')}</div><div className="ml">Terlambat</div></div></div>
                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-calendar-day"></i></span><div><div className="mn">{count('today')}</div><div className="ml">Jadwal hari ini</div></div></div>
                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-calendar-week"></i></span><div><div className="mn">{count('upcoming')}</div><div className="ml">7 hari ke depan</div></div></div>
                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-calendar-plus"></i></span><div><div className="mn">{count('unscheduled')}</div><div className="ml">Belum dijadwalkan</div></div></div>
                    </div>
                    <section className="module-card">
                        <div className="module-card-head"><div><h3>Daftar agenda sasaran</h3><p className="text-xs muted mt-1">Sumber: ANC, imunisasi, kunjungan rumah, dan rujukan. Selesaikan pencatatan di modul asal.</p></div><span className="module-tag">{items.length} agenda</span></div>
                        <div className="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_220px] gap-2 mb-3">
                            <input className="field" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari nama, jenis layanan, atau catatan..." aria-label="Cari agenda" />
                            {isAdmin && <select className="field" value={selectedPos} onChange={e=>setSelectedPos(e.target.value)}><option value="all">Semua posyandu</option>{posOptions.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>}
                        </div>
                        <div className="flex flex-wrap gap-2 mb-4">
                            {[['all','Semua'],['overdue','Terlambat'],['today','Hari ini'],['upcoming','7 hari'],['later','Jadwal lainnya'],['unscheduled','Belum dijadwalkan']].map(([k,v])=><button key={k} className={`flt ${filter===k?'on':''}`} onClick={()=>setFilter(k)}>{v}</button>)}
                        </div>
                        <div className="space-y-2">
                            {visible.map(x=><article key={x.key} className="p-3 rounded-xl border border-[var(--line)] bg-[var(--surface-2)] flex flex-col sm:flex-row sm:items-center gap-3">
                                <div className={`w-11 h-11 rounded-xl grid place-items-center shrink-0 ${x.bucket==='overdue'?'bg-rose-100 text-rose-700':x.bucket==='today'?'bg-amber-100 text-amber-800':'bg-teal-100 text-teal-800'}`}><i className={`fa-solid ${x.kind==='Rujukan'?'fa-truck-medical':x.kind==='Kunjungan rumah'?'fa-house-medical':x.kind==='Imunisasi / suplementasi'?'fa-syringe':'fa-person-pregnant'}`}></i></div>
                                <div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><b>{x.name}</b><span className={`module-tag ${x.bucket==='overdue'?'warn':''}`}>{label(x.bucket)}</span></div><p className="text-sm mt-1">{x.kind} · {x.detail}</p><p className="text-xs muted mt-1">{x.date || 'Tanggal belum ditentukan'} · {posyanduList.find(p=>p.id===x.posyandu)?.name || x.posyandu || '-'}</p></div>

                            </article>)}
                            {visible.length===0 && <div className="module-empty"><i className="fa-regular fa-calendar-check text-3xl mb-2"></i><p>Tidak ada agenda pada filter ini.</p><p className="text-xs mt-1">Agenda dibuat dari tanggal tindak lanjut di modul layanan.</p></div>}
                        </div>
                    </section>
                    <p className="module-note">Daftar ini adalah pengingat administratif, bukan penilaian klinis otomatis. Jadwal dan prioritas layanan harus dikonfirmasi dengan petugas kesehatan serta SOP Puskesmas. Kondisi gawat darurat tidak boleh menunggu daftar agenda.</p>
                </div>
            );
        }

        function AdminAnalyticReport({ healthRecords, posyanduList, participants, ilpCategories }) {
            const [filterPos, setFilterPos] = useState('all');

            const alerts = [];
            let totalHipertensi = 0; let totalGulaTinggi = 0; let totalKolesterolTinggi = 0; let totalAsamUratTinggi = 0;

            (healthRecords || []).forEach(hr => {
                if (filterPos !== 'all' && hr.posyandu !== filterPos) return;
                const p = (participants || []).find(part => part.id === hr.participantId);
                if (!p) return;
                
                let issues = []; let isDanger = false;
                if (hr.tension) {
                    const bpx = parseBP(hr.tension);
                    if (bpx) {
                        const sys = bpx.sys; const dia = bpx.dia;
                        if (sys >= 140 || dia >= 90) { issues.push(`Hipertensi (${hr.tension})`); totalHipertensi++; isDanger = true; }
                    }
                }
                if (hr.bloodSugar) {
                    const sugar = parseInt(hr.bloodSugar.toString().replace(/[^0-9]/g, ''));
                    if (sugar >= 200) { issues.push(`Gula Tinggi (${hr.bloodSugar})`); totalGulaTinggi++; isDanger = true; }
                }
                if (hr.cholesterol) {
                    const chol = parseInt(hr.cholesterol.toString().replace(/[^0-9]/g, ''));
                    if (chol >= 200) { issues.push(`Kolesterol Tinggi (${hr.cholesterol})`); totalKolesterolTinggi++; isDanger = true; }
                }
                if (hr.uricAcid) {
                    const uric = parseFloat(hr.uricAcid.toString().replace(/[^0-9.]/g, ''));
                    if (uric >= 7.0) { issues.push(`Asam Urat Tinggi (${hr.uricAcid})`); totalAsamUratTinggi++; isDanger = true; }
                }

                if (isDanger) { alerts.push({ ...hr, issues, participantInfo: p }); }
            });

            alerts.sort((a,b) => (a.date||'') > (b.date||'') ? -1 : 1);

            return (
                <div className="bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 p-8 shadow-sm space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b dark:border-slate-800 pb-4">
                        <div>
                            <h2 className="text-2xl font-black flex items-center gap-3 text-slate-800 dark:text-slate-100">
                                <i className="fa-solid fa-triangle-exclamation text-rose-500"></i> Rekap Peringatan Dini PTM
                            </h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 font-bold mt-1">
                                Deteksi otomatis risiko PTM (Hipertensi, Diabetes, Kolesterol, Asam Urat).

                        </div>
                        <select value={filterPos} onChange={e=>setFilterPos(e.target.value)} className="border-2 dark:border-slate-700 p-3 rounded-xl font-bold outline-none focus:border-indigo-500 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm">
                            <option value="all">Semua Posyandu</option>
                            {posyanduList.filter(p=>p.id!=='admin').map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-rose-50 dark:bg-rose-950/40 p-4 rounded-2xl border border-rose-200 dark:border-rose-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-heart-pulse text-3xl text-rose-500 mb-2"></i>
                            <p className="text-[10px] font-black text-rose-700 dark:text-rose-400 uppercase">Hipertensi</p>
                            <p className="text-2xl font-black text-rose-900 dark:text-rose-200">{totalHipertensi} <span className="text-xs">Warga</span></p>
                        </div>
                        <div className="bg-amber-50 dark:bg-amber-950/40 p-4 rounded-2xl border border-amber-200 dark:border-amber-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-droplet text-3xl text-amber-500 mb-2"></i>
                            <p className="text-[10px] font-black text-amber-700 dark:text-amber-400 uppercase">Gula Tinggi</p>
                            <p className="text-2xl font-black text-amber-900 dark:text-amber-200">{totalGulaTinggi} <span className="text-xs">Warga</span></p>
                        </div>
                        <div className="bg-indigo-50 dark:bg-indigo-950/40 p-4 rounded-2xl border border-indigo-200 dark:border-indigo-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-bacon text-3xl text-indigo-500 mb-2"></i>
                            <p className="text-[10px] font-black text-indigo-700 dark:text-indigo-400 uppercase">Kolesterol</p>
                            <p className="text-2xl font-black text-indigo-900 dark:text-indigo-200">{totalKolesterolTinggi} <span className="text-xs">Warga</span></p>
                        </div>
                        <div className="bg-orange-50 dark:bg-orange-950/40 p-4 rounded-2xl border border-orange-200 dark:border-orange-900 flex flex-col justify-center items-center text-center">
                            <i className="fa-solid fa-bone text-3xl text-orange-500 mb-2"></i>
                            <p className="text-[10px] font-black text-orange-700 dark:text-orange-400 uppercase">Asam Urat</p>
                            <p className="text-2xl font-black text-orange-900 dark:text-orange-200">{totalAsamUratTinggi} <span className="text-xs">Warga</span></p>
                        </div>
                    </div>

                    <div className="overflow-x-auto custom-scrollbar pb-2">
                        <table className="w-full text-left whitespace-nowrap">
                            <thead>
                                <tr className="bg-slate-50 dark:bg-slate-800/80 border-b dark:border-slate-700">
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Tgl Periksa</th>
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Nama & Posyandu</th>
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Indikator Berbahaya</th>
                                    <th className="p-4 text-xs font-black uppercase text-slate-500">Rekomendasi Bidan</th>
                                </tr>
                            </thead>
                            <tbody>
                                {alerts.map(a => {
                                    const cObj = ilpCategories.find(c=>c.id===a.ilpCategory);
                                    return (
                                        <tr key={a.id} className="border-b dark:border-slate-800 text-sm hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            <td className="p-4 font-mono font-bold text-slate-500">{a.date}</td>
                                            <td className="p-4">
                                                <span className="font-black text-base text-slate-800 dark:text-slate-100">{a.participantName}</span><br/>
                                                <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400">{posyanduList.find(p=>p.id===a.posyandu)?.name} | {cObj?.name}</span>
                                            </td>
                                            <td className="p-4">
                                                <div className="flex flex-col gap-1.5">
                                                    {a.issues.map((issue, idx) => (
                                                        <span key={idx} className="bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 px-3 py-1 rounded-lg text-xs font-black border border-rose-200 dark:border-rose-800 w-fit">
                                                            <i className="fa-solid fa-circle-exclamation mr-1"></i> {issue}
                                                        </span>
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="p-4 text-xs font-bold text-slate-600 dark:text-slate-400 whitespace-normal min-w-[200px]">
                                                Rujuk warga ke Faskes (Puskesmas) untuk penanganan medis lanjutan dan sarankan diet seimbang.
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        {alerts.length === 0 && (
                            <div className="text-center py-16 text-slate-400">
                                <i className="fa-solid fa-shield-heart text-5xl mb-4 opacity-30 block"></i>
                                <p className="font-black text-lg">Bagus! Tidak ada warga dengan peringatan bahaya PTM.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

({...f,startTime:e.target.value})} className="border-2 dark:border-slate-700 p-4 rounded-2xl w-full font-mono text-xl font-bold bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100"/></div><div><label className="block font-black mb-3 text-slate-700 text-sm uppercase">Jam Tutup</label><input type="time" value={f?.endTime||'12:00'} onChange={e=>setF({...f,endTime:e.target.value})} className="border-2 dark:border-slate-700 p-4 rounded-2xl w-full font-mono text-xl font-bold bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100"/></div></div><div><label className="block font-black mb-4 text-slate-700 dark:text-slate-300 text-sm uppercase">Hari Layanan Rutin</label><div className="flex flex-wrap gap-3">{dList.map(d=><button type="button" key={d.id} onClick={()=>setF(p=>({...p, days: p.days?.includes(d.id)?p.days.filter(x=>x!==d.id):[...(p.days||[]), d.id]}))} className={`px-6 py-3 rounded-full font-black text-sm border-2 transition-all ${(f?.days||[]).includes(d.id)?'bg-indigo-600 text-white border-indigo-600 shadow-md':'bg-white border-slate-200 text-slate-500'}`}>{d.n}</button>)}</div></div><button type="submit" className="w-full bg-slate-900 text-white font-black text-lg py-4 rounded-2xl shadow-xl hover:bg-black transition-all">Simpan Jadwal</button></form></div>
                    <div className="bg-white dark:bg-slate-900 p-6 md:p-10 rounded-3xl border dark:border-slate-800 shadow-sm"><h2 className="text-2xl font-black mb-8 flex items-center gap-3 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-cloud-arrow-down text-blue-600"></i> Backup Arsip ILP</h2><div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-3xl border-2 dark:border-slate-700 flex flex-col md:flex-row gap-6 justify-between items-center"><div><h3 className="font-black text-lg text-slate-800 dark:text-slate-100">Unduh Data (.json)</h3><p className="text-sm font-bold text-slate-500 mt-1">Simpan salinan data aman ke perangkat Anda.</p></div><button onClick={handleBackup} className="w-full md:w-auto bg-blue-600 text-white font-black text-base py-4 px-8 rounded-2xl hover:bg-blue-700 transition-all"><i className="fa-solid fa-download mr-2"></i> Download Backup</button></div></div>

        function ComplaintStatusModal({ onClose, posyanduList, lookup }) {
            const [code, setCode] = useState(() => getSafeLocal('pos_ilp_last_ticket', ''));
            const [res, setRes] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState('');

                e.preventDefault(); setErr(''); setRes(null);

                try { const r = await lookup(t); if (r) setRes(r); else setErr('Pengaduan dengan kode ini tidak ditemukan.'); }
                catch (e2) { setErr('Pengaduan tidak ditemukan atau koneksi bermasalah.'); }
                setBusy(false);
            };

                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">

                                <button type="submit" disabled={busy} className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl disabled:opacity-60">{busy ? 'Mencari...' : 'Cek'}</button>
                            </form>
                            {err && <p className="text-center font-bold text-rose-600">{err}</p>}
                            {res && (
                                <div className="bg-white dark:bg-slate-900 p-5 rounded-3xl border-2 dark:border-slate-800 space-y-3">
                                    <div className="flex justify-between items-start gap-3"><div><h4 className="font-black text-lg">{res.name}</h4><span className="text-xs font-bold text-indigo-600 dark:text-indigo-400">{posyanduList.find(p => p.id === res.posyandu)?.name || res.posyandu}</span></div><span className="text-xs font-mono bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-xl">{res.date}</span></div>
                                    <p className="text-sm font-medium italic">&ldquo;{res.message}&rdquo;</p>
                                    {res.reply ? <div className="bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 p-4 rounded-2xl"><p className="text-xs font-black uppercase text-emerald-700 dark:text-emerald-400 mb-1">Balasan petugas</p><p className="text-sm font-bold">{res.reply}</p></div> : <p className="text-sm font-bold text-amber-600"><i className="fa-solid fa-hourglass-half mr-2"></i>Belum ada balasan dari petugas.</p>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ComplaintModal({ onClose, posyanduList, submit, showNotification }) {
            const [form, setForm] = useState({ name: '', posyandu: 'mawar1', message: '' });
            const [ticket, setTicket] = useState(null); const [busy, setBusy] = useState(false);
            const inp = "w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-bold";
            const lbl = "block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase";
            const handleSub = async (e) => {
                e.preventDefault(); setBusy(true);
                try { const id = await submit(form); try { localStorage.setItem('pos_ilp_last_ticket', JSON.stringify(id)); } catch (e2) {} setTicket(id); }
                catch (e2) { showNotification('Laporan gagal dikirim. Periksa koneksi lalu coba lagi.', 'error'); }
                setBusy(false);
            };
            const salin = () => { try { navigator.clipboard.writeText(ticket); showNotification('Kode disalin.'); } catch (e) {} };
            return (
                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl">
                        <div className="bg-indigo-600 p-6 flex justify-between text-white items-center">
                            <h3 className="font-black text-xl flex items-center gap-3"><i className="fa-solid fa-paper-plane text-2xl"></i> Laporan Warga</h3>
                            <button onClick={onClose} aria-label="Tutup" className="bg-white/20 w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/40"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        {ticket ? (
                            <div className="p-6 md:p-8 space-y-4 bg-slate-50 dark:bg-slate-950 text-center text-slate-800 dark:text-slate-100">
                                <i className="fa-solid fa-circle-check text-5xl text-emerald-500"></i>
                                <p className="font-black text-lg">Laporan terkirim</p>
                                <p className="text-sm font-bold text-slate-600 dark:text-slate-400">Simpan kode ini untuk melihat balasan petugas lewat menu &ldquo;Balasan&rdquo;. Kode hanya ditampilkan sekarang.</p>
                                <p className="font-mono font-black text-2xl tracking-wider bg-white dark:bg-slate-900 border-2 border-dashed border-indigo-300 rounded-2xl py-4 select-all">{ticket}</p>
                                <div className="flex gap-3"><button onClick={salin} className="flex-1 bg-slate-200 dark:bg-slate-800 font-black py-3 rounded-2xl">Salin</button><button onClick={onClose} className="flex-1 bg-indigo-600 text-white font-black py-3 rounded-2xl">Selesai</button></div>
                            </div>
                        ) : (
                            <form onSubmit={handleSub} className="p-6 md:p-8 space-y-5 bg-slate-50 dark:bg-slate-950">
                                <div><label className={lbl}>Nama Anda</label><input required maxLength={80} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={inp} /></div>
                                <div><label className={lbl}>Tujuan Posyandu</label><select value={form.posyandu} onChange={e => setForm({ ...form, posyandu: e.target.value })} className={inp}>{posyanduList.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                                <div><label className={lbl}>Isi Pesan / Laporan</label><textarea required rows={4} maxLength={1000} value={form.message} onChange={e => setForm({ ...form, message: e.target.value })} className={inp}></textarea></div>
                                <button type="submit" disabled={busy} className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl flex justify-center items-center gap-2 shadow-lg hover:bg-indigo-700 transition-all disabled:opacity-60"><i className="fa-solid fa-paper-plane text-lg"></i> {busy ? 'Mengirim...' : 'Kirim Laporan ke Petugas'}</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function ChangePasswordModal({ onClose, showNotification }) {
            const [oldP, setOldP] = useState(''); const [newP, setNewP] = useState(''); const [rep2, setRep2] = useState('');
            const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
            const inp = "w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-bold";
            const lbl = "block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase";
            const submit = async (e) => {
                e.preventDefault(); setErr('');
                if (newP.length < 8) return setErr('Sandi baru minimal 8 karakter.');
                if (newP !== rep2) return setErr('Pengulangan sandi tidak sama.');
                if (newP === oldP) return setErr('Sandi baru harus berbeda dari sandi lama.');
                const fb = window.FirebaseMod; const u = window.__fbAuth && window.__fbAuth.currentUser;
                if (!u) return setErr('Sesi berakhir. Silakan masuk ulang.');
                setBusy(true);
                try {
                    await fb.reauthenticateWithCredential(u, fb.EmailAuthProvider.credential(u.email, oldP));
                    await fb.updatePassword(u, newP);
                    showNotification('Sandi berhasil diganti.'); onClose();
                } catch (e2) {
                    const c = e2 && e2.code;
                    setErr(c === 'auth/invalid-credential' || c === 'auth/wrong-password' ? 'Sandi lama salah.' : c === 'auth/weak-password' ? 'Sandi baru terlalu lemah.' : 'Gagal mengganti sandi. Coba lagi.');
                }
                setBusy(false);
            };
            return (
                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl">
                        <div className="bg-indigo-600 p-6 flex justify-between text-white items-center">
                            <h3 className="font-black text-xl flex items-center gap-3"><i className="fa-solid fa-key text-2xl"></i> Ganti Sandi</h3>
                            <button onClick={onClose} aria-label="Tutup" className="bg-white/20 w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/40"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={submit} className="p-6 md:p-8 space-y-5 bg-slate-50 dark:bg-slate-950">
                            <div><label className={lbl}>Sandi lama</label><input type="password" autoComplete="current-password" required value={oldP} onChange={e => setOldP(e.target.value)} className={inp} /></div>
                            <div><label className={lbl}>Sandi baru (min. 8 karakter)</label><input type="password" autoComplete="new-password" required value={newP} onChange={e => setNewP(e.target.value)} className={inp} /></div>
                            <div><label className={lbl}>Ulangi sandi baru</label><input type="password" autoComplete="new-password" required value={rep2} onChange={e => setRep2(e.target.value)} className={inp} /></div>
                            {err && <p className="font-bold text-rose-600 text-sm">{err}</p>}
                            <button type="submit" disabled={busy} className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl disabled:opacity-60">{busy ? 'Menyimpan...' : 'Simpan sandi baru'}</button>
                        </form>
                    </div>
                </div>
            );
        }

        function BulkQRPrintModal({ type, items, onClose, posyanduList, role, isAdmin, ilpCategories }) {
            const fil = isAdmin ? items : (items||[]).filter(i=>i.posyandu===role);
            return (
                <div className="fixed inset-0 bg-white dark:bg-slate-900 z-[250] flex flex-col items-center print:p-0 p-8 overflow-y-auto block custom-scrollbar">
                    <div className="w-full max-w-5xl flex flex-col print-container relative">
                        <div className="bg-white dark:bg-slate-900 py-6 flex justify-between items-center no-print border-b-2 dark:border-slate-800 mb-6 w-full sticky top-0 z-20">
                            <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-print text-indigo-600"></i> Cetak Kartu Barcode (A4 Landscape)</h3>
                            <div className="flex gap-4">
                                <button onClick={()=>window.print()} disabled={fil.length===0} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black hover:bg-indigo-700 shadow-xl disabled:bg-slate-400 flex items-center gap-2"><i className="fa-solid fa-print"></i> Print Sekarang</button>
                                <button onClick={onClose} className="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 w-12 h-12 flex justify-center items-center rounded-2xl hover:bg-slate-300"><i className="fa-solid fa-xmark text-xl"></i></button>
                            </div>
                        </div>
                        {fil.length === 0 ? (
                            <div className="text-center py-20 text-slate-500 font-bold text-xl no-print"><i className="fa-solid fa-file-circle-xmark text-6xl mb-4 opacity-50 block"></i>Belum ada data untuk dicetak di posyandu ini.</div>
                        ) : (
                            <div className="print:bg-white print:p-0 w-full">
                                <div className="flex flex-wrap gap-4 print-grid justify-center lg:justify-start w-full">
                                    {fil.map(item=>{
                                        const cObj = ilpCategories.find(c=>c.id===item.ilpCategory);
                                        return (
                                        <div key={item.id} className="print-card bg-white border-2 border-slate-200 rounded-xl flex overflow-hidden m-1 shrink-0 box-border" style={{ width: '86mm', height: '54mm' }}>
                                            
                                            {/* SISI KIRI: QR Code Aksen Ungu (Diperbarui ke Resolusi 500x500 agar sangat tajam) */}
                                            <div className="bg-indigo-50 border-r-2 border-slate-100 flex flex-col justify-center items-center p-2 relative box-border" style={{ width: '35%' }}>
                                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${item.id}&margin=1`} alt="QR" className="rounded-lg bg-white border-2 border-slate-300" style={{ width: '22mm', height: '22mm', objectFit: 'contain' }} />
                                                <span className="text-[6px] font-mono mt-1.5 text-indigo-900 font-black tracking-widest bg-white/60 px-1 py-0.5 rounded text-center leading-tight">{item.id}</span>
                                            </div>
                                            
                                            {/* SISI KANAN: Data Warga & Desain Banner */}
                                            <div className="p-2.5 flex flex-col justify-between bg-white relative box-border" style={{ width: '65%' }}>
                                                
                                                {/* BAGIAN 1: Header Teks */}
                                                <div>
                                                    <div className="flex justify-between items-start mb-1">
                                                        <div className="text-[7px] font-black text-white uppercase tracking-widest bg-indigo-600 px-1.5 py-0.5 rounded inline-block">{type==='cadres'?'KARTU KADER':'KARTU WARGA ILP'}</div>
                                                    </div>
                                                    <h4 className="font-extrabold text-[8px] text-slate-500 leading-tight mb-1 uppercase tracking-wider">{posyanduList.find(p=>p.id===item.posyandu)?.name}</h4>
                                                    <h5 className="text-[12px] font-black text-slate-900 leading-tight" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{item.name}</h5>
                                                    {type==='participants' && <p className="text-[8px] font-bold text-slate-600 mt-1">Klaster: <span className="text-indigo-700 font-black">{cObj?.name}</span></p>}
                                                </div>
                                                
                                                {/* BAGIAN 2: Ilustrasi Banner 5 Siklus ILP */}
                                                <div className="mt-1.5 flex-1 w-full bg-gradient-to-r from-indigo-50 to-rose-50 rounded-md border border-indigo-100 flex items-center px-2 overflow-hidden relative" style={{ minHeight: '12mm' }}>
                                                    <div className="absolute right-[-4px] top-[2px] opacity-10">
                                                        <i className="fa-solid fa-notes-medical text-[35px] text-indigo-800"></i>
                                                    </div>
                                                    <div className="flex flex-col z-10 w-full justify-center">
                                                        <span className="text-[5.5px] font-black text-indigo-900 uppercase tracking-wider mb-1.5">Pelayanan Primer 5 Siklus Hidup</span>
                                                        <div className="flex justify-between w-[85%] text-indigo-900 opacity-80">
                                                            <i className="fa-solid fa-person-pregnant text-[11px]" title="Ibu Hamil"></i>
                                                            <i className="fa-solid fa-baby text-[11px]" title="Balita"></i>
                                                            <i className="fa-solid fa-child-reaching text-[11px]" title="Remaja"></i>
                                                            <i className="fa-solid fa-user-tie text-[11px]" title="Dewasa"></i>
                                                            <i className="fa-solid fa-person-cane text-[11px]" title="Lansia"></i>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                {/* BAGIAN 3: Footer Link Website */}
                                                <div className="pt-1.5 border-t border-slate-200 flex items-center gap-1.5 mt-1.5">
                                                    <div className="bg-indigo-100 text-indigo-700 flex justify-center items-center rounded-full" style={{ width: '12px', height: '12px' }}>
                                                        <i className="fa-solid fa-link text-[6px]"></i>
                                                    </div>
                                                    <span className="text-[7px] font-black text-slate-600 tracking-wide">eposyandu.netlify.app</span>
                                                </div>
                                            </div>
                                        </div>
                                    );})}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        window.startReactApp = () => {
            if (window.__appStarted) return;
            window.__appStarted = true;
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) loadingScreen.style.display = 'none';
            }
        };

        setTimeout(() => {
            if (!window.__appStarted && typeof window.startReactApp === 'function') { window.startReactApp(); }
        }, 3000);

        if (window.isFirebaseLoaded && typeof window.startReactApp === 'function') {
            window.startReactApp();
        }
    </script>

    <div class="install-banner" id="install-banner">
        <img src="" id="install-logo" alt="">
        <div style="flex:1"><b>Pasang Posyandu ILP</b><small>Akses cepat dari layar utama HP/PC</small></div>
        <button id="install-yes">Pasang</button><button class="x" id="install-no">&#10005;</button>
    </div>
    <script>
        document.getElementById('install-logo').src = window.POS_LOGO;
        (function(){
            var dp, bar = document.getElementById('install-banner');
            window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; if(!sessionStorage.getItem('pwa_no')) bar.style.display='flex'; });
            document.getElementById('install-yes').onclick = function(){ if(dp){ dp.prompt(); dp.userChoice.then(function(){ bar.style.display='none'; dp=null; }); } };
            document.getElementById('install-no').onclick = function(){ bar.style.display='none'; try{sessionStorage.setItem('pwa_no','1');}catch(e){} };
            window.addEventListener('appinstalled', function(){ bar.style.display='none'; });
            if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
        })();
    </script>

    <div class="ios-hint" id="ios-hint">
        <img src="" id="ios-logo" alt="">
        <div style="flex:1"><b>Pasang di iPhone/iPad</b>Ketuk tombol <b style="display:inline">Bagikan</b> (kotak dengan panah) di Safari, lalu pilih <b style="display:inline">Tambah ke Layar Utama</b>.</div>
        <button id="ios-x">&#10005;</button>
    </div>
    <script>
        (function(){
            var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
            var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
            var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
            if (ios && safari && !standalone && !localStorage.getItem('ios_hint_no')) {
                document.getElementById('ios-logo').src = window.POS_LOGO;
                document.getElementById('ios-hint').style.display = 'flex';
            }
            document.getElementById('ios-x').onclick = function(){ document.getElementById('ios-hint').style.display='none'; try{localStorage.setItem('ios_hint_no','1');}catch(e){} };
        })();
    </script>
</body>
</html>
