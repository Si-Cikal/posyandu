            const hist = sel ? (healthRecords||[]).filter(hr=>hr.participantId===sel.id).sort((a,b)=>(a.date||'')>(b.date||'')?-1:1) : [];

            return (
                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 w-full max-w-3xl rounded-[2.5rem] flex flex-col max-h-[90vh] overflow-hidden shadow-2xl">
                        <div className="bg-indigo-600 p-6 flex justify-between items-center text-white">
                            <h3 className="font-black text-2xl flex items-center gap-3"><i className="fa-solid fa-file-medical"></i> Cek Rekam Medis ILP</h3>
                            <button onClick={onClose} className="bg-white/20 w-12 h-12 flex items-center justify-center rounded-full hover:bg-white/40"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="p-6 md:p-8 overflow-y-auto flex-1 bg-slate-50 dark:bg-slate-950 custom-scrollbar">
                            {!sel?(
                                <div className="space-y-4">
                                    <input type="text" placeholder="Ketik Nama Warga / NIK / ID..." value={q} onChange={e=>setQ(e.target.value)} className="w-full border-2 dark:border-slate-700 p-5 rounded-2xl outline-none focus:border-indigo-500 font-bold text-lg shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100" autoFocus/>
                                    {res.map(p=>{
                                        const cObj = ilpCategories.find(c=>c.id===p.ilpCategory);
                                        return (
                                            <button key={p.id} onClick={()=>setSel(p)} className="w-full text-left p-5 bg-white dark:bg-slate-900 border-2 dark:border-slate-800 rounded-2xl hover:border-indigo-400 font-bold shadow-sm flex justify-between items-center transition-all">
                                                <div><p className="text-xl text-indigo-700 dark:text-indigo-400 font-black">{p.name}</p><p className="text-xs text-slate-500 mt-1">Klaster: {cObj?.name} | NIK: {p.nik||'-'}</p></div>
                                                <span className="bg-slate-100 dark:bg-slate-800 px-3.5 py-1.5 rounded-xl text-xs uppercase font-black text-slate-700 dark:text-slate-300">{posyanduList.find(pt=>pt.id===p.posyandu)?.name}</span>
                                            </button>
                                        );
                                    })}
                                    {q.length>=2 && res.length===0 && <div className="text-center font-bold text-slate-400 py-20"><i className="fa-solid fa-circle-question text-5xl mb-3 opacity-30 block"></i>Warga tidak ditemukan.</div>}
                                </div>
                            ):(
                                <div>
                                    <button onClick={()=>setSel(null)} className="text-indigo-600 dark:text-indigo-400 font-black mb-5 flex items-center gap-2 hover:bg-indigo-50 dark:hover:bg-slate-800 px-4 py-2 rounded-xl border border-indigo-100 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm"><i className="fa-solid fa-arrow-left"></i> Kembali Cari</button>
                                    <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border-2 dark:border-slate-800 mb-6 shadow-sm"><h4 className="text-3xl font-black text-slate-800 dark:text-slate-100">{sel.name}</h4><p className="text-slate-500 dark:text-slate-400 font-bold mt-1 text-sm bg-slate-100 dark:bg-slate-800 w-fit px-3 py-1.5 rounded-xl border dark:border-slate-700">{posyanduList.find(pt=>pt.id===sel.posyandu)?.name}</p></div>
                                    
                                    <ParticipantCharts participant={sel} records={hist} />

                                    <div className="space-y-5">
                                        {hist.map(r=>(
                                            <div key={r.id} className="bg-white dark:bg-slate-900 p-6 rounded-3xl border-2 dark:border-slate-800 shadow-sm relative overflow-hidden">
                                                <div className="bg-indigo-600 text-white font-black px-4 py-1.5 rounded-br-2xl absolute top-0 left-0 text-sm shadow-sm">{r.date}</div>
                                                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 text-center mt-6">
                                                    {r.weight && <div className="bg-blue-50 dark:bg-blue-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-blue-600 dark:text-blue-400 font-black mb-1">BERAT</p><p className="font-black text-lg text-blue-900 dark:text-blue-200">{r.weight} kg</p></div>}
                                                    {r.height && <div className="bg-emerald-50 dark:bg-emerald-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-emerald-600 dark:text-emerald-400 font-black mb-1">TINGGI</p><p className="font-black text-lg text-emerald-900 dark:text-emerald-200">{r.height} cm</p></div>}
                                                    {r.headCirc && <div className="bg-cyan-50 dark:bg-cyan-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-cyan-600 dark:text-cyan-400 font-black mb-1">L.KEPALA</p><p className="font-black text-lg text-cyan-900 dark:text-cyan-200">{r.headCirc} cm</p></div>}
                                                    {r.armCirc && <div className="bg-teal-50 dark:bg-teal-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-teal-600 dark:text-teal-400 font-black mb-1">LILA</p><p className="font-black text-lg text-teal-900 dark:text-teal-200">{r.armCirc} cm</p></div>}
                                                    {r.bellyCirc && <div className="bg-indigo-50 dark:bg-indigo-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-indigo-600 dark:text-indigo-400 font-black mb-1">L.PERUT</p><p className="font-black text-lg text-indigo-900 dark:text-indigo-200">{r.bellyCirc} cm</p></div>}
                                                    {r.tension && <div className="bg-purple-50 dark:bg-purple-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-purple-600 dark:text-purple-400 font-black mb-1">TENSI</p><p className="font-black text-lg text-purple-900 dark:text-purple-200">{r.tension}</p></div>}
                                                    {r.bloodSugar && <div className="bg-amber-50 dark:bg-amber-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-amber-600 dark:text-amber-400 font-black mb-1">GULA</p><p className="font-black text-lg text-amber-900 dark:text-amber-200">{r.bloodSugar}</p></div>}
                                                    {r.cholesterol && <div className="bg-rose-50 dark:bg-rose-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-rose-600 dark:text-rose-400 font-black mb-1">KOLESTEROL</p><p className="font-black text-lg text-rose-900 dark:text-rose-200">{r.cholesterol}</p></div>}
                                                    {r.uricAcid && <div className="bg-orange-50 dark:bg-orange-950/60 p-3 rounded-2xl border dark:border-slate-800"><p className="text-[10px] text-orange-600 dark:text-orange-400 font-black mb-1">ASAM URAT</p><p className="font-black text-lg text-orange-900 dark:text-orange-200">{r.uricAcid}</p></div>}
                                                </div>
                                                
                                                {(r.autoDiagnosis || r.autoRecommendation) && (
                                                    <div className="mt-4 bg-indigo-50 dark:bg-indigo-950/40 p-4 rounded-xl border border-indigo-100 dark:border-indigo-800 text-sm">
                                                        <p className="font-bold text-rose-600 dark:text-rose-400"><i className="fa-solid fa-heart-pulse mr-1"></i> Diagnosis: {r.autoDiagnosis}</p>
                                                        <p className="font-bold text-emerald-700 dark:text-emerald-400 mt-1"><i className="fa-solid fa-lightbulb mr-1"></i> Saran: {r.autoRecommendation}</p>
                                                    </div>
                                                )}
                                                {r.notes && <div className="mt-2 text-xs font-bold text-slate-500 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl border dark:border-slate-700">Catatan Petugas: {r.notes}</div>}
                                            </div>
                                        ))}
                                        {hist.length===0&&<div className="text-center font-bold text-slate-400 py-16">Belum ada riwayat skrining ILP.</div>}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ComplaintStatusModal({ onClose, complaints, posyanduList }) {
            const [q, setQ] = useState('');
            const fil = q.trim() ? (complaints || []).filter(c => (c.name||'').toLowerCase().includes(q.toLowerCase()) || (c.id||'').toLowerCase().includes(q.toLowerCase())) : [];
            
            return (
                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-[2.5rem] flex flex-col max-h-[90vh] overflow-hidden shadow-2xl">
                        <div className="bg-indigo-600 p-6 flex justify-between items-center text-white">
                            <h3 className="font-black text-2xl flex items-center gap-3"><i className="fa-solid fa-clipboard-check"></i> Cek Status Pengaduan Warga</h3>
                            <button onClick={onClose} className="bg-white/20 w-12 h-12 flex items-center justify-center rounded-full hover:bg-white/40"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="p-6 md:p-8 overflow-y-auto flex-1 bg-slate-50 dark:bg-slate-950 space-y-5 custom-scrollbar">
                            <input type="text" placeholder="Ketik Nama Pelapor..." value={q} onChange={e=>setQ(e.target.value)} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-bold text-base shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100" autoFocus/>
                            {q.trim() && fil.map(c => (
                                <div key={c.id} className="bg-white dark:bg-slate-900 p-6 rounded-3xl border-2 dark:border-slate-800 shadow-sm space-y-3">
                                    <div className="flex justify-between items-center border-b dark:border-slate-800 pb-3">
                                        <div><h4 className="font-black text-lg text-slate-800 dark:text-slate-100">{c.name}</h4><span className="text-xs font-bold text-indigo-600 dark:text-indigo-400">{posyanduList.find(p=>p.id===c.posyandu)?.name}</span></div>
                                        <div className="text-right"><span className="text-xs font-mono bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-xl">{c.date}</span><br/><span className={`text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full mt-1 inline-block ${c.reply ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300' : 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300'}`}>{c.reply ? 'Sudah Dijawab' : 'Menunggu Respon'}</span></div>
                                    </div>
                                    <p className="text-sm font-medium text-slate-700 dark:text-slate-300 italic">"{c.message}"</p>
                                    {c.reply ? (<div className="bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 p-4 rounded-2xl mt-2"><p className="text-xs font-black text-emerald-800 dark:text-emerald-300 uppercase mb-1"><i className="fa-solid fa-circle-check mr-1"></i> Respon Petugas:</p><p className="text-sm font-bold text-emerald-900 dark:text-emerald-200">{c.reply}</p></div>) : (<div className="bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800 p-3 rounded-2xl text-xs font-bold text-amber-800 dark:text-amber-300"><i className="fa-solid fa-clock mr-1"></i> Laporan Anda sedang ditinjau.</div>)}
                                </div>
                            ))}
                            {q.trim() && fil.length === 0 && <div className="text-center font-bold text-slate-400 py-16">Pengaduan tidak ditemukan.</div>}
                        </div>
                    </div>
                </div>
            );
        }

        function ComplaintModal({ onClose, posyanduList, syncData, showNotification }) {
            const [form, setForm] = useState({ name: '', posyandu: 'mawar1', message: '' });
            
            const handleSub = async (e) => { 
                e.preventDefault(); 
                const cmpId = `CMP-${Date.now()}`;
                await syncData('complaints', cmpId, { ...form, date: new Date().toISOString().split('T')[0], reply: '' }); 
                showNotification("Laporan tersimpan di sistem Dasbor Admin Posyandu!"); 
                onClose(); 
            };
            
            return (
                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl">
                        <div className="bg-indigo-600 p-6 flex justify-between text-white items-center">
                            <h3 className="font-black text-xl flex items-center gap-3"><i className="fa-solid fa-paper-plane text-2xl"></i> Laporan Warga</h3>
                            <button onClick={onClose} className="bg-white/20 w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/40"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={handleSub} className="p-6 md:p-8 space-y-5 bg-slate-50 dark:bg-slate-950">
                            <div><label className="block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase">Nama Anda</label><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-bold shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100" /></div>
                            <div><label className="block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase">Tujuan Posyandu</label><select value={form.posyandu} onChange={e=>setForm({...form,posyandu:e.target.value})} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-bold shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100">{posyanduList.filter(p=>p.id!=='admin').map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                            <div><label className="block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase">Isi Pesan / Laporan</label><textarea required rows={4} value={form.message} onChange={e=>setForm({...form,message:e.target.value})} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-medium shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100"></textarea></div>
                            <button type="submit" className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl flex justify-center items-center gap-2 shadow-lg hover:bg-indigo-700 transition-all"><i className="fa-solid fa-paper-plane text-lg"></i> Kirim Laporan ke Petugas</button>
                        </form>
                    </div>
                </div>
            );
        }

        function BulkQRPrintModal({ type, items, onClose, posyanduList, role, isAdmin, ilpCategories }) {
            const fil = isAdmin ? items : (items||[]).filter(i=>i.posyandu===role);
            return (
                <div className="fixed inset-0 bg-white dark:bg-slate-900 z-[250] flex flex-col items-center print:p-0 p-8 overflow-y-auto block custom-scrollbar">
                    <div className="w-full max-w-5xl flex flex-col print-container relative">
                        <div className="bg-white dark:bg-slate-900 py-6 flex justify-between items-center no-print border-b-2 dark:border-slate-800 mb-6 w-full sticky top-0 z-20">
                            <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-print text-indigo-600"></i> Cetak Kartu Barcode (A4 Landscape)</h3>
                            <div className="flex gap-4">
                                <button onClick={()=>window.print()} disabled={fil.length===0} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black hover:bg-indigo-700 shadow-xl disabled:bg-slate-400 flex items-center gap-2"><i className="fa-solid fa-print"></i> Print Sekarang</button>
                                <button onClick={onClose} className="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 w-12 h-12 flex justify-center items-center rounded-2xl hover:bg-slate-300"><i className="fa-solid fa-xmark text-xl"></i></button>
                            </div>
                        </div>
                        {fil.length === 0 ? (
                            <div className="text-center py-20 text-slate-500 font-bold text-xl no-print"><i className="fa-solid fa-file-circle-xmark text-6xl mb-4 opacity-50 block"></i>Belum ada data untuk dicetak di posyandu ini.</div>
                        ) : (
                            <div className="print:bg-white print:p-0 w-full">
                                <div className="flex flex-wrap gap-4 print-grid justify-center lg:justify-start w-full">
                                    {fil.map(item=>{
                                        const cObj = ilpCategories.find(c=>c.id===item.ilpCategory);
                                        return (
                                        <div key={item.id} className="print-card bg-white border-2 border-slate-200 rounded-xl flex overflow-hidden m-1 shrink-0 box-border" style={{ width: '86mm', height: '54mm' }}>
                                            
                                            {/* SISI KIRI: QR Code Aksen Ungu (Diperbarui ke Resolusi 500x500 agar sangat tajam) */}
                                            <div className="bg-indigo-50 border-r-2 border-slate-100 flex flex-col justify-center items-center p-2 relative box-border" style={{ width: '35%' }}>
                                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${item.id}&margin=1`} alt="QR" className="rounded-lg bg-white border-2 border-slate-300" style={{ width: '22mm', height: '22mm', objectFit: 'contain' }} />
                                                <span className="text-[6px] font-mono mt-1.5 text-indigo-900 font-black tracking-widest bg-white/60 px-1 py-0.5 rounded text-center leading-tight">{item.id}</span>
                                            </div>
                                            
                                            {/* SISI KANAN: Data Warga & Desain Banner */}
                                            <div className="p-2.5 flex flex-col justify-between bg-white relative box-border" style={{ width: '65%' }}>
                                                
                                                {/* BAGIAN 1: Header Teks */}
                                                <div>
                                                    <div className="flex justify-between items-start mb-1">
                                                        <div className="text-[7px] font-black text-white uppercase tracking-widest bg-indigo-600 px-1.5 py-0.5 rounded inline-block">{type==='cadres'?'KARTU KADER':'KARTU WARGA ILP'}</div>
                                                    </div>
                                                    <h4 className="font-extrabold text-[8px] text-slate-500 leading-tight mb-1 uppercase tracking-wider">{posyanduList.find(p=>p.id===item.posyandu)?.name}</h4>
                                                    <h5 className="text-[12px] font-black text-slate-900 leading-tight" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{item.name}</h5>
                                                    {type==='participants' && <p className="text-[8px] font-bold text-slate-600 mt-1">Klaster: <span className="text-indigo-700 font-black">{cObj?.name}</span></p>}
                                                </div>
                                                
                                                {/* BAGIAN 2: Ilustrasi Banner 5 Siklus ILP */}
                                                <div className="mt-1.5 flex-1 w-full bg-gradient-to-r from-indigo-50 to-rose-50 rounded-md border border-indigo-100 flex items-center px-2 overflow-hidden relative" style={{ minHeight: '12mm' }}>
                                                    <div className="absolute right-[-4px] top-[2px] opacity-10">
                                                        <i className="fa-solid fa-notes-medical text-[35px] text-indigo-800"></i>
                                                    </div>
                                                    <div className="flex flex-col z-10 w-full justify-center">
                                                        <span className="text-[5.5px] font-black text-indigo-900 uppercase tracking-wider mb-1.5">Pelayanan Primer 5 Siklus Hidup</span>
                                                        <div className="flex justify-between w-[85%] text-indigo-900 opacity-80">
                                                            <i className="fa-solid fa-person-pregnant text-[11px]" title="Ibu Hamil"></i>
                                                            <i className="fa-solid fa-baby text-[11px]" title="Balita"></i>
                                                            <i className="fa-solid fa-child-reaching text-[11px]" title="Remaja"></i>
                                                            <i className="fa-solid fa-user-tie text-[11px]" title="Dewasa"></i>
                                                            <i className="fa-solid fa-person-cane text-[11px]" title="Lansia"></i>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                {/* BAGIAN 3: Footer Link Website */}
                                                <div className="pt-1.5 border-t border-slate-200 flex items-center gap-1.5 mt-1.5">
                                                    <div className="bg-indigo-100 text-indigo-700 flex justify-center items-center rounded-full" style={{ width: '12px', height: '12px' }}>
                                                        <i className="fa-solid fa-link text-[6px]"></i>
                                                    </div>
                                                    <span className="text-[7px] font-black text-slate-600 tracking-wide">eposyandu.netlify.app</span>
                                                </div>
                                            </div>
                                        </div>
                                    );})}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        window.startReactApp = () => {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) loadingScreen.style.display = 'none';
            }
        };

        setTimeout(() => { 
            if (!window.isFirebaseLoaded) {
                window.FirebaseMod = null; 
                if (typeof window.startReactApp === 'function') { window.startReactApp(); }
            }
        }, 3000);

        if (window.isFirebaseLoaded && typeof window.startReactApp === 'function') {
            window.startReactApp();
        }
    </script>

    <div class="install-banner" id="install-banner">
        <img src="" id="install-logo" alt="">
        <div style="flex:1"><b>Pasang Posyandu ILP</b><small>Akses cepat dari layar utama HP/PC</small></div>
        <button id="install-yes">Pasang</button><button class="x" id="install-no">&#10005;</button>
    </div>
    <script>
        document.getElementById('install-logo').src = window.POS_LOGO;
        (function(){
            var dp, bar = document.getElementById('install-banner');
            window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; if(!sessionStorage.getItem('pwa_no')) bar.style.display='flex'; });
            document.getElementById('install-yes').onclick = function(){ if(dp){ dp.prompt(); dp.userChoice.then(function(){ bar.style.display='none'; dp=null; }); } };
            document.getElementById('install-no').onclick = function(){ bar.style.display='none'; try{sessionStorage.setItem('pwa_no','1');}catch(e){} };
            window.addEventListener('appinstalled', function(){ bar.style.display='none'; });
            if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
        })();
    </script>

    <div class="ios-hint" id="ios-hint">
        <img src="" id="ios-logo" alt="">
        <div style="flex:1"><b>Pasang di iPhone/iPad</b>Ketuk tombol <b style="display:inline">Bagikan</b> (kotak dengan panah) di Safari, lalu pilih <b style="display:inline">Tambah ke Layar Utama</b>.</div>
        <button id="ios-x">&#10005;</button>
    </div>
    <script>
        (function(){
            var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
            var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
            var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
            if (ios && safari && !standalone && !localStorage.getItem('ios_hint_no')) {
                document.getElementById('ios-logo').src = window.POS_LOGO;
                document.getElementById('ios-hint').style.display = 'flex';
            }
            document.getElementById('ios-x').onclick = function(){ document.getElementById('ios-hint').style.display='none'; try{localStorage.setItem('ios_hint_no','1');}catch(e){} };
        })();
    </script>
</body>
</html>
