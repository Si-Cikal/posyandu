        html { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

        /* Komponen dasar */
        .btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; min-height:3rem; padding:.8rem 1.25rem; border:0; border-radius:.9rem; background:var(--brand); color:var(--on-brand); font-weight:700; font-size:1rem; }

        .field-l { display:block; font-size:.85rem; font-weight:700; margin-bottom:.4rem; }
        .field { box-sizing:border-box; width:100%; min-height:3rem; padding:.7rem .9rem; border:1.5px solid var(--line); border-radius:.8rem; background:var(--surface); color:var(--ink); font-size:1rem; outline:none; }
        .field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
        .field-eye { position:absolute; right:.3rem; top:50%; transform:translateY(-50%); width:2.6rem; height:2.6rem; display:grid; place-items:center; border:0; background:none; color:var(--muted); border-radius:.6rem; }
        .panel { background:var(--surface); border:1px solid var(--line); border-radius:1.25rem; }
        .sk-chip { display:inline-flex; align-items:center; gap:.4rem; padding:.2rem .65rem; border-radius:999px; background:var(--st); color:var(--sx); font-weight:700; font-size:.78rem; line-height:1.4; }

        .sk-badge { width:2.8rem; height:2.8rem; border-radius:.9rem; display:grid; place-items:center; background:var(--st); color:var(--sc); font-size:1.15rem; flex-shrink:0; }
        .sk-row { border-left: 4px solid var(--sc) !important; }
        .sk-panel { border-top: 4px solid var(--sc) !important; }
        .flt { display:inline-flex; align-items:center; gap:.45rem; white-space:nowrap; min-height:2.6rem; padding:.45rem .9rem; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); font-weight:700; font-size:.88rem; }

        .flt i { color: var(--sc); }
        .flt.on { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
        .flt.on b { background: rgba(255,255,255,.2); }
        .flt.sk.on { background:var(--st); border-color:var(--sc); color:var(--sx); }
        .flt.sk.on b { background: var(--surface); }

        /* Rangka aplikasi */
        .app { position:fixed; inset:0; display:flex; background:var(--bg); color:var(--ink); }
        .nav-rail { position:fixed; top:0; bottom:0; left:0; z-index:50; width:min(300px,88vw); display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--line); transform:translateX(-100%); visibility:hidden; transition:transform .3s ease, visibility 0s linear .3s; }
        .nav-rail.open { transform:none; visibility:visible; box-shadow:0 0 40px rgba(0,0,0,.25); transition:transform .3s ease, visibility 0s; }
        @media (min-width:768px) { .nav-rail, .nav-rail.open { position:relative; z-index:auto; width:18rem; flex-shrink:0; height:100%; transform:none; visibility:visible; box-shadow:none; } }
        .app-main { flex:1; display:flex; flex-direction:column; height:100%; min-width:0; position:relative; overflow:hidden; }
        .nav-head { display:flex; align-items:center; gap:.75rem; padding:calc(env(safe-area-inset-top,0px) + 1.1rem) 1rem 1rem 1.1rem; }
        .nav-title { font-family:var(--font-display); font-weight:700; font-size:1.08rem; line-height:1.15; }
        .nav-sub { font-size:.75rem; color:var(--muted); margin-top:.2rem; }
        .nav-close { margin-left:auto; width:2.6rem; height:2.6rem; display:grid; place-items:center; border:0; border-radius:.7rem; background:var(--surface-2); color:var(--muted); }
        .nav-scroll { flex:1; overflow-y:auto; padding:.1rem .75rem 1rem; }
        .nav-grp { width:100%; display:flex; justify-content:space-between; align-items:center; padding:.95rem .6rem .35rem; font-size:.8rem; font-weight:700; color:var(--muted); background:none; border:0; }
        .nav-grp i { font-size:.65rem; opacity:.7; }
        .nav-i { position:relative; width:100%; display:flex; align-items:center; gap:.7rem; min-height:2.95rem; padding:.5rem .7rem; border-radius:.85rem; border:0; background:none; color:var(--muted); font-weight:700; font-size:.95rem; text-align:left; }
        .nav-i:hover { background:var(--surface-2); color:var(--ink); }
        .nav-ic { width:2rem; height:2rem; display:grid; place-items:center; border-radius:.6rem; font-size:.95rem; flex-shrink:0; }
        .nav-i.on { background:var(--brand-tint); color:var(--brand-ink); }
        .nav-i.on::before { content:""; position:absolute; left:0; top:22%; bottom:22%; width:3px; border-radius:3px; background:var(--brand); }
        .nav-i.sk .nav-ic { background:var(--st); color:var(--sc); }
        .nav-i.sk.on { background:var(--st); color:var(--sx); }
        .nav-i.sk.on::before { background:var(--sc); }
        .nav-count { margin-left:auto; font-size:.75rem; font-weight:700; padding:.1rem .55rem; border-radius:999px; background:var(--surface-2); color:var(--muted); }
        .nav-i.on .nav-count { background:var(--surface); color:inherit; }
        .nav-foot { border-top:1px solid var(--line); padding:.8rem .9rem calc(env(safe-area-inset-bottom,0px) + .8rem); }
        .tools-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; }
        .tool-btn { width:2.75rem; height:2.75rem; display:grid; place-items:center; border:1px solid var(--line); border-radius:.8rem; background:var(--surface); color:var(--muted); }
        .fs-seg { display:flex; border:1px solid var(--line); border-radius:.8rem; overflow:hidden; margin-left:auto; }
        .fs-seg button { min-width:2.6rem; min-height:2.75rem; padding:0 .6rem; font-weight:700; background:none; border:0; color:var(--muted); }
        .fs-seg button.on { background:var(--brand); color:var(--on-brand); }
        .me { display:flex; align-items:center; gap:.7rem; margin-bottom:.7rem; }
        .me-av { width:2.5rem; height:2.5rem; border-radius:50%; background:var(--brand-tint); color:var(--brand-ink); display:grid; place-items:center; font-weight:700; flex-shrink:0; }
        .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:.7rem; padding:calc(env(safe-area-inset-top,0px) + .6rem) .9rem .6rem; background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
        .topbar h1 { font-size:1.15rem; font-weight:700; line-height:1.15; }
        .page { flex:1; overflow-y:auto; padding:1rem 1rem 7.5rem; }
        @media (min-width:768px) { .page { padding:2rem 2.25rem 2.5rem; } }
        .bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; padding:.4rem .4rem calc(env(safe-area-inset-bottom,0px) + .4rem); background:var(--surface); border-top:1px solid var(--line); }
        .bn-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:.15rem; min-height:3.4rem; padding:.2rem 0; font-size:.72rem; font-weight:700; color:var(--muted); background:none; border:0; }
        .bn-pill { width:3.6rem; height:1.9rem; border-radius:1rem; display:grid; place-items:center; font-size:1.05rem; transition:background .2s, color .2s; }
        .bn-item.on { color:var(--brand-ink); }
        .bn-item.on .bn-pill { background:var(--brand-tint); color:var(--brand-ink); }
        .local-note { display:flex; align-items:flex-start; gap:.75rem; padding:.85rem 1rem; margin-bottom:1.25rem; border-radius:1rem; background:#fef3c7; color:#78350f; font-size:.9rem; }
        .dark .local-note { background:#3a2a0a; color:#fde68a; }
        .app-foot { display:none; border-top:1px solid var(--line); padding:.9rem 2.25rem; font-size:.8rem; color:var(--muted); justify-content:space-between; background:var(--surface); }
        @media (min-width:768px) { .app-foot { display:flex; } }

        /* Halaman masuk */
        .landing { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; position:relative; overflow-x:hidden; padding:calc(env(safe-area-inset-top,0px) + 1.25rem) 1.25rem calc(env(safe-area-inset-bottom,0px) + 1.25rem); background:var(--bg); color:var(--ink); }
        .landing-theme { position:absolute; top:calc(env(safe-area-inset-top,0px) + 1rem); right:1rem; z-index:5; width:2.9rem; height:2.9rem; display:grid; place-items:center; border:1px solid var(--line); border-radius:.9rem; background:var(--surface); color:var(--muted); }

        .q-act { display:flex; align-items:center; gap:.7rem; min-height:3.5rem; padding:.7rem .9rem; border:1px solid var(--line); border-radius:1rem; background:var(--surface); color:var(--ink); font-weight:700; text-align:left; font-size:.92rem; line-height:1.2; }
        .q-act:hover { background:var(--surface-2); }
        .q-act span.ic { width:2.3rem; height:2.3rem; border-radius:.75rem; display:grid; place-items:center; background:var(--brand-tint); color:var(--brand-ink); flex-shrink:0; }
        .landing-foot { text-align:center; font-size:.8rem; color:var(--muted); padding-top:1rem; }

        /* Tampilan HP: cincin di atas, menu simpel. Layar lebar tidak berubah. */
        .landing-m { display:none; }
        @media (max-width:639px) {
            .landing-m { order:-2; display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; }

            .landing-grid { gap:1.5rem; padding:2.75rem 0 1rem; }
            .lm-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
            .lm-sub { color:var(--muted); font-size:.95rem; margin-top:.2rem; }
            .lm-status { display:inline-flex; align-items:center; gap:.5rem; margin-top:.8rem; padding:.4rem .85rem; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:.85rem; font-weight:600; color:var(--muted); }

            .lm-login-hint { margin-top:1.1rem; color:var(--muted); font-size:.9rem; font-weight:600; }

        }

        /* Cincin lima siklus */

        @keyframes ringdraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
        .ring-badge { position:absolute; width:2.9rem; height:2.9rem; margin:-1.45rem 0 0 -1.45rem; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--sc); border:2px solid var(--st); font-size:1.1rem; box-shadow:0 8px 18px -10px rgba(21,26,52,.5); }

        /* Beranda */
        .status-pill { display:inline-flex; align-self:flex-start; align-items:center; gap:.6rem; padding:.6rem 1rem; border-radius:999px; font-weight:700; font-size:.92rem; background:var(--bad-tint); color:var(--bad); }

        .install-banner { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom,0px) + 84px); z-index: 70; display: none; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); color: var(--ink); border-radius: 20px; box-shadow: 0 12px 40px -8px rgba(15,23,42,.35); border: 1px solid var(--line); max-width: 440px; margin: 0 auto; }

        /* ===== Absen mandiri (halaman masuk) ===== */
        .absen-cta { order:-1; grid-column:1/-1; width:100%; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:1.1rem 1.25rem; border-radius:1.4rem; color:#fff; background:linear-gradient(120deg,#4f46e5 0%,#7c3aed 100%); box-shadow:0 18px 40px -22px rgba(79,70,229,.8); }

        .ab-wrap { position:fixed; inset:0; z-index:150; overflow-y:auto; background:var(--bg); color:var(--ink); animation:fadeIn .25s ease-out; }
        .ab-top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:.75rem; padding:calc(env(safe-area-inset-top,0px) + .7rem) 1rem .7rem; background:var(--surface); border-bottom:1px solid var(--line); }

        /* ===== Animasi Lingkar Hidup ===== */
        .life-ring::before { content:""; position:absolute; inset:14%; border-radius:50%; background:radial-gradient(circle, rgba(124,58,237,.28), transparent 68%); animation:ringglow 4s ease-in-out infinite; pointer-events:none; }
        .ring-spin { position:absolute; inset:0; animation:ringspin 50s linear infinite; }
        .ring-badge { animation:badgepop .7s cubic-bezier(.34,1.56,.64,1) both, ringcounter 50s linear infinite; animation-delay:calc(.5s + var(--i) * .12s), 0s; cursor:default; transition:box-shadow .25s; }
        .ring-badge::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--sc); opacity:0; animation:badgepulse 3.2s ease-out infinite; animation-delay:calc(1.4s + var(--i) * .64s); }
        .ring-badge i { animation:iconbob 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * .35s); }
        .ring-runner { stroke:#fff; filter:drop-shadow(0 0 5px rgba(255,255,255,.95)); animation:ringrun 5.5s linear infinite; }
        .ring-logo { z-index:2; animation:heartbeat 2.4s ease-in-out infinite; }
        .ring-pulse { position:absolute; left:50%; top:50%; width:34%; aspect-ratio:1; border-radius:22%; border:2px solid var(--brand); opacity:0; transform:translate(-50%,-50%); animation:ripple 3s ease-out infinite; pointer-events:none; }
        .ring-pulse.d2 { animation-delay:1.5s; }
        .life-ring:hover .ring-spin, .life-ring:hover .ring-badge { animation-play-state:running, paused; }
        .life-ring:hover .ring-spin { animation-play-state:paused; }
        .ring-badge:hover { box-shadow:0 0 0 6px var(--st), 0 10px 22px -8px rgba(21,26,52,.55); }
        @keyframes ringspin { to { transform:rotate(360deg); } }
        @keyframes ringcounter { to { transform:rotate(-360deg); } }
        @keyframes ringrun { to { stroke-dashoffset:calc(var(--C) * -1); } }
        @keyframes badgepop { from { scale:0; opacity:0; } to { scale:1; opacity:1; } }
        @keyframes badgepulse { 0% { transform:scale(1); opacity:.7; } 70%,100% { transform:scale(1.7); opacity:0; } }
        @keyframes iconbob { 0%,100% { transform:translateY(1.5px); } 50% { transform:translateY(-2.5px); } }

        /* ===== TEMA v5: tampilan modern (token baru + polesan komponen) ===== */
        :root {
            --bg:#f4f6fc; --surface:#ffffff; --surface-2:#f7f8fd; --ink:#0f1630; --muted:#5b6485; --line:#e4e8f3;
            --brand:#4f46e5; --brand-ink:#3730a3; --brand-tint:#eef0ff; --on-brand:#ffffff;
            --accent:#7c3aed; --accent-2:#db2777;
            --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#c026d3 100%);
            --grad-soft:linear-gradient(135deg,#eef0ff 0%,#faf5ff 100%);
            --shadow-sm:0 1px 2px rgba(15,22,48,.05),0 4px 14px -8px rgba(30,27,75,.14);
            --shadow-md:0 2px 6px rgba(15,22,48,.05),0 16px 36px -18px rgba(55,48,163,.28);
            --shadow-glow:0 12px 28px -12px rgba(79,70,229,.65);
            --ok:#059669; --ok-tint:#dcfce7; --bad:#dc2626; --bad-tint:#fee2e2;
        }
        .dark {
            --bg:#070b1a; --surface:#111834; --surface-2:#18203f; --ink:#eef1ff; --muted:#a2abd0; --line:#243058;
            --brand:#8b93ff; --brand-ink:#dfe2ff; --brand-tint:#232c5e; --on-brand:#0b1020;
            --accent:#a78bfa; --accent-2:#f472b6;
            --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 60%,#d946ef 100%);
            --grad-soft:linear-gradient(135deg,#1c2350 0%,#2a1747 100%);
            --shadow-sm:0 1px 2px rgba(0,0,0,.35);
            --shadow-md:0 18px 40px -20px rgba(0,0,0,.7);
            --shadow-glow:0 12px 28px -12px rgba(139,92,246,.7);
            --ok:#34d399; --ok-tint:#0f3326; --bad:#fca5a5; --bad-tint:#3d1a1d;
        }

        /* Latar: gradasi lembut, tidak mengganggu keterbacaan */
        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(900px 480px at 0% -8%, rgba(99,102,241,.16), transparent 62%),
                radial-gradient(760px 460px at 100% 0%, rgba(217,70,239,.10), transparent 60%);
            background-attachment: fixed;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }
        .dark body {
            background-image:
                radial-gradient(900px 480px at 0% -8%, rgba(99,102,241,.22), transparent 62%),
                radial-gradient(760px 460px at 100% 0%, rgba(217,70,239,.14), transparent 60%);
        }
        body h1, body h2, body h3 { letter-spacing: -.02em; }

        /* Kartu / panel: sudut lebih lembut, bayangan halus, batas tipis */
        body .rounded-3xl { border-radius: 1.5rem; }
        body .rounded-2xl { border-radius: 1.1rem; }
        body .bg-white.rounded-3xl,
        body .bg-white.rounded-2xl { box-shadow: var(--shadow-sm); }
        body .bg-white.rounded-3xl.border,
        body .bg-white.rounded-2xl.border { border-color: var(--line); }
        body .shadow-sm { box-shadow: var(--shadow-sm); }
        body .shadow-2xl { box-shadow: var(--shadow-md); }
        .panel { box-shadow: var(--shadow-sm); }

        /* Tombol utama: gradien dan efek angkat saat disentuh */
        body .btn-primary {
            background: var(--grad);
            color: #fff;
            border-radius: 1rem;
            box-shadow: var(--shadow-glow);
            transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
        }
        body .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 16px 34px -12px rgba(79,70,229,.75); }
        body .btn-primary:active { transform: translateY(0) scale(.99); }
        body .btn-primary:disabled { opacity: .55; transform: none; box-shadow: none; }
        body .btn-ghost { border-radius: 1rem; transition: background .2s ease, transform .15s ease; }
        body .btn-ghost:active { transform: scale(.98); }

        /* Input: fokus bercincin lembut */
        body .field { border-radius: 1rem; background: var(--surface-2); transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
        body .field:focus { background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
        .dark body .field:focus { box-shadow: 0 0 0 4px rgba(139,147,255,.22); }

        /* Navigasi samping: kaca buram, indikator aktif berwarna */
        body .nav-rail {
            background: color-mix(in srgb, var(--surface) 92%, transparent);
            -webkit-backdrop-filter: saturate(160%) blur(16px);
            backdrop-filter: saturate(160%) blur(16px);
        }
        body .nav-head { padding-bottom: .9rem; border-bottom: 1px solid var(--line); }
        body .nav-head img { box-shadow: var(--shadow-glow); }
        body .nav-i { border-radius: 1rem; transition: background .2s ease, color .2s ease, transform .15s ease; }
        body .nav-i:hover { transform: translateX(2px); }
        body .nav-i.on { background: var(--grad-soft); color: var(--brand-ink); box-shadow: inset 0 0 0 1px rgba(99,102,241,.18); }
        body .nav-i.on::before { background: var(--grad); }
        body .nav-foot { border-top: 1px solid var(--line); }
        body .me-av { background: var(--grad); color: #fff; box-shadow: var(--shadow-glow); }

        /* Topbar mobile & bilah bawah: kaca buram */
        body .topbar {
            background: color-mix(in srgb, var(--surface) 82%, transparent);
            -webkit-backdrop-filter: saturate(170%) blur(14px);
            backdrop-filter: saturate(170%) blur(14px);
            border-bottom: 1px solid var(--line);
        }
        body .topbar h1 { font-family: var(--font-display); font-weight: 700; }
        body .bottom-nav {
            background: color-mix(in srgb, var(--surface) 88%, transparent);
            -webkit-backdrop-filter: saturate(170%) blur(16px);

            box-shadow: 0 -10px 30px -18px rgba(15,22,48,.25);
        }
        body .bn-item.on .bn-pill { background: var(--grad); color: #fff; box-shadow: var(--shadow-glow); }
        body .bn-pill { transition: transform .2s ease, background .2s ease; }
        body .bn-item:active .bn-pill { transform: scale(.92); }

        /* Chip & filter */
        body .flt { border-radius: 999px; transition: background .2s ease, color .2s ease, transform .15s ease; }
        body .flt:active { transform: scale(.96); }
        body .flt.on { background: var(--grad); border-color: transparent; box-shadow: var(--shadow-glow); }

        /* Aksi cepat & tile */
        body .q-act, body .act, body .lm-tile {
            border-radius: 1.1rem; transition: transform .18s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
        }
        body .q-act:hover, body .act:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(99,102,241,.35); }
        body .q-act span.ic, body .lm-tile .ic, body .act-ic {
            background: var(--grad-soft); color: var(--brand-ink);
            box-shadow: inset 0 0 0 1px rgba(99,102,241,.12);
        }
        body .lm-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        body .lm-tile.lm-main { background: var(--grad); border-color: transparent; color: #fff; box-shadow: var(--shadow-glow); }
        body .lm-tile.lm-main .ic { background: rgba(255,255,255,.2); color: #fff; }

        /* Kartu absen publik */
        body .absen-cta { border-radius: 1.5rem; background: var(--grad); color: #fff; box-shadow: var(--shadow-glow); border: 0; }
        body .absen-cta .absen-ic { background: rgba(255,255,255,.2); color: #fff; }
        body .absen-cta .absen-tx p, body .absen-cta h2 { color: #fff; }
        body .absen-btn { background: #fff; color: #3730a3; border-radius: 999px; font-weight: 800; box-shadow: 0 8px 20px -10px rgba(0,0,0,.35); transition: transform .15s ease; }
        body .absen-btn:hover { transform: translateX(3px); }

        /* Statistik & ringkasan */
        body .stat-band { border-radius: 1.25rem; background: var(--surface); }
        body .stat-n { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; }
        body .cy-row:hover { background: var(--surface-2); transform: translateX(3px); }
        body .cy-bar > span { background: var(--grad); }

        /* Notifikasi (toast) */
        .toast-v5 {
            position: fixed; top: 1.25rem; right: 1.25rem; z-index: 400;
            max-width: min(92vw, 380px);
            display: flex; align-items: center; gap: .75rem;
            padding: .9rem 1.1rem .9rem .9rem;
            border-radius: 1.1rem;
            background: color-mix(in srgb, var(--surface) 96%, transparent);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-md);
            color: var(--ink);
        }
        .toast-v5 > i:first-child {
            width: 2.25rem; height: 2.25rem; border-radius: .8rem;
            display: grid; place-items: center; font-size: 1.05rem;
            background: var(--ok-tint); color: var(--ok);
        }
        .toast-v5.border-red-500 > i:first-child { background: var(--bad-tint); color: var(--bad); }
        .toast-v5 p { font-weight: 700; font-size: .95rem; line-height: 1.35; }

        /* Modal & lembar: latar kabur */
        body .fixed.inset-0.bg-black\/70 { background: rgba(8,12,30,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        body .rounded-\[2\.5rem\] { border-radius: 2rem; }
        body .ab-wrap { background: var(--bg); }
        body .ab-top { background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        body .ab-card, body .ab-tile { border-radius: 1.25rem; }
        body .ab-tile.on, body .ab-seg button.on { background: var(--grad); color: #fff; box-shadow: var(--shadow-glow); }
        body .ab-hadir:not(:disabled) { background: var(--grad); box-shadow: var(--shadow-glow); }

        /* Warna garis default konsisten dengan tema (tidak bergantung pada versi preflight Tailwind) */
        body .border, body .border-2, body .border-b, body .border-t { border-color: var(--line); }

        /* Baris input + tombol (mis. ID kartu + HADIR): input boleh menyusut, tombol tidak */
        body .flex.gap-2 > input { min-width: 0; }
        body .flex.gap-2 > button { flex-shrink: 0; }

        /* Pemeriksaan kontras & fokus tetap jelas untuk keyboard */
        :focus-visible { outline: 3px solid rgba(99,102,241,.45); outline-offset: 2px; }

        /* Perbaikan: elemen seluler (topbar, bilah bawah, tombol tutup menu) harus tersembunyi di layar lebar.

    <script type="text/babel">
        const USER_FIREBASE_CONFIG = {

        const { useState, useEffect, useRef, useMemo, Component } = React;
        const appId = typeof window !== 'undefined' && window.__app_id ? window.__app_id : 'posyandu-ilp-mawar-cikulak';

        const POSYANDU_LIST = [
            { id: 'admin', name: 'Pusat / Admin' },

            { id: 'mawar2', name: 'Posyandu Mawar 2' },

        ];



        /* ===== Konstanta & helper umum (v4.8) ===== */
        const APP_VERSION = '9.0-beta3';
        const STAFF_DOMAIN = 'posyandu.invalid';
        const staffEmail = (id) => `${id}@${STAFF_DOMAIN}`;
        const staffIdFromEmail = (email) => { const m = String(email || '').toLowerCase().match(/^(admin|mawar[1-5])@posyandu\.invalid$/); return m ? m[1] : null; };
        // Tanggal LOKAL (WIB), bukan UTC. toISOString() membuat tanggal mundur sehari sebelum pukul 07.00 WIB.
        const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        // Cache lama hanya dipakai saat migrasi satu kali. Cache aktif dipisah per role + UID Firebase.
        const LEGACY_LOCAL_DATA_KEYS = ['pos_ilp_cache_role', 'pos_ilp_cadres', 'pos_ilp_participants', 'pos_ilp_attendances', 'pos_ilp_health', 'pos_ilp_complaints', 'pos_ilp_anc', 'pos_ilp_immunizations', 'pos_ilp_home_visits', 'pos_ilp_referrals', 'pos_ilp_logistics', 'pos_ilp_education', 'pos_ilp_cadre_tasks', 'pos_ilp_creds'];
        const ACCOUNT_CACHE_DATA_KEYS = ['pos_ilp_cadres', 'pos_ilp_participants', 'pos_ilp_attendances', 'pos_ilp_health', 'pos_ilp_complaints', 'pos_ilp_anc', 'pos_ilp_immunizations', 'pos_ilp_home_visits', 'pos_ilp_referrals', 'pos_ilp_logistics', 'pos_ilp_education', 'pos_ilp_cadre_tasks'];
        const LEGACY_OUTBOX_KEY = 'pos_ilp_outbox';
        const OUTBOX_ACCOUNT_PREFIX = 'pos_ilp_outbox_account_';
        const clearLocalData = () => { try { LEGACY_LOCAL_DATA_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {} };
        const newTicket = () => { const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const b = new Uint8Array(10); (window.crypto || window.msCrypto).getRandomValues(b); return Array.from(b, x => cs[x % 32]).join(''); };

        // Tekanan darah: terima "120/80", "120 80", "120-80", "120 / 80"
        const parseBP = (v) => {
            const m = String(v == null ? '' : v).trim().match(/^(\d{2,3})\s*[\/\\\-.,\s]\s*(\d{2,3})$/);
            return m ? { sys: parseInt(m[1], 10), dia: parseInt(m[2], 10) } : null;
        };
        // Validasi nilai tidak masuk akal sebelum disimpan
        const validateHealth = (f, cat) => {
            const errs = []; const bal = cat === 'balita';
            const chk = (key, label, min, max, unit) => {
                const raw = f[key]; if (raw === '' || raw == null) return;
                const n = parseFloat(String(raw).replace(',', '.'));
                if (isNaN(n) || n < min || n > max) errs.push(`${label} "${raw}" tidak wajar (batas ${min}–${max} ${unit}). Periksa kembali.`);
            };
            chk('weight', 'Berat badan', bal ? 1 : 2, bal ? 30 : 300, 'kg');
            chk('height', 'Tinggi badan', bal ? 30 : 50, bal ? 130 : 250, 'cm');
            chk('headCirc', 'Lingkar kepala', 20, 65, 'cm');
            chk('armCirc', 'Lingkar lengan', 5, 60, 'cm');
            chk('bellyCirc', 'Lingkar perut', 30, 250, 'cm');
            chk('bloodSugar', 'Gula darah', 20, 800, 'mg/dL');
            chk('cholesterol', 'Kolesterol', 50, 600, 'mg/dL');
            chk('uricAcid', 'Asam urat', 1, 20, 'mg/dL');
            if (f.tension) {
                const bp = parseBP(f.tension);
                if (!bp) errs.push('Format tekanan darah tidak dikenali. Tulis seperti 120/80.');
                else if (bp.sys < 50 || bp.sys > 300 || bp.dia < 30 || bp.dia > 200 || bp.sys <= bp.dia) errs.push(`Tekanan darah ${bp.sys}/${bp.dia} tidak wajar. Periksa kembali.`);
            }
            return errs;
        };


        /* ===== Data warga: umur, kategori otomatis, impor (v4.9) ===== */
        const pad2 = (n) => String(n).padStart(2, '0');
        const ageMonths = (birth, ref = new Date()) => {
            const m = String(birth || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return null;
            let months = (ref.getFullYear() - +m[1]) * 12 + (ref.getMonth() - (+m[2] - 1));
            if (ref.getDate() < +m[3]) months--;
            return months < 0 ? null : months;
        };
        const ageLabel = (birth) => {
            const m = ageMonths(birth); if (m == null) return '';
            if (m < 24) return `${m} bln`;
            if (m < 60) return `${Math.floor(m / 12)} th ${m % 12} bln`;
            return `${Math.floor(m / 12)} th`;
        };
        // Bayi & balita: 0–59 bulan, anak & remaja: 5–17 th, dewasa: 18–59 th, lansia: ≥60 th.
        // Ibu hamil tidak bisa ditebak dari umur, jadi dipertahankan bila sudah dipilih manual (perempuan 10–54 th).
        const suggestCategory = (birth, gender, current) => {
            const m = ageMonths(birth); if (m == null) return current;
            const y = m / 12;
            if (current === 'ibu_hamil' && gender !== 'L' && y >= 10 && y < 55) return current;
            if (m < 60) return 'balita'; if (y < 18) return 'remaja'; if (y < 60) return 'dewasa'; return 'lansia';
        };
        const isActivePerson = (p) => !p.status || p.status === 'aktif';
        const STATUS_LABEL = { aktif: 'Aktif', pindah: 'Pindah domisili', meninggal: 'Meninggal' };

        const parseCSV = (text) => {
            text = String(text || '').replace(/^\uFEFF/, '');
            const first = text.split(/\r?\n/)[0] || '';
            const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
            const rows = []; let row = [], cur = '', q = false;
            const endRow = () => { row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; };
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
                else if (c === '"') q = true;
                else if (c === delim) { row.push(cur); cur = ''; }
                else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; endRow(); }
                else cur += c;
            }
            if (cur !== '' || row.length) endRow();
            return rows;
        };
        const toISODate = (v) => {
            if (v == null || v === '') return '';
            if (v instanceof Date) return localDate(new Date(v.getTime() + 12 * 3600e3));
            if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
            const t = String(v).trim(); let y, mo, d, m;
            if ((m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
            else if ((m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
            else return null;
            const chk = new Date(y, mo - 1, d);
            if (chk.getFullYear() !== y || chk.getMonth() !== mo - 1 || chk.getDate() !== d) return null;
            return `${y}-${pad2(mo)}-${pad2(d)}`;
        };
        const IMPORT_ALIASES = {
            name: ['nama', 'namalengkap', 'name'], nik: ['nik', 'noidentitas', 'noktp'],
            birthDate: ['tanggallahir', 'tgllahir', 'lahir', 'birthdate', 'tl'], gender: ['jeniskelamin', 'jk', 'gender', 'sex'],
            address: ['alamat', 'address'], rt: ['rt'], rw: ['rw'],
            parentName: ['namaortuwali', 'namaortu', 'orangtua', 'wali', 'namaorangtua', 'namaorangtuawali', 'ortu'],
            phone: ['nohp', 'hp', 'telepon', 'telp', 'whatsapp', 'wa', 'phone'], category: ['kategori', 'klaster', 'siklus', 'siklushidup'],
            posyandu: ['posyandu', 'pos']
        };
        const mapImportRow = (obj, ctx) => {
            const norm = {}; Object.keys(obj).forEach(k => { norm[String(k).toLowerCase().replace(/[^a-z0-9]/g, '')] = obj[k]; });
            const get = (f) => { for (const a of IMPORT_ALIASES[f]) if (norm[a] !== undefined && String(norm[a]).trim() !== '') return norm[a]; return ''; };
            const errors = [];
            const name = String(get('name')).trim().replace(/\s+/g, ' ');
            if (!name) errors.push('Nama kosong');
            let nik = String(get('nik')).trim();
            if (/e\+/i.test(nik)) { errors.push('NIK rusak oleh Excel (format angka). Ubah kolom NIK menjadi Teks'); nik = ''; }
            else { nik = nik.replace(/\D/g, ''); if (nik && nik.length !== 16) errors.push('NIK harus 16 digit'); }
            const rawBirth = get('birthDate'); const birthDate = toISODate(rawBirth);
            if (birthDate === null) errors.push(`Tanggal lahir "${rawBirth}" tidak dikenali (pakai DD/MM/YYYY atau YYYY-MM-DD)`);
            else if (birthDate && birthDate > localDate()) errors.push('Tanggal lahir di masa depan');
            const g = String(get('gender')).trim().toLowerCase(); const gender = g.startsWith('l') ? 'L' : g.startsWith('p') ? 'P' : '';
            let posyandu = ctx.isAdmin ? '' : ctx.role;
            if (ctx.isAdmin) { const pm = String(get('posyandu')).toLowerCase().replace(/[^a-z0-9]/g, '').match(/^(posyandu)?mawar([1-5])$/); if (pm) posyandu = 'mawar' + pm[2]; else errors.push('Kolom posyandu harus Mawar 1 sampai Mawar 5'); }
            const ct = String(get('category')).toLowerCase(); let ilpCategory = '';
            if (ct) ilpCategory = /hamil|menyusui|bumil/.test(ct) ? 'ibu_hamil' : /balita|bayi/.test(ct) ? 'balita' : /remaja|anak/.test(ct) ? 'remaja' : /dewasa|produktif/.test(ct) ? 'dewasa' : /lansia/.test(ct) ? 'lansia' : '';
            if (ct && !ilpCategory) errors.push(`Kategori "${get('category')}" tidak dikenali`);
            if (birthDate) ilpCategory = suggestCategory(birthDate, gender, ilpCategory || 'dewasa');
            if (!ilpCategory && !errors.length) errors.push('Isi tanggal lahir atau kategori');
            if (nik && ctx.nikSet.has(nik)) errors.push('NIK sudah terdaftar (dilewati)');
            if (nik && !errors.length) ctx.nikSet.add(nik);
            return { errors, data: { name, nik, gender, birthDate: birthDate || '', address: String(get('address')).trim(), rt: String(get('rt')).trim(), rw: String(get('rw')).trim(), parentName: String(get('parentName')).trim(), phone: String(get('phone')).trim(), ilpCategory, posyandu, status: 'aktif' } };
        };
        const loadXlsx = () => new Promise((res, rej) => {
            if (window.XLSX) return res(window.XLSX);
            const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            sc.onload = () => res(window.XLSX); sc.onerror = () => rej(new Error('xlsx')); document.head.appendChild(sc);
        });
        const genPersonId = (taken) => { let id; do { id = 'ILP-' + Math.random().toString(36).replace(/[^a-z0-9]/g, '').padEnd(5, '0').substring(0, 5).toUpperCase(); } while (taken.has(id)); taken.add(id); return id; };

        /* ===== Absen mandiri (publik): hanya dengan kartu QR / ID kartu, tanpa membaca data warga ===== */
        function AbsenMandiri({ onClose, posyanduList, isPosyanduOpen, schedule, submitAbsen }) {
            const posList = posyanduList.filter(p => p.id !== 'admin');
            const [pos, setPos] = useState(() => getSafeLocal('pos_ilp_lastpos', ''));
            const [code, setCode] = useState('');
            const [cam, setCam] = useState(false);
            const [busy, setBusy] = useState(false);
            const [result, setResult] = useState(null);
            const lastScan = useRef({ id: '', t: 0 });
            const open = isPosyanduOpen();
            const posName = (id) => posyanduList.find(x => x.id === id)?.name || id;
            const choosePos = (id) => { setPos(id); setResult(null); try { localStorage.setItem('pos_ilp_lastpos', JSON.stringify(id)); } catch (e) {} };

            const send = async (raw) => {
                if (busy) return;
                const id = (raw || '').trim().toUpperCase();
                if (!pos) return setResult({ ok: false, msg: 'Pilih posyandu Anda terlebih dahulu.' });
                setBusy(true);
                const r = await submitAbsen(id, pos);
                setResult(r.ok ? { ok: true, msg: `Kehadiran untuk kartu ${id} tercatat di ${posName(pos)}. Terima kasih!` } : r);
                if (r.ok) setCode('');
                setBusy(false);
            };
            const onScan = (raw) => {
                const id = (raw || '').trim().toUpperCase(); const now = Date.now();
                if (lastScan.current.id === id && now - lastScan.current.t < 4000) return;
                lastScan.current = { id, t: now };
                send(id);
            };
            const tanggal = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            return (
                <div className="ab-wrap" role="dialog" aria-modal="true" aria-label="Absen kehadiran">
                    <header className="ab-top">
                        <button onClick={onClose} className="ab-x" aria-label="Tutup"><i className="fa-solid fa-arrow-left"></i></button>
                        <div><h2>Absen kehadiran</h2><p>{tanggal}</p></div>
                        <span className={`ab-state ${open ? 'on' : ''}`}>{open ? `Dibuka · s.d. ${schedule?.endTime || '13:00'}` : 'Sedang ditutup'}</span>
                    </header>
                    <div className="ab-body">
                        {!open && <div className="ab-closed ab-full"><i className="fa-solid fa-lock mt-1"></i><div><b>Absen hanya bisa dilakukan saat jadwal pelayanan.</b><br/>Jam layanan: {schedule?.startTime || '07:00'} – {schedule?.endTime || '13:00'}.</div></div>}
                        {result && <div className={`${result.ok ? 'ab-ok' : 'ab-closed'} ab-full`} role="status"><i className={`fa-solid ${result.ok ? 'fa-circle-check' : 'fa-circle-exclamation'} text-xl mt-0.5`}></i><span>{result.msg}</span></div>}

                        <section className="ab-card">
                            <h3>1. Pilih posyandu</h3>
                            <div className="ab-chips scrollbar-hide">
                                {posList.map(x => <button key={x.id} className={`flt ${pos === x.id ? 'on' : ''}`} onClick={() => choosePos(x.id)}>{x.name.replace('Posyandu ', '')}</button>)}
                            </div>
                            <p className="ab-lbl">2. Scan kartu QR atau ketik ID kartu</p>
                            <div className="ab-seg">
                                <button className={!cam ? 'on' : ''} onClick={() => setCam(false)}><i className="fa-solid fa-keyboard mr-2"></i>Ketik ID kartu</button>
                                <button className={cam ? 'on' : ''} onClick={() => setCam(true)}><i className="fa-solid fa-qrcode mr-2"></i>Scan kartu</button>
                            </div>
                            {!cam ? (
                                <form onSubmit={(e) => { e.preventDefault(); if (code.trim()) send(code); }}>
                                    <input className="field" value={code} onChange={e => setCode(e.target.value.toUpperCase())} placeholder="Contoh: ILP-AB12C" aria-label="ID kartu" autoCapitalize="characters" autoComplete="off" disabled={!open} />
                                    <button type="submit" className="btn-primary w-full" style={{ marginTop: '.75rem' }} disabled={!open || busy || !code.trim()}>{busy ? 'Mengirim...' : 'Hadir'}</button>
                                </form>
                            ) : <CameraScanner onScan={onScan} isPosyanduOpen={open} />}
                            <p className="ab-empty"><i className="fa-solid fa-shield-halved mr-1"></i>Demi privasi, nama warga tidak ditampilkan di layar ini. Lupa atau belum punya kartu? Minta bantuan kader.</p>
                        </section>
                    </div>
                </div>
            );
        }

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center bg-red-50 dark:bg-slate-900 p-8 text-center">
                            <i className="fa-solid fa-triangle-exclamation text-red-600 text-6xl mb-4"></i>
                            <h1 className="text-3xl font-black text-red-800 dark:text-red-400 mb-2">Ada kendala pada tampilan</h1>
                            <p className="text-red-700 dark:text-red-300 font-bold mb-6">Data Anda tetap tersimpan. Muat ulang aplikasi untuk melanjutkan.</p>
                            <button onClick={() => { window.location.reload(); }} className="bg-red-600 text-white px-8 py-4 rounded-xl font-black shadow-lg hover:bg-red-700 transition-all">Muat ulang aplikasi</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const getSafeLocal = (key, fallback) => { try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; } catch { return fallback; } };
        const setLocal = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } };
        const accountCacheKey = (role, uid, key) => `pos_ilp_account_${role}_${encodeURIComponent(String(uid || ''))}_${key.replace(/^pos_ilp_/, '')}`;
        const accountOutboxKey = (role, uid) => `${OUTBOX_ACCOUNT_PREFIX}${role}_${encodeURIComponent(String(uid || ''))}`;
        const getAccountLocal = (role, uid, key, fallback) => getSafeLocal(accountCacheKey(role, uid, key), fallback);
        const setAccountLocal = (role, uid, key, value) => setLocal(accountCacheKey(role, uid, key), value);
        const migrateLegacyCacheForAccount = (role, uid) => {
            // Migrasi hanya dari cache Beta 1 yang ditandai untuk role yang sama.
            if (getSafeLocal('pos_ilp_cache_role', null) !== role) return;
            ACCOUNT_CACHE_DATA_KEYS.forEach(key => {
                try {
                    const target = accountCacheKey(role, uid, key);
                    if (localStorage.getItem(target) === null) {
                        const legacy = localStorage.getItem(key);
                        if (legacy !== null) localStorage.setItem(target, legacy);
                    }
                } catch (e) {}
            });
            clearLocalData();
        };
        const loadAccountOutbox = (role, uid) => {
            const scopedKey = accountOutboxKey(role, uid);
            const scoped = getSafeLocal(scopedKey, []);
            const legacy = getSafeLocal(LEGACY_OUTBOX_KEY, []);
            // Namespace akun bukan satu-satunya bukti kepemilikan: validasi juga ownerRole/ownerUid.
            const belongsToAccount = x => x && x.ownerRole === role && (!x.ownerUid || x.ownerUid === uid);
            const current = (Array.isArray(scoped) ? scoped : []).filter(belongsToAccount)
                .map(x => ({ ...x, ownerUid: uid }));
            // Antrean Beta 1 tidak memiliki ownerUid; role lama menjadi penanda migrasinya.
            // Antrean yang sudah menyimpan UID berbeda tidak boleh dipindahkan ke akun baru.
            const mine = (Array.isArray(legacy) ? legacy : []).filter(belongsToAccount)
                .map(x => ({ ...x, ownerUid: uid }));
            const merged = [];
            const seen = new Set();
            [...current, ...mine].forEach(item => {
                const identity = item.revision || `${item.ownerRole || role}:${item.key || ''}:${item.queuedAt || ''}`;
                if (!seen.has(identity)) { seen.add(identity); merged.push(item); }
            });
            // Item role sama tetapi UID berbeda tetap di antrean legacy, bukan dihapus atau diadopsi.
            const remaining = (Array.isArray(legacy) ? legacy : []).filter(x =>
                !x || x.ownerRole !== role || (x.ownerUid && x.ownerUid !== uid)
            );
            if (merged.length || Array.isArray(scoped)) setLocal(scopedKey, merged);
            setLocal(LEGACY_OUTBOX_KEY, remaining);
            return merged;
        };
        const getAccountPendingOutbox = (role, uid) => {
            if (!role || !uid) return [];
            const value = getSafeLocal(accountOutboxKey(role, uid), []);
            return (Array.isArray(value) ? value : []).filter(x => x && x.ownerRole === role && x.ownerUid === uid);
        };

        function exportToExcel(filename, rows, headers) {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += headers.join(",") + "\r\n";
            rows.forEach(row => { csvContent += row.map(e => `"${(e ?? '').toString().replace(/"/g, '""')}"`).join(",") + "\r\n"; });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a"); link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${filename}_${localDate()}.xls`);
            document.body.appendChild(link); link.click(); link.remove();
        }

        const getAnalysis = (form, cat, gender) => {
            let diag = [], rec = [];
            const isBalita = cat === 'balita';

            if (form.weight && form.height) {
                const h = parseFloat(form.height)/100;
                const bmi = parseFloat(form.weight) / (h*h);
                if (!isBalita) {
                    if (bmi >= 30) { diag.push("Obesitas"); rec.push("Diet rendah kalori & lemak, olahraga teratur."); }
                    else if (bmi >= 25) { diag.push("Overweight"); rec.push("Jaga pola makan, kurangi konsumsi gula berlebih."); }
                    else if (bmi < 18.5) { diag.push("Underweight"); rec.push("Tingkatkan asupan gizi sehat dan protein."); }
                }
            }
            
            if (isBalita) {
                if (form.headCirc && parseFloat(form.headCirc) < 32) { diag.push("Lingkar Kepala Kurang"); rec.push("Pantau perkembangan saraf & otak secara intensif."); }
                if (form.armCirc && parseFloat(form.armCirc) < 11.5) { diag.push("Risiko Gizi Buruk (LILA < 11.5cm)"); rec.push("Segera berikan PMT (Pemberian Makanan Tambahan) tinggi protein."); }
                if (diag.length===0 && form.weight) { diag.push("Pengukuran Tercatat (status gizi belum dinilai)"); rec.push("Plot hasil timbang pada KMS/Buku KIA. Status gizi (BB/U, TB/U, BB/TB) dinilai petugas memakai standar WHO."); }
            } else {
                const bp = form.tension ? parseBP(form.tension) : null;
                if (bp) {
                    if (bp.sys >= 140 || bp.dia >= 90) { diag.push("Hipertensi (Darah Tinggi)"); rec.push("Kurangi asupan garam/natrium, rutin cek tekanan darah, kurangi stres. Bila berulang, rujuk ke Puskesmas."); }
                    else if (bp.sys < 90 || bp.dia < 60) { diag.push("Hipotensi (Darah Rendah)"); rec.push("Istirahat cukup, perbanyak asupan cairan dan makanan bergizi."); }
                }
                if (form.bloodSugar && parseFloat(form.bloodSugar) >= 200) { diag.push("Gula Darah Tinggi"); rec.push("Kurangi karbohidrat, hindari minuman manis, segera rujuk ke faskes."); }
                if (form.cholesterol && parseFloat(form.cholesterol) >= 200) { diag.push("Hiperkolesterolemia"); rec.push("Hindari makanan bersantan, gorengan, dan lemak jenuh."); }
                if (form.uricAcid && parseFloat(form.uricAcid) >= 7.0) { diag.push("Asam Urat Tinggi"); rec.push("Kurangi asupan jeroan, kacang-kacangan, dan perbanyak minum air putih."); }
                if (form.armCirc && parseFloat(form.armCirc) < 23.5 && cat === 'ibu_hamil') { diag.push("Risiko KEK Kehamilan"); rec.push("Tingkatkan asupan makanan padat kalori & protein hewani."); }
                if (form.bellyCirc && (cat === 'dewasa' || cat === 'lansia')) {
                    const bc = parseFloat(String(form.bellyCirc).replace(',', '.'));
                    const lim = gender === 'P' ? 80 : 90;
                    if (bc > lim) { diag.push(`Obesitas Sentral (lingkar perut > ${lim} cm)`); rec.push("Olahraga kardio rutin 30 menit sehari & pantau diet."); }
                    else if (!gender && bc > 80) { diag.push("Lingkar Perut 80–90 cm (berisiko bila perempuan; lengkapi jenis kelamin)"); rec.push("Isi jenis kelamin pada data warga agar ambang lingkar perut tepat (laki-laki > 90 cm, perempuan > 80 cm)."); }
                }
                
                if (diag.length===0 && (form.weight||form.tension)) { diag.push("Indikator Normal"); rec.push("Pertahankan gaya hidup sehat (CERDIK) dan olahraga teratur."); }
            }
            return { diagnosis: diag.length ? diag.join(", ") : "Menunggu Data", recommendation: rec.length ? rec.join(" ") : "-" };
        };

        function CustomBarChart({ data }) {
            return (
                <div className="flex items-end justify-around h-full pt-4 border-b-2 border-slate-200 dark:border-slate-700 gap-2">
                    {data.map((item, i) => (
                        <div key={i} className="flex flex-col items-center flex-1 h-full justify-end group">
                            <div className="w-full flex justify-center gap-1.5 items-end h-[85%] relative">
                                <div style={{height: Math.min((item.Terdaftar||0) * 5, 100) + '%'}} className="w-1/3 bg-slate-300 dark:bg-slate-700 rounded-t-lg transition-all"></div>
                                <div style={{height: Math.min((item.Hadir||0) * 10, 100) + '%'}} className="w-1/3 bg-indigo-500 rounded-t-lg transition-all shadow-md"></div>
                            </div>
                            <p className="text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-2 text-center leading-tight truncate w-full">{item.name}</p>
                        </div>
                    ))}

            )
        }

        function TrendChart({ title, data, color }) {
            if (!data || data.length < 2) return null;
            const width = 280; const height = 110; const padX = 25; const padY = 30;
            const vals = data.map(d => d.value);
            const max = Math.max(...vals); const min = Math.min(...vals);
            const range = max - min || 1;

            const pts = data.map((d, i) => {
                const x = padX + (i * ((width - 2 * padX) / (data.length - 1)));
                const y = height - padY - (((d.value - min) / range) * (height - 2 * padY));
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm flex-1 min-w-[260px]">
                    <h5 className="text-xs font-black text-slate-500 dark:text-slate-400 mb-2">{title}</h5>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-24 overflow-visible">
                        <line x1={padX} y1={padY} x2={width-padX} y2={padY} stroke="#cbd5e1" strokeDasharray="4" className="dark:opacity-30" />
                        <line x1={padX} y1={height-padY} x2={width-padX} y2={height-padY} stroke="#cbd5e1" strokeDasharray="4" className="dark:opacity-30" />
                        <polyline points={pts} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                        {data.map((d, i) => {
                            const x = padX + (i * ((width - 2 * padX) / (data.length - 1)));
                            const y = height - padY - (((d.value - min) / range) * (height - 2 * padY));
                            return (
                                <g key={i}>
                                    <circle cx={x} cy={y} r="4" fill="white" stroke={color} strokeWidth="2" />
                                    <text x={x} y={y - 8} fontSize="10" fill="currentColor" className="text-slate-700 dark:text-slate-200 font-black" textAnchor="middle">{d.value}</text>
                                    <text x={x} y={height} fontSize="9" fill="currentColor" className="text-slate-400 font-bold" textAnchor="middle">{d.label}</text>
                                </g>
                            )
                        })}
                    </svg>
                </div>
            );
        }

        // Hitung umur saat tanggal pemeriksaan tanpa ketergantungan zona waktu browser.
        const ageMonthsAtDate = (birthDate, examDate) => {
            const parse = value => {
                const m = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (!m) return null;
                const y = Number(m[1]), mo = Number(m[2]), day = Number(m[3]);
                const check = new Date(Date.UTC(y, mo - 1, day));
                if (y < 1900 || check.getUTCFullYear() !== y || check.getUTCMonth() !== mo - 1 || check.getUTCDate() !== day) return null;
                return { y, mo, day };
            };
            const birth = parse(birthDate), exam = parse(examDate);
            if (!birth || !exam) return null;
            const birthTime = Date.UTC(birth.y, birth.mo - 1, birth.day);
            const examTime = Date.UTC(exam.y, exam.mo - 1, exam.day);
            if (examTime < birthTime) return null;
            let months = (exam.y - birth.y) * 12 + (exam.mo - birth.mo);
            // Untuk tanggal lahir 29–31, hari ulang bulan dijepit ke hari terakhir bulan tujuan.
            const targetYear = birth.y + Math.floor((birth.mo - 1 + months) / 12);
            const targetMonth = (birth.mo - 1 + months) % 12 + 1;
            const lastDay = new Date(Date.UTC(targetYear, targetMonth, 0)).getUTCDate();
            const anniversaryDay = Math.min(birth.day, lastDay);
            if (exam.day < anniversaryDay) months--;
            return months < 0 ? null : months;
        };

        function GrowthTrendChart({ title, data, unit, color }) {
            if (!data || data.length < 2) return null;
            const width = 340, height = 170, left = 42, right = 14, top = 22, bottom = 34;
            const sorted = [...data].sort((a,b) => a.ageMonths - b.ageMonths || String(a.date).localeCompare(String(b.date)));
            const minX = Math.min(...sorted.map(d => d.ageMonths));
            const maxX = Math.max(...sorted.map(d => d.ageMonths));
            const minY = Math.min(...sorted.map(d => d.value));
            const maxY = Math.max(...sorted.map(d => d.value));
            const xRange = Math.max(1, maxX - minX);
            const yRange = maxY - minY || Math.max(1, Math.abs(maxY) * 0.1);
            const yMin = Math.max(0, minY - yRange * 0.12);
            const yMax = maxY + yRange * 0.12;
            const plotW = width - left - right, plotH = height - top - bottom;
            const xAt = x => left + ((x - minX) / xRange) * plotW;
            const yAt = y => top + ((yMax - y) / (yMax - yMin || 1)) * plotH;
            const points = sorted.map(d => `${xAt(d.ageMonths)},${yAt(d.value)}`).join(' ');
            const span = maxX - minX;
            const tickStep = span <= 6 ? 1 : span <= 12 ? 3 : span <= 24 ? 6 : 12;
            const firstTick = Math.ceil(minX / tickStep) * tickStep;
            const ticks = [];
            for (let x = firstTick; x <= maxX; x += tickStep) ticks.push(x);
            if (!ticks.length || ticks[0] > minX) ticks.unshift(minX);
            if (ticks[ticks.length - 1] < maxX) ticks.push(maxX);
            const ageLabel = m => m < 12 ? `${m} bln` : (m % 12 === 0 ? `${m / 12} th` : `${Math.floor(m / 12)} th ${m % 12} bln`);
            const fmt = n => Number(n).toLocaleString('id-ID', { maximumFractionDigits: 1 });
            return <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border dark:border-slate-700 min-w-[280px] flex-1">
                <h5 className="text-xs font-black text-slate-700 dark:text-slate-200 mb-1">{title}</h5>
                <p className="text-[10px] text-slate-500 mb-2">Umur saat pemeriksaan · {unit}</p>
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto" role="img" aria-label={`${title} berdasarkan umur saat pemeriksaan`}>
                    {[0,1,2,3].map(i => {
                        const y = top + (plotH * i / 3), v = yMax - ((yMax-yMin) * i / 3);
                        return <g key={i}><line x1={left} y1={y} x2={width-right} y2={y} stroke="#cbd5e1" strokeDasharray="3 4"/><text x={left-6} y={y+3} textAnchor="end" fontSize="9" fill="currentColor">{fmt(v)}</text></g>;
                    })}
                    {ticks.map((x,i) => <g key={`${x}-${i}`}><line x1={xAt(x)} y1={top} x2={xAt(x)} y2={height-bottom} stroke="#cbd5e1" strokeDasharray="2 5" opacity=".5"/><text x={xAt(x)} y={height-12} textAnchor="middle" fontSize="9" fill="currentColor">{ageLabel(x)}</text></g>)}
                    <polyline points={points} fill="none" stroke={color} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" />
                    {sorted.map((d,i) => <g key={`${d.date}-${i}`}><circle cx={xAt(d.ageMonths)} cy={yAt(d.value)} r="4" fill="white" stroke={color} strokeWidth="2"/><title>{`${d.date}: ${fmt(d.value)} ${unit} · ${ageLabel(d.ageMonths)}`}</title></g>)}
                </svg>
                <p className="text-[10px] text-slate-500 mt-1">{sorted.length} pengukuran · {sorted[0].date} s.d. {sorted[sorted.length-1].date}</p>
            </div>;
        }

        function ParticipantCharts({ participant, records }) {
            const chartHist = [...(records || [])].filter(r => r && r.date).sort((a,b) => (a.date || '').localeCompare(b.date || ''));
            const isBalita = participant?.ilpCategory === 'balita';
            const hasBirthDate = chartHist.some(r => ageMonthsAtDate(participant?.birthDate, r.date) !== null);
            const hasHistoryInBalitaAge = chartHist.some(r => {
                const months = ageMonthsAtDate(participant?.birthDate, r.date);
                return months !== null && months < 60;
            });
            if ((isBalita || hasHistoryInBalitaAge) && hasBirthDate) {
                const growthRows = chartHist.map(r => ({
                    date: r.date,
                    ageMonths: ageMonthsAtDate(participant.birthDate, r.date),
                    weight: Number(r.weight), height: Number(r.height),
                    headCirc: Number(r.headCirc), armCirc: Number(r.armCirc)
                })).filter(r => r.ageMonths !== null && r.ageMonths < 60);
                const series = [
                    { key: 'weight', title: 'Berat badan', unit: 'kg', color: '#3b82f6' },
                    { key: 'height', title: 'Panjang / tinggi badan', unit: 'cm', color: '#059669' },
                    { key: 'headCirc', title: 'Lingkar kepala', unit: 'cm', color: '#0891b2' },
                    { key: 'armCirc', title: 'Lingkar lengan atas (LiLA)', unit: 'cm', color: '#a855f7' }
                ].map(meta => ({ ...meta, data: growthRows.filter(r => Number.isFinite(r[meta.key]) && r[meta.key] > 0).map(r => ({ date:r.date, ageMonths:r.ageMonths, value:r[meta.key] })) }));
                const ready = series.filter(item => item.data.length >= 2);
                return <div className="mb-6 space-y-3">
                    <div><h5 className="font-black text-sm text-slate-800 dark:text-slate-100 mb-1 flex items-center gap-2"><i className="fa-solid fa-chart-line text-indigo-500"></i> Grafik pertumbuhan balita</h5><p className="text-[11px] text-slate-500">Sumbu mendatar menunjukkan umur saat pemeriksaan. Grafik menampilkan riwayat pengukuran, bukan penilaian status gizi atau diagnosis.</p></div>
                    {ready.length > 0 ? <div className="flex flex-wrap gap-3">{ready.map(item => <GrowthTrendChart key={item.key} title={item.title} unit={item.unit} color={item.color} data={item.data} />)}</div> : <div className="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-amber-200 text-sm">Belum cukup data untuk menggambar tren. Setiap indikator memerlukan minimal dua pengukuran valid pada tanggal berbeda.</div>}
                    {growthRows.length < chartHist.length && <p className="text-[10px] text-slate-500">Sebagian pemeriksaan tidak ditampilkan karena tanggal lahir/tanggal pemeriksaan tidak valid atau umur di luar rentang balita (0–59 bulan).</p>}
                </div>;
            }
            if (chartHist.length < 2) return <div className="mb-6 bg-indigo-50 dark:bg-indigo-950/40 p-5 rounded-3xl border-2 border-indigo-100 dark:border-indigo-900 text-center text-sm font-bold text-indigo-700 dark:text-indigo-300 shadow-sm animate-fade-in"><i className="fa-solid fa-chart-line text-indigo-400 text-4xl mb-3 block"></i>Grafik tren akan muncul setelah tersedia minimal dua riwayat pemeriksaan.</div>;
            const wData = chartHist.filter(r => Number.isFinite(Number(r.weight)) && Number(r.weight) > 0).map(r => ({ label:(r.date || '').slice(5), value:Number(r.weight) }));
            const hData = chartHist.filter(r => Number.isFinite(Number(r.height)) && Number(r.height) > 0).map(r => ({ label:(r.date || '').slice(5), value:Number(r.height) }));
            const tData = chartHist.filter(r => r.tension).map(r => ({ label:(r.date || '').slice(5), value:(parseBP(r.tension) || {sys:NaN}).sys })).filter(d => Number.isFinite(d.value));
            const sData = chartHist.filter(r => Number.isFinite(Number(r.bloodSugar)) && Number(r.bloodSugar) > 0).map(r => ({ label:(r.date || '').slice(5), value:Number(r.bloodSugar) }));
            return <div className="mb-6"><h5 className="font-black text-sm text-slate-800 dark:text-slate-100 mb-3 flex items-center gap-2"><i className="fa-solid fa-chart-line text-indigo-500"></i> Grafik tren pemeriksaan ILP</h5>
                {isBalita && <p className="text-[11px] text-amber-700 dark:text-amber-300 mb-2">Tanggal lahir belum valid, sehingga grafik menurut umur belum dapat ditampilkan. Lengkapi tanggal lahir warga untuk mengaktifkan grafik pertumbuhan.</p>}
                <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar">{wData.length >= 2 && <TrendChart title="Grafik Berat Badan (kg)" data={wData} color="#3b82f6" />}{hData.length >= 2 && <TrendChart title="Grafik Tinggi Badan (cm)" data={hData} color="#059669" />}{tData.length >= 2 && <TrendChart title="Tensi Darah (Sistolik)" data={tData} color="#a855f7" />}{sData.length >= 2 && <TrendChart title="Grafik Gula Darah" data={sData} color="#f59e0b" />}</div>
            </div>;
        }


        function CadreTaskWorkspace({ role, isAdmin, cadres, tasks, posyanduList, syncData, showNotification }) {
            const [title, setTitle] = useState('');
            const [assignee, setAssignee] = useState('');
            const [dueDate, setDueDate] = useState(localDate());
            const [priority, setPriority] = useState('normal');
            const [pos, setPos] = useState(isAdmin ? 'mawar1' : role);
            const [filter, setFilter] = useState('aktif');
            const scopedTasks = (tasks || []).filter(t => isAdmin || t.posyandu === role)
                .filter(t => filter === 'semua' || (filter === 'selesai' ? t.status === 'selesai' : t.status !== 'selesai'))
                .sort((a,b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
            const availableCadres = (cadres || []).filter(c => c.posyandu === (isAdmin ? pos : role));
            const saveTask = async (e) => {
                e.preventDefault();
                if (!title.trim() || !assignee || !dueDate) return showNotification('Lengkapi nama tugas, kader, dan tenggat.', 'error');
                const c = availableCadres.find(x => x.id === assignee);
                if (!c) return showNotification('Kader yang dipilih tidak ditemukan pada Posyandu ini.', 'error');
                const id = `TSK-${Date.now()}`;
                const ok = await syncData('cadre_tasks', id, { title: title.trim(), assigneeId: c.id, assigneeName: c.name, dueDate, priority, status: 'baru', posyandu: isAdmin ? pos : role, createdBy: role, createdAt: new Date().toISOString() });
                if (ok) { setTitle(''); setAssignee(''); showNotification('Tugas kader berhasil ditambahkan.'); }
            };
            const updateStatus = async (task, status) => {
                await syncData('cadre_tasks', task.id, { ...task, status, completedAt: status === 'selesai' ? new Date().toISOString() : '' });
            };
            return <div className="space-y-5">
                <div><h2 className="text-2xl font-black text-slate-800 dark:text-slate-100">Manajemen Tugas Kader</h2><p className="text-sm text-slate-500 mt-1">Pembagian tugas, penanggung jawab, tenggat, dan status pelaksanaan.</p></div>
                <form onSubmit={saveTask} className="bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 p-5 grid grid-cols-1 md:grid-cols-2 gap-3">
                    {isAdmin && <label className="text-sm font-bold">Posyandu<select value={pos} onChange={e=>{setPos(e.target.value);setAssignee('');}} className="mt-1 w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700">{posyanduList.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></label>}
                    <label className="text-sm font-bold">Nama tugas<input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Contoh: menyiapkan meja penimbangan" className="mt-1 w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700" maxLength="120" /></label>

        function WhatsAppReminderWorkspace({ role, isAdmin, participants, schedule, posyanduList }) {

            });
            const makeLink = p => {
                let phone = String(p.phone || p.hp || p.telepon || p.whatsapp || '').replace(/\D/g,'');
                if (phone.startsWith('00')) phone = phone.slice(2);
                if (phone.startsWith('0')) phone = '62' + phone.slice(1);

                return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            };
            return <div className="space-y-5">
                <div><h2 className="text-2xl font-black text-slate-800 dark:text-slate-100">Pengingat Jadwal melalui WhatsApp</h2><p className="text-sm text-slate-500 mt-1">Menyusun pesan dan membuka WhatsApp untuk dikirim secara manual. Fitur ini tidak mengirim pesan otomatis.</p></div>
                <section className="bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-3xl p-5 space-y-3">

                    <label className="block text-sm font-bold">Isi pesan<textarea value={message} onChange={e=>setMessage(e.target.value)} rows="4" maxLength="1000" className="mt-1 w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700" /></label>
                    <label className="block text-sm font-bold">Cari nama warga<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Ketik nama..." className="mt-1 w-full p-3 rounded-xl border dark:bg-slate-800 dark:border-slate-700" /></label>

                <p className="text-xs text-slate-500">Privasi: periksa kembali penerima dan isi pesan sebelum mengirim. Hindari mencantumkan hasil pemeriksaan atau informasi kesehatan sensitif di pesan.</p>
            </div>;
        }

        function MainApp() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [localMode, setLocalMode] = useState(false);
