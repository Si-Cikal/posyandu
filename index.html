            const [outbox, setOutboxState] = useState([]);
            const outboxRef = useRef(outbox);
            const [cacheHydratedAccount, setCacheHydratedAccount] = useState(null);
            const outboxLock = useRef(false);
            const updateOutbox = (updater) => {
                const next = typeof updater === 'function' ? updater(outboxRef.current) : updater;
                outboxRef.current = Array.isArray(next) ? next : [];
                setOutboxState(outboxRef.current);
                const persisted = role && user?.uid ? setLocal(accountOutboxKey(role, user.uid), outboxRef.current) : false;
                if (role && user?.uid && !persisted) showNotification('Penyimpanan perangkat penuh. Segera ekspor backup dan kosongkan ruang sebelum melanjutkan.', 'error');
            };
            const [firebaseDb, setFirebaseDb] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [loggingIn, setLoggingIn] = useState(false);
            const [showPwdModal, setShowPwdModal] = useState(false);

            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [showPwd, setShowPwd] = useState(false);
            const [siklus, setSiklus] = useState('all');
            const [menuGroups, setMenuGroups] = useState({ master: true, report: true, service: true, siklus: true });
            const toggleGroup = (key) => setMenuGroups(prev => ({...prev, [key]: !prev[key]}));

            const [darkMode, setDarkMode] = useState(() => getSafeLocal('pos_ilp_dark', false));
            const [fontSizeScale, setFontSizeScale] = useState(() => getSafeLocal('pos_ilp_font', 'normal'));

            const [cadres, setCadres] = useState([]);
            const [participants, setParticipants] = useState([]);
            const [attendancesRaw, setAttendances] = useState([]);
            const [healthRecords, setHealthRecords] = useState([]);
            const [complaints, setComplaints] = useState([]);
            const [ancRecords, setAncRecords] = useState([]);
            const [immunizations, setImmunizations] = useState([]);
            const [homeVisits, setHomeVisits] = useState([]);
            const [referrals, setReferrals] = useState([]);
            const [logistics, setLogistics] = useState([]);
            const [educationRecords, setEducationRecords] = useState([]);
            const [cadreTasks, setCadreTasks] = useState([]);
            const [schedule, setSchedule] = useState(() => getSafeLocal('pos_ilp_schedule', { days: [1,2,3,4,5,6], startTime: '07:00', endTime: '13:00', isOpen: true, serviceDate: '' }));

            const cacheReady = !!(role && user?.uid && cacheHydratedAccount === `${role}:${user.uid}`);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_cadres', cadres); }, [cacheReady, role, user, cadres]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_participants', participants); }, [cacheReady, role, user, participants]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_attendances', attendancesRaw); }, [cacheReady, role, user, attendancesRaw]);
            // Absen mandiri publik hanya menyimpan ID kartu; nama & siklus dilengkapi di sisi petugas.
            const attendances = useMemo(() => (attendancesRaw || []).map(a => {
                if (a.name && a.ilpCategory) return a;
                const p = a.type === 'cadre' ? (cadres || []).find(x => x.id === a.personId) : (participants || []).find(x => x.id === a.personId);
                return p ? { ...a, name: a.name || p.name, ilpCategory: a.ilpCategory || p.ilpCategory, posyandu: a.posyandu || p.posyandu } : a;
            }), [attendancesRaw, cadres, participants]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_health', healthRecords); }, [cacheReady, role, user, healthRecords]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_complaints', complaints); }, [cacheReady, role, user, complaints]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_anc', ancRecords); }, [cacheReady, role, user, ancRecords]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_immunizations', immunizations); }, [cacheReady, role, user, immunizations]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_home_visits', homeVisits); }, [cacheReady, role, user, homeVisits]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_referrals', referrals); }, [cacheReady, role, user, referrals]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_logistics', logistics); }, [cacheReady, role, user, logistics]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_education', educationRecords); }, [cacheReady, role, user, educationRecords]);
            useEffect(() => { if (cacheReady) setAccountLocal(role, user.uid, 'pos_ilp_cadre_tasks', cadreTasks); }, [cacheReady, role, user, cadreTasks]);
            useEffect(() => { setLocal('pos_ilp_schedule', schedule); }, [schedule]);

            const [notification, setNotification] = useState(null);
            const [quickAction, setQuickAction] = useState(null); 
            const [showAbsen, setShowAbsen] = useState(false);

            useEffect(() => {
                if (darkMode) { document.documentElement.classList.add('dark'); } 
                else { document.documentElement.classList.remove('dark'); }
                setLocal('pos_ilp_dark', darkMode);
                try { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', darkMode ? '#0b1820' : '#f3f7f8'); } catch (e) {}
            }, [darkMode]);

            useEffect(() => { setLocal('pos_ilp_font', fontSizeScale); }, [fontSizeScale]);

            useEffect(() => {
                let cancelled = false;
                const waitForFirebaseModule = () => new Promise(resolve => {
                    const started = Date.now();
                    const tick = () => {
                        if (window.FirebaseMod) return resolve(window.FirebaseMod);
                        if (Date.now() - started > 20000) return resolve(null);
                        setTimeout(tick, 200);
                    };
                    tick();
                });
                const initFirebase = async () => {
                    const fb = await waitForFirebaseModule();
                    if (cancelled) return;
                    if (!fb) { setSyncError('modul Firebase tidak termuat (cek koneksi internet)'); setLocalMode(true); return; }
                    try {
                        const app = fb.initializeApp(USER_FIREBASE_CONFIG);
                        const auth = fb.getAuth(app);
                        const db = fb.getFirestore(app);
                        setFirebaseDb(db);
                        window.__fbAuth = auth;
                        fb.onAuthStateChanged(auth, (u) => {
                            if (cancelled) return;
                            const sid = u ? staffIdFromEmail(u.email) : null;
                            if (u && !sid) { fb.signOut(auth).catch(() => {}); return; } // sesi anonim lama / bukan akun petugas
                            if (sid) {
                                migrateLegacyCacheForAccount(sid, u.uid);
                                setCacheHydratedAccount(null);
                                setCadres(getAccountLocal(sid, u.uid, 'pos_ilp_cadres', []));
                                setParticipants(getAccountLocal(sid, u.uid, 'pos_ilp_participants', []));
                                setAttendances(getAccountLocal(sid, u.uid, 'pos_ilp_attendances', []));
                                setHealthRecords(getAccountLocal(sid, u.uid, 'pos_ilp_health', []));
                                setComplaints(getAccountLocal(sid, u.uid, 'pos_ilp_complaints', []));
                                setAncRecords(getAccountLocal(sid, u.uid, 'pos_ilp_anc', []));
                                setImmunizations(getAccountLocal(sid, u.uid, 'pos_ilp_immunizations', []));
                                setHomeVisits(getAccountLocal(sid, u.uid, 'pos_ilp_home_visits', []));
                                setReferrals(getAccountLocal(sid, u.uid, 'pos_ilp_referrals', []));
                                setLogistics(getAccountLocal(sid, u.uid, 'pos_ilp_logistics', []));
                                setEducationRecords(getAccountLocal(sid, u.uid, 'pos_ilp_education', []));
                                setCadreTasks(getAccountLocal(sid, u.uid, 'pos_ilp_cadre_tasks', []));
                                const accountOutbox = loadAccountOutbox(sid, u.uid);
                                outboxRef.current = accountOutbox;
                                setOutboxState(accountOutbox);
                                setCacheHydratedAccount(`${sid}:${u.uid}`);
                                setUser(u); setRole(sid);
                            }
                            else {
                                setCacheHydratedAccount(null);
                                outboxRef.current = []; setOutboxState([]);
                                setUser(null); setRole(null); clearLocalData();
                                setCadres([]); setParticipants([]); setAttendances([]); setHealthRecords([]); setComplaints([]);
                                setAncRecords([]); setImmunizations([]); setHomeVisits([]); setReferrals([]); setLogistics([]); setEducationRecords([]); setCadreTasks([]);
                            }
                            setAuthReady(true);
                        });
                    } catch (e) {
                        console.error('Firebase init gagal:', e);
                        setSyncError(e && e.code ? e.code : String(e));
                        setLocalMode(true);
                    }
                };
                initFirebase();
                return () => { cancelled = true; };
            }, []);

useEffect(() => {
                // Jadwal pelayanan boleh dibaca publik (status buka/tutup di halaman depan).
                if (localMode || !firebaseDb) return;
                const fb = window.FirebaseMod;
                const ref = fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', 'schedule');
                const unsub = fb.onSnapshot(ref, d => {
                    if (d.exists()) { setSchedule(d.data()); }
                    else if (role === 'admin') { const lv = getSafeLocal('pos_ilp_schedule', null); if (lv) fb.setDoc(ref, { ...lv, timestamp: fb.serverTimestamp() }).catch(() => {}); }
                }, (e) => console.error('Jadwal gagal dimuat:', e));
                return () => unsub();
            }, [localMode, firebaseDb, role]);

            useEffect(() => {
                if (localMode || !firebaseDb || !user || !role) return;
                const fb = window.FirebaseMod;
                const unsubs = [];
                const handleError = (e) => {
                    console.error('Firestore error:', e);
                    setSyncError(e && e.code ? e.code : String(e));
                    setLocalMode(true);
                };
                // Petugas posyandu hanya mengambil data posyandunya sendiri (dipaksa juga oleh firestore.rules).
                const scoped = (colName) => {
                    const ref = fb.collection(firebaseDb, 'artifacts', appId, 'public', 'data', colName);
                    return role === 'admin' ? ref : fb.query(ref, fb.where('posyandu', '==', role));
                };
                const collections = ['cadres', 'participants', 'attendances', 'health', 'complaints', 'anc', 'immunizations', 'home_visits', 'referrals', 'logistics', 'education', 'cadre_tasks'];
                const setters = [setCadres, setParticipants, setAttendances, setHealthRecords, setComplaints, setAncRecords, setImmunizations, setHomeVisits, setReferrals, setLogistics, setEducationRecords, setCadreTasks];
                try {
                    collections.forEach((colName, index) => {
                        unsubs.push(fb.onSnapshot(scoped(colName), snap => {
                            setters[index](snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        }, handleError));
                    });
                } catch (e) { handleError(e); }
                return () => { unsubs.forEach(u => u()); };
            }, [user, role, localMode, firebaseDb]);

            const syncData = async (colName, id, data, isDelete = false) => {
                const supported = ['cadres','participants','attendances','health','complaints','anc','immunizations','home_visits','referrals','logistics','education','cadre_tasks','settings'];
                if (!supported.includes(colName)) { showNotification('Jenis data tidak dikenali.','error'); return false; }
                const existingRows = ({ cadres, participants, attendances: attendancesRaw, health: healthRecords, complaints, anc: ancRecords, immunizations, home_visits: homeVisits, referrals, logistics, education: educationRecords, cadre_tasks: cadreTasks })[colName] || [];
                const previous = existingRows.find(x => x.id === id);
                const source = data || {};
                const payload = { id, ...source, timestamp: new Date().toISOString() };
                const posyanduOf = source.posyandu || previous?.posyandu || (colName === 'settings' ? 'admin' : null);
                const updater = (setFunc) => setFunc(prev => {
                    const safePrev = Array.isArray(prev) ? prev : [];
                    return isDelete ? safePrev.filter(i => i.id !== id) : [...safePrev.filter(i => i.id !== id), payload];
                });
                if (colName === 'cadres') updater(setCadres);
                if (colName === 'participants') updater(setParticipants);
                if (colName === 'attendances') updater(setAttendances);
                if (colName === 'health') updater(setHealthRecords);
                if (colName === 'complaints') updater(setComplaints);
                if (colName === 'anc') updater(setAncRecords);
                if (colName === 'immunizations') updater(setImmunizations);
                if (colName === 'home_visits') updater(setHomeVisits);
                if (colName === 'referrals') updater(setReferrals);
                if (colName === 'logistics') updater(setLogistics);
                if (colName === 'education') updater(setEducationRecords);
                if (colName === 'cadre_tasks') updater(setCadreTasks);
                if (colName === 'settings' && id === 'schedule') setSchedule(data);

                if (!firebaseDb || !user || !role) {
                    showNotification('Sesi petugas atau koneksi server belum siap. Perubahan belum dikirim.','error');
                    return false;
                }
                const queueForSync = () => {
                    const ownerRole = role;
                    const queueItem = {
                        key: `${colName}:${id}:${ownerRole}:${user.uid}`,
                        colName, id, data: isDelete ? null : source,
                        isDelete: !!isDelete, ownerRole, ownerUid: user.uid, posyandu: posyanduOf,
                        queuedAt: new Date().toISOString(), revision: `${Date.now()}-${Math.random().toString(36).slice(2,9)}`
                    };
                    updateOutbox(prev => [...prev.filter(x => x.key !== queueItem.key), queueItem]);
                    return true;
                };
                // Jika dokumen ini sudah menunggu sinkronisasi, pertahankan urutan dengan mengganti antrean lokalnya.
                const sameDocQueued = outboxRef.current.some(x => x.colName === colName && x.id === id && x.ownerRole === role && x.ownerUid === user.uid);
                if (sameDocQueued || !navigator.onLine || localMode) return queueForSync();
                try {
                    const fb = window.FirebaseMod;
                    const path = colName === 'settings'
                        ? fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', id)
                        : fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', colName, id);
                    if (isDelete) await fb.deleteDoc(path);
                    else await fb.setDoc(path, { ...source, timestamp: fb.serverTimestamp() });
                    return true;
                } catch (e) {
                    console.error('Gagal simpan ke cloud:', e);
                    setSyncError(e && e.code ? e.code : String(e));
                    const networkFailure = !navigator.onLine || ['unavailable','deadline-exceeded','network-request-failed','cancelled','aborted'].includes(e?.code);
                    if (networkFailure) return queueForSync();
                    showNotification('Gagal menyimpan ke cloud. Periksa hak akses dan koneksi.','error');
                    return false;
                }
            };

            const flushOutbox = async () => {
                if (outboxLock.current || !navigator.onLine || !firebaseDb || !user || !role) return;
                outboxLock.current = true;
                try {
                    const allowed = ['cadres','participants','attendances','health','complaints','anc','immunizations','home_visits','referrals','logistics','education','cadre_tasks','settings'];
                    let attempts = 0;
                    while (attempts++ < 500) {
                        // Baca antrean terkini, termasuk perubahan yang masuk saat sinkronisasi berjalan.
                        const item = outboxRef.current.find(x => x && x.ownerRole === role && x.ownerUid === user.uid);
                        if (!item) break;
                        if (!allowed.includes(item.colName)) {
                            updateOutbox(prev => prev.filter(x => x.revision !== item.revision));
                            continue;
                        }
                        try {
                            const fb = window.FirebaseMod;
                            const path = item.colName === 'settings'
                                ? fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'settings', item.id)
                                : fb.doc(firebaseDb, 'artifacts', appId, 'public', 'data', item.colName, item.id);
                            if (item.isDelete) await fb.deleteDoc(path);
                            else await fb.setDoc(path, { ...(item.data || {}), timestamp: fb.serverTimestamp() });
                            updateOutbox(prev => prev.filter(x => x.revision !== item.revision));
                        } catch (e) {
                            setSyncError(e && e.code ? e.code : String(e));
                            // Hentikan antrean pada kegagalan pertama agar urutan perubahan tetap terjaga.
                            break;
                        }
                    }
                } finally {
                    outboxLock.current = false;
                }
            };

            useEffect(() => {
                if (user && role && firebaseDb && outbox.length) flushOutbox();
            }, [user, role, firebaseDb, outbox]);
            useEffect(() => {
                const onOnline = () => { if (firebaseDb) setLocalMode(false); flushOutbox(); };
                const onVisible = () => { if (document.visibilityState === 'visible') flushOutbox(); };
                window.addEventListener('online', onOnline);
                document.addEventListener('visibilitychange', onVisible);
                return () => { window.removeEventListener('online', onOnline); document.removeEventListener('visibilitychange', onVisible); };
            }, [firebaseDb, user, role]);

                if (localMode || !firebaseDb || !window.__fbAuth) return showNotification('Belum terhubung ke server. Periksa internet lalu muat ulang halaman.', 'error');

                try {
                    await window.FirebaseMod.signInWithEmailAndPassword(window.__fbAuth, staffEmail(r), p);
                    setActiveTab('dashboard'); setSiklus('all');
                } catch (err) {
                    const c = err && err.code;
                    showNotification(c === 'auth/too-many-requests' ? 'Terlalu banyak percobaan. Tunggu beberapa menit.' : c === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' : 'Posyandu atau kata sandi salah.', 'error');

            const handleLogout = async () => {

        function LifeRing() {
            const R = 118, C = 2 * Math.PI * R, GAP = 5, SEG = (360 - GAP * 5) / 5, segLen = C * SEG / 360;
            return (
                <div className="life-ring" role="img" aria-label="Lima siklus hidup: ibu hamil dan menyusui, bayi dan balita, anak dan remaja, usia dewasa, lansia">
                    <div className="ring-spin">
                    <svg viewBox="0 0 320 320" className="life-ring-svg" aria-hidden="true">
                        {ILP_CATEGORIES.map((c, i) => (
                            <circle key={c.id} className={`ring-arc sk-${c.id}`} cx="160" cy="160" r={R} fill="none" strokeWidth="18"
                                strokeDasharray={`${segLen} ${C - segLen}`}
                                transform={`rotate(${-90 + GAP / 2 + i * (SEG + GAP)} 160 160)`}
                                style={{ stroke: 'var(--sc)', '--len': segLen, '--i': i }} />
                        ))}
                        <circle className="ring-runner" cx="160" cy="160" r={R} fill="none" strokeWidth="5" strokeLinecap="round" strokeDasharray={`10 ${C - 10}`} style={{ '--C': C }} />
                    </svg>
                    {ILP_CATEGORIES.map((c, i) => {
                        const a = (-90 + GAP / 2 + i * (SEG + GAP) + SEG / 2) * Math.PI / 180;
                        const x = 50 + (R / 320 * 100) * Math.cos(a), y = 50 + (R / 320 * 100) * Math.sin(a);
                        return <span key={c.id} className={`ring-badge sk-${c.id}`} style={{ left: x + '%', top: y + '%', '--i': i }}><i className={`fa-solid ${c.icon}`}></i></span>;
                    })}
                    </div>
                    <span className="ring-pulse"></span><span className="ring-pulse d2"></span>
                    <img className="ring-logo" src={window.POS_LOGO} alt="" />
                </div>
            );
        }

        /* ===== Agen AI: mesin penalaran lokal atas data nyata aplikasi ===== */
        const AI_KB = [
            { k:['stunting','pendek','tinggi badan anak'], t:'Stunting', a:'Stunting adalah gagal tumbuh akibat kurang gizi kronis dan infeksi berulang, terutama pada 1.000 hari pertama kehidupan. Pencegahan: ASI eksklusif 6 bulan, MPASI kaya protein hewani (telur, ikan, hati ayam) mulai usia 6 bulan, timbang dan ukur panjang/tinggi badan setiap bulan, imunisasi lengkap, air bersih dan sanitasi, serta TTD dan ANC pada ibu hamil. Bila tinggi menurut umur di bawah -2 SD, rujuk ke Puskesmas.' },
            { k:['ttd','tablet tambah darah'], t:'TTD', a:'Ibu hamil perlu minimal 90 tablet tambah darah selama kehamilan, 1 tablet per hari. Minum malam hari atau bersama jeruk/vitamin C, jangan dengan teh, kopi, atau susu. Tinja kehitaman dan mual ringan itu wajar; bila mengganggu, minum setelah makan.' },
            { k:['anc','kunjungan hamil','periksa hamil','tanda bahaya hamil','usg'], t:'ANC', a:'Pemeriksaan kehamilan (ANC) minimal 6 kali: 1 kali di trimester 1 (dengan USG dokter), 2 kali di trimester 2, dan 3 kali di trimester 3 (dengan USG dokter). Tanda bahaya yang harus segera ke fasilitas kesehatan: perdarahan, kejang, bengkak wajah/tangan, sakit kepala hebat, pandangan kabur, gerak janin berkurang, ketuban pecah dini, demam tinggi.' },
            { k:['imunisasi','vaksin'], t:'Imunisasi', a:'Imunisasi dasar lengkap untuk bayi meliputi HB-0, BCG, polio, DPT-HB-Hib, IPV, dan campak-rubela (MR) usia 9 bulan, dilanjutkan imunisasi lanjutan sekitar usia 18 bulan. Cek jadwal tepatnya di buku KIA dan kejar imunisasi yang terlewat ke posyandu atau Puskesmas.' },
            { k:['mpasi','mp-asi','makanan pendamping'], t:'MPASI', a:'MPASI dimulai tepat usia 6 bulan dengan tekstur bertahap. Pastikan ada karbohidrat, protein hewani, protein nabati, lemak, serta sayur dan buah. Hindari gula dan garam berlebih, dan jangan beri madu sebelum usia 1 tahun.' },
            { k:['asi','menyusui','imd'], t:'ASI', a:'Mulai dengan Inisiasi Menyusu Dini, ASI eksklusif sampai 6 bulan tanpa makanan atau minuman lain, lalu lanjutkan ASI hingga 2 tahun bersama MPASI. Ibu menyusui perlu tambahan makan dan cairan, dan tetap lanjut TTD sesuai anjuran.' },
            { k:['hipertensi','darah tinggi','tensi','tekanan darah'], t:'Hipertensi', a:'Hipertensi bila tekanan darah 140/90 mmHg atau lebih pada pengukuran berulang. Anjuran: batasi garam (sekitar 1 sendok teh per hari), olahraga 150 menit per minggu, jauhi rokok, jaga berat badan, kontrol rutin dan minum obat teratur bila diresepkan. Tekanan 180/110 atau lebih, atau disertai nyeri dada, sesak, lemah satu sisi tubuh: segera ke IGD.' },
            { k:['diabetes','kencing manis','gula darah'], t:'Diabetes', a:'Gula darah sewaktu 200 mg/dL atau lebih dengan gejala (sering haus, sering kencing, berat badan turun) mengarah ke diabetes; gula puasa 126 atau lebih juga demikian. Skrining posyandu belum cukup untuk diagnosis, jadi rujuk ke Puskesmas untuk pemeriksaan konfirmasi. Kurangi minuman manis dan karbohidrat berlebih, perbanyak aktivitas fisik.' },
            { k:['kolesterol'], t:'Kolesterol', a:'Kolesterol total 200 mg/dL atau lebih termasuk batas tinggi. Kurangi gorengan, santan, jeroan, dan lemak jenuh; tambah serat (sayur, buah, kacang-kacangan) dan olahraga rutin 30 menit per hari.' },
            { k:['asam urat'], t:'Asam urat', a:'Asam urat tinggi bila di atas sekitar 7 mg/dL pada pria atau 6 mg/dL pada wanita. Batasi jeroan, emping, sebagian seafood, dan alkohol; minum air putih sekitar 2 liter per hari; jaga berat badan. Nyeri sendi berat dan bengkak perlu diperiksa dokter.' },
            { k:['anemia','hb','hemoglobin','rematri','kurang darah'], t:'Anemia', a:'Anemia bila Hb di bawah 11 g/dL pada ibu hamil, di bawah 12 pada remaja putri dan wanita, di bawah 13 pada pria. Remaja putri dianjurkan minum 1 tablet tambah darah per minggu. Perbanyak hati ayam, daging merah, ikan, sayur hijau, dengan sumber vitamin C.' },
            { k:['kek','kurang energi kronis','lila'], t:'KEK', a:'Ibu hamil atau wanita usia subur dengan LILA di bawah 23,5 cm berisiko KEK. Beri makan lebih sering dalam porsi kecil yang padat gizi (protein hewani, kacang-kacangan), dapatkan PMT, dan pantau berat badan setiap bulan. Pada balita, LILA di bawah 11,5 cm berarti risiko gizi buruk.' },
            { k:['jatuh','lansia aktif','aks','pikun','demensia'], t:'Lansia', a:'Cegah jatuh pada lansia: lantai tidak licin, pencahayaan cukup, alas kaki sesuai, pegangan di kamar mandi, latihan keseimbangan, dan bangun perlahan dari posisi duduk. Skrining rutin tekanan darah, gula darah, kemandirian aktivitas harian, dan daya ingat.' },
            { k:['cerdik','gaya hidup sehat','ptm'], t:'CERDIK', a:'CERDIK: Cek kesehatan berkala, Enyahkan asap rokok, Rajin aktivitas fisik, Diet seimbang, Istirahat cukup, Kelola stres. Ini kunci mencegah penyakit tidak menular (hipertensi, diabetes, jantung, stroke).' },
            { k:['gizi seimbang','isi piringku','porsi makan','gula garam lemak'], t:'Isi Piringku', a:'Isi Piringku: setengah piring sayur dan buah, setengah piring makanan pokok dan lauk-pauk. Batas harian gula-garam-lemak: gula 4 sendok makan, garam 1 sendok teh, lemak 5 sendok makan.' }
        ];
        const AI_SIK = [
            ['ibu_hamil','Ibu hamil & menyusui',['hamil','bumil','menyusui','busui','ibu hamil']],
            ['balita','Bayi & balita',['balita','bayi','batita','kms']],
            ['remaja','Anak & remaja',['remaja','anak sekolah','rematri']],
            ['dewasa','Dewasa produktif',['dewasa','produktif']],
            ['lansia','Lansia',['lansia','manula','jompo']]
        ];
        const aiNum = (v) => parseFloat(String(v == null ? '' : v).replace(',', '.'));
        const aiFlags = (h) => {
            const f = [];
            if (h.tension) { const _bp = parseBP(h.tension) || { sys: NaN, dia: NaN }; const sy = _bp.sys, di = _bp.dia; if (sy >= 140 || di >= 90) f.push('Hipertensi'); }
            if (aiNum(h.bloodSugar) >= 200) f.push('Gula darah tinggi');
            if (aiNum(h.cholesterol) >= 200) f.push('Kolesterol tinggi');
            if (aiNum(h.uricAcid) >= 7) f.push('Asam urat tinggi');
            if (h.ilpCategory === 'balita' && aiNum(h.armCirc) < 11.5) f.push('Risiko gizi buruk');
            if (h.ilpCategory === 'balita' && aiNum(h.headCirc) < 32) f.push('Lingkar kepala kurang');
            if (h.ilpCategory === 'ibu_hamil' && aiNum(h.armCirc) < 23.5) f.push('Risiko KEK');
            if (h.weight && h.height && h.ilpCategory !== 'balita') { const m = aiNum(h.height) / 100; if (aiNum(h.weight) / (m * m) >= 30) f.push('Obesitas'); }
            return f;
        };

        function aiBrain(q, d, mem) {
            const t = ' ' + q.toLowerCase().replace(/[?!]/g, ' ') + ' ';
            const m = (w) => new RegExp('(^|[^a-z])' + w.replace(/[-.]/g, '\\$&')).test(t);
            const has = (...ws) => ws.some(m);
            const steps = [];
            const staff = !!d.role, admin = d.role === 'admin';
            const scopeP = (!staff || admin) ? null : d.role;
            const posName = (id) => d.posyanduList.find(p => p.id === id)?.name || id;
            const today = localDate();
            const parts = d.participants.filter(p => !scopeP || p.posyandu === scopeP);
            const cads = d.cadres.filter(c => !scopeP || c.posyandu === scopeP);
            const atts = d.attendances.filter(a => !scopeP || a.posyandu === scopeP);
            const attToday = atts.filter(a => a.date === today);
            const lastH = {};
            d.healthRecords.filter(h => !scopeP || h.posyandu === scopeP).forEach(h => { if (!lastH[h.participantId] || (h.date || '') > (lastH[h.participantId].date || '')) lastH[h.participantId] = h; });
            const label = scopeP ? posName(scopeP) : 'seluruh posyandu';
            const gOf = (a) => a.type === 'cadre' ? 'kader' : (a.ilpCategory || d.participants.find(p => p.id === a.personId)?.ilpCategory);
            const skObj = AI_SIK.find(s => s[2].some(m));
            let sk = skObj ? skObj[0] : null;
            const skName = (id) => id === 'kader' ? 'Kader' : (AI_SIK.find(s => s[0] === id)?.[1] || id);
            const pct = (a, b) => b ? Math.round(a * 100 / b) + '%' : '-';
            steps.push(`Cakupan data: ${label}${staff ? '' : ' (mode umum, hanya angka agregat)'}`);

            const num = (re) => { const r = t.match(re); return r ? aiNum(r[r.length - 1]) : NaN; };
            const tn = t.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
            const gl = num(/(gula|gds|gdp|glukosa)[^0-9]{0,18}(\d{2,3})/);
            const kl = num(/kolesterol[^0-9]{0,18}(\d{2,3})/);
            const au = num(/asam urat[^0-9]{0,18}(\d{1,2}(?:[.,]\d)?)/);
            const la = num(/(lila|lingkar lengan)[^0-9]{0,18}(\d{1,2}(?:[.,]\d)?)/);
            const hb = num(/(hb|hemoglobin)[^0-9]{0,18}(\d{1,2}(?:[.,]\d)?)/);
            const bb = num(/(bb|berat)[^0-9]{0,18}(\d{2,3}(?:[.,]\d)?)/);
            const tb = num(/(tb|tinggi)[^0-9]{0,18}(\d{2,3})/);
            const readings = [];
            if (tn) { const sy = +tn[1], di = +tn[2]; readings.push(sy >= 180 || di >= 110 ? `Tekanan darah ${sy}/${di}: **sangat tinggi (kategori berat)**. Jika disertai nyeri dada, sesak, sakit kepala hebat atau lemah satu sisi, segera ke IGD; bila tanpa gejala, rujuk ke Puskesmas hari ini.` : sy >= 140 || di >= 90 ? `Tekanan darah ${sy}/${di}: **di atas batas skrining (hipertensi)**. Ulangi ukur setelah istirahat 5 menit; bila tetap tinggi, rujuk ke Puskesmas. Kurangi garam dan pantau rutin.` : sy >= 120 || di >= 80 ? `Tekanan darah ${sy}/${di}: **batas atas normal / pra-hipertensi**. Jaga pola makan rendah garam, olahraga, dan cek berkala.` : sy < 90 || di < 60 ? `Tekanan darah ${sy}/${di}: **cenderung rendah**. Perbanyak cairan, bangun perlahan, dan periksa bila pusing atau pingsan.` : `Tekanan darah ${sy}/${di}: **normal**.`); }
            if (gl === gl) readings.push(gl >= 200 ? `Gula darah ${gl} mg/dL: **tinggi**, perlu pemeriksaan konfirmasi (gula puasa/HbA1c) di Puskesmas.` : gl >= 140 ? `Gula darah ${gl} mg/dL: **di atas normal (batas)**. Jika sewaktu, periksa gula puasa untuk memastikan.` : gl < 70 ? `Gula darah ${gl} mg/dL: **rendah**. Beri minuman manis segera, lalu rujuk bila tidak membaik.` : `Gula darah ${gl} mg/dL: **dalam batas normal**.`);
            if (kl === kl) readings.push(kl >= 240 ? `Kolesterol ${kl}: **tinggi**. Rujuk dan ubah pola makan.` : kl >= 200 ? `Kolesterol ${kl}: **batas tinggi**. Kurangi lemak jenuh dan gorengan.` : `Kolesterol ${kl}: **normal**.`);
            if (au === au) readings.push(au >= 7 ? `Asam urat ${au}: **tinggi**. Batasi jeroan dan alkohol, banyak minum air putih.` : `Asam urat ${au}: **dalam batas normal**.`);
            if (la === la) readings.push(has('balita', 'bayi', 'anak') ? (la < 11.5 ? `LILA ${la} cm pada balita: **risiko gizi buruk**. Beri PMT tinggi protein dan rujuk ke Puskesmas.` : `LILA ${la} cm pada balita: **normal**.`) : (la < 23.5 ? `LILA ${la} cm: **risiko KEK**. Tingkatkan makanan padat gizi dan beri PMT.` : `LILA ${la} cm: **normal**.`));
            if (hb === hb) readings.push(hb < 11 ? `Hb ${hb} g/dL: **anemia** (ambang ibu hamil 11, wanita/remaja putri 12). Beri TTD, perbanyak hati ayam dan sayur hijau, rujuk bila Hb di bawah 8.` : hb < 12 ? `Hb ${hb} g/dL: **anemia pada remaja putri/wanita**, normal untuk pria bila di atas 13 tidak terpenuhi. Beri TTD dan makanan kaya zat besi.` : `Hb ${hb} g/dL: **dalam batas normal**.`);
            if (bb === bb && tb === tb) { const mm = tb / 100, bmi = bb / (mm * mm); readings.push(`IMT ${bmi.toFixed(1)}: **${bmi >= 30 ? 'obesitas' : bmi >= 25 ? 'berat badan lebih' : bmi < 18.5 ? 'kurus' : 'normal'}** (untuk dewasa; balita memakai kurva pertumbuhan).`); }
            if (readings.length) {
                steps.push(`Mengenali ${readings.length} angka pada pertanyaan, lalu membandingkan dengan ambang skrining yang dipakai aplikasi`);
                return { intent: 'angka', sk, steps, text: readings.join('\n') + '\n\nIni skrining awal, bukan diagnosis. Hasil di luar batas normal perlu dikonfirmasi tenaga kesehatan.', chips: ['Peringatan dini hari ini', 'Cara menurunkan tensi', 'Ringkasan kehadiran'] };
            }

            let intent = null;
            if (has('cara', 'bagaimana', 'gimana', 'langkah', 'tutorial', 'dimana', 'di mana', 'caranya') && has('absen', 'hadir', 'scan', 'tambah', 'daftar', 'cetak', 'kartu', 'export', 'excel', 'backup', 'cadangan', 'pengaduan', 'sandi', 'password', 'gelap', 'rekam medis', 'skrining', 'jadwal')) intent = 'howto';
            else if (has('halo', 'hai', 'hallo', 'selamat', 'bantu', 'bisa apa', 'fitur', 'menu', 'help')) intent = 'menu';
            else if (has('peringatan', 'risiko', 'bahaya', 'rujuk', 'kritis', 'berisiko', 'waspada', 'abnormal', 'prioritas')) intent = 'alert';
            else if (has('belum diskrining', 'cakupan', 'belum diperiksa', 'belum skrining', 'sudah diskrining', 'capaian')) intent = 'coverage';
            else if (has('kader') && has('hadir', 'absen', 'kehadiran', 'siapa')) intent = 'cadre';
            else if (has('hari ini', 'kehadiran', 'hadir', 'absen', 'rekap', 'ringkasan', 'laporan', 'kunjungan')) intent = 'attendance';
            else if (has('jadwal', 'buka', 'tutup', 'jam layanan', 'kapan')) intent = 'schedule';
            else if (staff && parts.some(p => p.name && p.name.length > 2 && t.includes(p.name.toLowerCase()))) intent = 'person';
            else if (has('berapa', 'jumlah', 'total', 'terdaftar', 'warga', 'peserta', 'data')) intent = 'count';
            const kb = AI_KB.find(e => e.k.some(m));

            if (intent === 'attendance') {
                const keys = sk ? [sk] : ['ibu_hamil', 'balita', 'remaja', 'dewasa', 'lansia', 'kader'];
                const rows = keys.map(k => { const h = attToday.filter(a => gOf(a) === k).length; const tot = k === 'kader' ? cads.length : parts.filter(p => p.ilpCategory === k).length; return { k, h, tot }; });

                const withTot = rows.filter(r => r.tot > 0);
                if (withTot.length > 1) { const low = [...withTot].sort((a, b) => a.h / a.tot - b.h / b.tot)[0]; out += `\n\n**Catatan:** kehadiran terendah ada pada ${skName(low.k)} (${pct(low.h, low.tot)}). Pertimbangkan pengingat khusus atau kunjungan rumah untuk kelompok ini.`; }
                if (!scopeP) { const per = d.posyanduList.filter(p => p.id !== 'admin').map(p => `${p.name.replace('Posyandu ', '')}: ${attToday.filter(a => a.posyandu === p.id).length}`); out += `\n\nPer posyandu: ${per.join(' · ')}.`; }
                const dates = [...new Set(atts.map(a => a.date))].filter(x => x < today).sort();
                if (dates.length) { const pd = dates[dates.length - 1]; const pc = atts.filter(a => a.date === pd).length; out += `\n\nPembanding: pelayanan terakhir (${pd}) tercatat ${pc} hadir, hari ini ${attToday.length >= pc ? 'sama atau lebih tinggi' : 'lebih rendah ' + (pc - attToday.length) + ' orang'}.`; }

            if (intent === 'cadre') {

                if (staff) { const ids = new Set(hadir.map(a => a.personId)); const belum = cads.filter(c => !ids.has(c.id)).map(c => c.name); if (belum.length) out += `\nBelum absen: ${belum.slice(0, 10).join(', ')}${belum.length > 10 ? ', dan lainnya' : ''}.`; }

            if (intent === 'alert') {

            if (intent === 'schedule') {

                return mk(`Layanan ${d.isOpen ? '**sedang dibuka**' : '**sedang tutup**'}.\n` + (sc.serviceDate ? `Tanggal pelayanan khusus: ${sc.serviceDate}\n` : `Hari buka: ${(sc.days || []).map(x => hari[x]).join(', ') || '-'}\n`) + `Jam: ${sc.startTime || '07:00'} sampai ${sc.endTime || '13:00'}. Absen hanya bisa dilakukan pada jam tersebut.`, ['Cara absen']);
            }

            if (intent === 'howto') {
                steps.push('Mencocokkan panduan fitur aplikasi');
                if (has('absen', 'hadir', 'scan')) return mk('**Absen:** dari halaman login ketuk "Absen sekarang", pilih posyandu, cari nama atau scan kartu QR, lalu ketuk Hadir. Petugas juga bisa memakai menu "Scan kehadiran". Absen hanya terbuka pada jam pelayanan.', ['Jadwal layanan']);
                if (has('tambah', 'daftar')) return mk('**Tambah warga:** masuk sebagai petugas, buka "Data warga", pilih Tambah, isi NIK dan data diri, tentukan siklus hidup, lalu Simpan.', ['Cara cetak kartu']);

            const [showSteps, setShowSteps] = useState({});
            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs, open]);

            const send = (raw) => {
                const q = (raw || '').trim(); if (!q || busy) return;
                setInput(''); setBusy(true);
                setMsgs(p => [...p, { id: Date.now(), sender: 'user', text: q, done: true }]);
                setTimeout(() => {
                    let r;
                    try { r = aiBrain(q, { participants: participants || [], cadres: cadres || [], attendances: attendances || [], healthRecords: healthRecords || [], schedule, isOpen: isOpen(), role, posyanduList }, mem.current); }
                    catch (e) { r = { text: 'Maaf, terjadi kendala saat membaca data. Coba ulangi pertanyaannya.', steps: [], chips: [], intent: null, sk: null }; }
                    mem.current = { intent: r.intent || mem.current.intent, sk: r.sk || mem.current.sk };
                    const id = Date.now() + 1; const words = r.text.split(/(\s+)/); let i = 0, cur = '';
                    setMsgs(p => [...p, { id, sender: 'ai', text: '', steps: r.steps, chips: [], done: false }]);
                    const iv = setInterval(() => {
                        const step = Math.min(words.length, i + 6); cur = words.slice(0, step).join(''); i = step;
                        setMsgs(p => p.map(x => x.id === id ? { ...x, text: cur } : x));
                        if (i >= words.length) { clearInterval(iv); setMsgs(p => p.map(x => x.id === id ? { ...x, text: r.text, chips: r.chips, done: true } : x)); setBusy(false); }
                    }, 25);
                }, 350);

        }

        function CycleRing({ items, total }) {
            const R = 78, C = 2 * Math.PI * R, GAP = 4;
            let acc = 0;
            return (
                <svg viewBox="0 0 200 200" className="w-full h-full" role="img" aria-label="Komposisi warga menurut siklus hidup">
                    <circle cx="100" cy="100" r={R} fill="none" strokeWidth="20" style={{ stroke: 'var(--surface-2)' }} />
                    {total > 0 && items.filter(s => s.total > 0).map(s => {
                        const share = s.total / total;
                        const len = Math.max(share * C - GAP, 1);
                        const start = acc; acc += share * C;
                        return <circle key={s.id} className={`sk-${s.id}`} cx="100" cy="100" r={R} fill="none" strokeWidth="20"
                            strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-start} transform="rotate(-90 100 100)"
                            style={{ stroke: 'var(--sc)' }} />;
                    })}
                </svg>
            );
        }

                : [['attendance','fa-qrcode','Scan kehadiran','Catat warga yang datang'],['health','fa-notes-medical','Catat skrining','Timbang, ukur, dan periksa'],['pos-master','fa-user-plus','Tambah warga','Daftarkan warga baru'],['ilp-home','fa-house-medical','Kunjungan rumah','Jangkau keluarga di luar hari buka']];

                                <div className="flex gap-2 pt-2"><button type="submit" className="flex-1 bg-indigo-600 text-white font-black py-3.5 rounded-xl hover:bg-indigo-700 shadow-md">{editId ? 'Perbarui Data' : 'Simpan Data'}</button></div>
                            </form>
                        </div>
                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 shadow-sm overflow-hidden flex flex-col"><div className="overflow-x-auto flex-1 custom-scrollbar pb-2"><table className="w-full text-left whitespace-nowrap"><thead><tr className="bg-slate-50 dark:bg-slate-800/80 border-b dark:border-slate-700"><th className="p-4 text-xs font-black uppercase text-slate-500">ID & Nama</th><th className="p-4 text-xs font-black uppercase text-slate-500">Klaster / Posyandu</th><th className="p-4 text-center text-xs font-black uppercase text-slate-500">Aksi</th></tr></thead><tbody>

                const head = 'nama;nik;tanggal_lahir;jenis_kelamin;alamat;rt;rw;nama_ortu_wali;no_hp;kategori;posyandu';
                const ex = ['Siti Aminah;3209000000000001;15/03/1990;P;Dsn. Cikulak;01;02;;081234567890;;Mawar 1', 'Budi Santoso;3209000000000002;20/07/2023;L;Dsn. Cikulak;01;02;Siti Aminah;;;Mawar 1'];

                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Template_Impor_Warga_ILP.csv'; a.click();

            const onFile = async (e) => {

                        objs = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
                    } else {
                        const t = parseCSV(await f.text()); const head = t[0] || [];
                        objs = t.slice(1).map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i] == null ? '' : r[i]; }); return o; });
                    }
                    if (!objs.length) throw new Error('kosong');
                    if (objs.length > 2000) throw new Error('terlalu banyak');
                    const ctx = { isAdmin, role, nikSet: new Set((participants || []).map(p => (p.nik || '').replace(/\D/g, '')).filter(Boolean)) };
                    setRows(objs.map((o, i) => ({ n: i + 2, ...mapImportRow(o, ctx) })));
                } catch (e2) {
                    setErr(e2.message === 'terlalu banyak' ? 'Maksimal 2000 baris per berkas.' : e2.message === 'xlsx' ? 'Pustaka Excel gagal dimuat (cek internet). Simpan berkas sebagai CSV lalu coba lagi.' : 'Berkas kosong atau tidak bisa dibaca. Pakai template yang disediakan.');

                setBusy(false); e.target.value = '';

            const good = (rows || []).filter(r => !r.errors.length); const bad = (rows || []).filter(r => r.errors.length);
            const doImport = async () => {
                setBusy(true); setProgress(0);
                const taken = new Set((participants || []).map(p => p.id));
                const items = good.map(r => ({ id: genPersonId(taken), data: r.data }));

                    for (let i = 0; i < items.length; i += 15) {
                        await Promise.all(items.slice(i, i + 15).map(it => syncData('participants', it.id, it.data)));
                        setProgress(Math.min(i + 15, items.length));

                    showNotification(`${items.length} warga berhasil diimpor.`); onClose();

                setBusy(false);

            return (

                                <button onClick={downloadTemplate} className="bg-slate-200 dark:bg-slate-800 font-black px-4 py-3 rounded-2xl"><i className="fa-solid fa-download mr-2"></i>Unduh template</button>

                            </div>
                            {!isAdmin && <p className="text-xs font-bold text-slate-500">Semua baris akan masuk ke {posyanduList.find(p => p.id === role)?.name}.</p>}

                            {busy && !rows && <p className="font-bold text-indigo-600">Membaca berkas...</p>}
                            {err && <p className="font-bold text-rose-600">{err}</p>}
                            {rows && (
                                <div className="space-y-3">
                                    <p className="font-black">{fileName}: <span className="text-emerald-600">{good.length} siap diimpor</span>{bad.length > 0 && <span className="text-rose-600">, {bad.length} dilewati</span>}</p>

                                </div>

                        <div className="p-4 flex gap-3 bg-white dark:bg-slate-900 border-t dark:border-slate-800">
                            <button onClick={onClose} className="flex-1 bg-slate-200 dark:bg-slate-800 font-black py-3 rounded-2xl">Batal</button>

                        </div>
                    </div>
                </div>

                const person = isCadre ? (cadres||[]).find(c=>c.id===cleanId&&c.posyandu===role) : (participants||[]).find(p=>p.id===cleanId&&p.posyandu===role);
                if (!person) return showNotification(`ID ${cleanId} tidak terdaftar di Posyandu ini.`, "error");
                if (!isCadre && !isActivePerson(person)) return showNotification(`${person.name} berstatus ${STATUS_LABEL[person.status] || person.status}, tidak bisa absen.`, "error");

        /* Modul Kamera (Telah Dipulihkan 100%) */
        function CameraScanner({ onScan, isPosyanduOpen }) {
            const onScanRef = useRef(onScan);
            const [camError, setCamError] = useState(false);
            
            useEffect(() => { onScanRef.current = onScan; }, [onScan]);

            const startCam = () => {
                setCamError(false);
                if (isPosyanduOpen && window.Html5Qrcode) {
                    const scanner = new window.Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (t) => { onScanRef.current(t); }, () => {}).catch((e)=>{ setCamError(true); });
                    return scanner;
                }
                return null;
            };

            useEffect(() => {
                let scannerInst = startCam();
                return () => { if (scannerInst) { scannerInst.stop().then(() => scannerInst.clear()).catch(()=>{}); } };
            }, [isPosyanduOpen]);

            if (!isPosyanduOpen) return <div className="p-10 bg-slate-100 dark:bg-slate-800 text-slate-400 text-center rounded-2xl font-bold border-4 border-dashed border-slate-200 flex flex-col items-center h-64 justify-center"><i className="fa-solid fa-camera-slash text-5xl mb-4 opacity-50"></i>Kamera nonaktif karena posyandu tutup.</div>;

                    </div>
                    <p className="mt-4 text-xs font-extrabold text-slate-500">Arahkan Kartu Barcode ke Kamera Anda</p>
                </div>
            );
        }

                                        </>

                                    <div className="md:col-span-2 mt-4"><button type="submit" className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-indigo-700 transition-all text-base">Simpan Skrining ILP</button></div>
                                </form>
                            </div>) : (<div className="h-full flex flex-col items-center justify-center text-slate-400 py-24"><i className="fa-solid fa-notes-medical text-6xl mb-4 opacity-30"></i><p className="font-bold text-base">Silakan pilih warga ILP dari daftar antrean.</p></div>)}
                        </div>
                    </div>
                    {showChart && sel && <HealthHistoryModal participant={sel} healthRecords={healthRecords} onClose={()=>setShowChart(false)} ilpCategories={ilpCategories} />}
                </div>
            );
        }

        function IntegratedServices({ section, role, isAdmin, participants, posyanduList, ancRecords, immunizations, homeVisits, referrals, logistics, educationRecords, syncData, showNotification }) {
            const sectionConfig = {
                'ilp-anc': { key:'anc', title:'Ibu hamil, nifas & menyusui', eyebrow:'Klaster ibu dan anak', icon:'fa-person-pregnant', desc:'Catat pemantauan ibu hamil, nifas, menyusui, konseling, faktor risiko, dan rencana tindak lanjut.' },
                'ilp-immun': { key:'immunizations', title:'Imunisasi & suplementasi', eyebrow:'Perlindungan sepanjang siklus hidup', icon:'fa-syringe', desc:'Kelola riwayat imunisasi, vitamin A, obat cacing, TTD, dan jadwal kunjungan berikutnya berdasarkan Buku KIA serta arahan Puskesmas.' },
                'ilp-home': { key:'home_visits', title:'Kunjungan rumah', eyebrow:'Jangkauan layanan di luar hari buka', icon:'fa-house-medical', desc:'Rencanakan kunjungan keluarga, catat kebutuhan yang ditemukan, dan pantau keluarga yang belum terjangkau.' },
                'ilp-referral': { key:'referrals', title:'Rujukan & tindak lanjut', eyebrow:'Kesinambungan pelayanan', icon:'fa-truck-medical', desc:'Catat alasan rujukan, fasilitas tujuan, status pendampingan, dan hasil tindak lanjut.' },
                'ilp-stock': { key:'logistics', title:'Logistik & PMT', eyebrow:'Kesiapan layanan', icon:'fa-boxes-stacked', desc:'Pantau stok PMT, TTD, vitamin, bahan habis pakai, alat ukur, nomor batch, dan masa kedaluwarsa.' },
                'ilp-education': { key:'education', title:'Edukasi & penyuluhan', eyebrow:'Pemberdayaan masyarakat', icon:'fa-book-open-reader', desc:'Dokumentasikan topik edukasi, sasaran, metode, jumlah peserta, fasilitator, dan hasil kegiatan.' }
            };
            const cfg = sectionConfig[section] || sectionConfig['ilp-anc'];
            const [query, setQuery] = useState('');
            const [filter, setFilter] = useState('all');
            const [editingId, setEditingId] = useState(null);
            const initialPos = isAdmin ? 'mawar1' : role;
            const [form, setForm] = useState({ posyandu:initialPos, date:localDate(), status:'tercatat', target:'', participantId:'', name:'', type:'', detail:'', notes:'', nextDate:'', urgency:'normal', quantity:'', minimum:'', unit:'pak', item:'', category:'', expiry:'', batch:'', method:'tatap muka', participantsCount:'', facilitator:'' });
            const allRecords = { anc:ancRecords||[], immunizations:immunizations||[], home_visits:homeVisits||[], referrals:referrals||[], logistics:logistics||[], education:educationRecords||[] };
            const records = allRecords[cfg.key] || [];
            const today = localDate();
            const cycleOptions = [{id:'ibu_hamil',name:'Ibu hamil'},{id:'balita',name:'Bayi & balita'},{id:'remaja',name:'Anak & remaja'},{id:'dewasa',name:'Dewasa'},{id:'lansia',name:'Lansia'}];
            const participantLabel = (p) => `${p.name}${p.ilpCategory ? ' · ' + (ILP_CATEGORIES.find(c=>c.id===p.ilpCategory)?.name || p.ilpCategory) : ''}`;
            const update = (k,v) => setForm(prev => ({...prev,[k]:v}));
            const selectedPerson = (participants||[]).find(p => p.id === form.participantId);
            const filteredRecords = records.filter(r => {
                const q = query.trim().toLowerCase();
                const matches = !q || [r.name,r.item,r.type,r.detail,r.topic,r.reason,r.destination,r.notes,r.facility].filter(Boolean).join(' ').toLowerCase().includes(q);
                const matchesStatus = filter === 'all' || r.status === filter;
                const matchesPos = !isAdmin || !form.posFilter || r.posyandu === form.posFilter;
                return matches && matchesStatus && matchesPos;
            }).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
            const resetForm = () => { setEditingId(null); setForm({ posyandu:initialPos, date:today, status:'tercatat', target:'', participantId:'', name:'', type:'', detail:'', notes:'', nextDate:'', urgency:'normal', quantity:'', minimum:'', unit:'pak', item:'', category:'', expiry:'', batch:'', method:'tatap muka', participantsCount:'', facilitator:'' }); };
            const editRecord = (r) => { setEditingId(r.id); setForm({...form,...r, quantity:r.quantity == null ? '' : String(r.quantity), minimum:r.minimum == null ? '' : String(r.minimum), participantsCount:r.participantsCount == null ? '' : String(r.participantsCount)}); window.scrollTo({top:0,behavior:'smooth'}); };
            const removeRecord = async (r) => { if (!window.confirm('Hapus catatan ini? Tindakan tidak dapat dibatalkan.')) return; const removed=await syncData(cfg.key,r.id,{},true); if (removed===false) return; showNotification('Catatan dihapus.'); if (editingId===r.id) resetForm(); };
            const save = async (e) => {
                e.preventDefault();
                const targetPos = isAdmin ? form.posyandu : role;
                if (!targetPos || targetPos === 'admin') return showNotification('Pilih posyandu yang benar.','error');
                const base = { ...form, posyandu:targetPos, date:form.date || today, updatedAt:new Date().toISOString() };
                if (selectedPerson) { base.participantId=selectedPerson.id; base.name=selectedPerson.name; base.target=selectedPerson.ilpCategory || base.target; base.posyandu=selectedPerson.posyandu || targetPos; }
                if (cfg.key === 'logistics') {
                    if (!String(form.item||'').trim()) return showNotification('Nama barang wajib diisi.','error');
                    const qty = Number(form.quantity); const min = Number(form.minimum || 0);

                    base.item=String(form.item).trim(); base.quantity=qty; base.minimum=min; base.category=form.category || 'Bahan layanan';
                }
                if (cfg.key === 'education') {
                    if (!String(form.detail||'').trim()) return showNotification('Topik penyuluhan wajib diisi.','error');
                    base.topic=String(form.detail).trim(); base.participantsCount=Math.max(0,Number(form.participantsCount)||0);
                }
                const duplicateStock = cfg.key === 'logistics' && !editingId ? records.find(r=>r.posyandu===base.posyandu && String(r.item||'').trim().toLowerCase()===String(base.item||'').trim().toLowerCase()) : null;
                const id = editingId || (duplicateStock && duplicateStock.id) || `${cfg.key.toUpperCase()}-${Date.now()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
                const saved = await syncData(cfg.key,id,base,false);
                if (saved === false) return;
                showNotification((editingId || duplicateStock) ? 'Catatan berhasil diperbarui.' : 'Catatan berhasil disimpan.');
                resetForm();
            };
            const exportRecords = () => {
                const headers = ['Tanggal','Posyandu','Nama/Sasaran','Jenis/Topik','Status','Tindak lanjut','Catatan'];
                const rows = filteredRecords.map(r=>[r.date||'',posyanduList.find(p=>p.id===r.posyandu)?.name||r.posyandu||'',r.name||r.item||'',r.type||r.topic||r.category||'',r.status||'',r.nextDate||r.destination||'',r.notes||r.detail||'']);
                exportToExcel(`ILP_${cfg.key}`,rows,headers);

            const field = (label,key,opts={}) => (

                    : opts.textarea ? <textarea id={`f-${key}`} value={form[key]||''} onChange={e=>update(key,e.target.value)} placeholder={opts.placeholder||''} />
                    : <input id={`f-${key}`} type={opts.type||'text'} min={opts.min} max={opts.max} step={opts.step} value={form[key]??''} onChange={e=>update(key,e.target.value)} placeholder={opts.placeholder||''} required={!!opts.required} />}
                </div>
            );
            const posOptions = posyanduList.filter(p=>p.id!=='admin').map(p=>({value:p.id,label:p.name}));
            const personOptions = (participants||[]).map(p=>({value:p.id,label:participantLabel(p)}));
            const renderForm = () => {
                const common = <>{field('Tanggal layanan','date',{type:'date',required:true})}{isAdmin && field('Posyandu','posyandu',{select:true,options:posOptions,required:true})}</>;
                const person = field('Warga / sasaran','participantId',{select:true,options:personOptions,required:['anc','immunizations','referrals'].includes(cfg.key)});
                if (cfg.key==='anc') return <>{common}{person}{field('Jenis layanan','type',{select:true,required:true,options:[{value:'ANC',label:'Pemeriksaan kehamilan (ANC)'},{value:'Nifas',label:'Pemantauan ibu nifas'},{value:'Menyusui',label:'Konseling menyusui'},{value:'Gizi ibu',label:'Konseling gizi ibu'},{value:'Skrining risiko',label:'Skrining faktor risiko'}]})}{field('Usia kehamilan (minggu)','gestationalAge',{type:'number',min:'0',max:'45',step:'1'})}{field('Perkiraan persalinan (HPL)','edd',{type:'date'})}{field('Catatan kunjungan','detail',{placeholder:'Contoh: ANC ke-2'})}{field('Tekanan darah (mmHg)','tension',{placeholder:'Contoh: 120/80'})}{field('LILA (cm)','lila',{type:'number',min:'0',step:'0.1'})}{field('Konsumsi TTD','ttd',{select:true,options:[{value:'Belum dinilai',label:'Belum dinilai'},{value:'Rutin',label:'Rutin'},{value:'Tidak rutin',label:'Tidak rutin'}]})}{field('Faktor risiko / temuan','notes',{textarea:true,full:true})}{field('Rencana tindak lanjut','nextDate',{type:'date'})}</>;
                if (cfg.key==='immunizations') return <>{common}{person}{field('Jenis tindakan','type',{select:true,required:true,options:['HB-0','BCG','Polio','DPT-HB-Hib','IPV','PCV','Rotavirus','MR','Imunisasi lanjutan','Vitamin A','Obat cacing','TTD','Lainnya'].map(x=>({value:x,label:x}))})}{field('Dosis / tahap','detail',{placeholder:'Contoh: dosis 1 / sesuai Buku KIA'})}{field('Nomor batch','batch')}{field('Tanggal berikutnya','nextDate',{type:'date'})}{field('Catatan','notes',{textarea:true,full:true})}</>;
                if (cfg.key==='home_visits') return <>{common}{person}{field('Sasaran siklus hidup','target',{select:true,options:cycleOptions.map(x=>({value:x.id,label:x.name}))})}{field('Alasan kunjungan','type',{select:true,required:true,options:[{value:'Rutin keluarga',label:'Kunjungan rutin keluarga'},{value:'Belum terlayani',label:'Belum mendapat layanan (missing service)'},{value:'Ketidakpatuhan',label:'Tindak lanjut ketidakpatuhan'},{value:'Risiko / tanda bahaya',label:'Faktor risiko / tanda bahaya'},{value:'Pemantauan rujukan',label:'Pemantauan pascarujukan'},{value:'Lainnya',label:'Lainnya'}]})}{field('Hasil temuan','detail',{textarea:true,full:true})}{field('Tindakan / edukasi','notes',{textarea:true,full:true})}{field('Jadwal kunjungan ulang','nextDate',{type:'date'})}{field('Status','status',{select:true,options:[{value:'terjadwal',label:'Terjadwal'},{value:'selesai',label:'Selesai'},{value:'perlu_tindak_lanjut',label:'Perlu tindak lanjut'}]})}</>;
                if (cfg.key==='referrals') return <>{common}{person}{field('Urgensi','urgency',{select:true,required:true,options:[{value:'segera',label:'Segera'},{value:'terencana',label:'Terencana'},{value:'normal',label:'Normal'}]})}{field('Alasan rujukan / keluhan','detail',{textarea:true,full:true,placeholder:'Catat temuan secara faktual, bukan menetapkan diagnosis.'})}{field('Fasilitas tujuan','destination',{placeholder:'Puskesmas / Rumah Sakit'})}{field('Tanggal tindak lanjut','nextDate',{type:'date'})}{field('Status','status',{select:true,options:[{value:'perlu_dikirim',label:'Perlu dirujuk'},{value:'dirujuk',label:'Sudah dirujuk'},{value:'dipantau',label:'Dalam pemantauan'},{value:'selesai',label:'Selesai'}]})}{field('Hasil / catatan','notes',{textarea:true,full:true})}</>;
                if (cfg.key==='logistics') return <>{common}{field('Nama barang','item',{required:true,placeholder:'Contoh: Tablet tambah darah'})}{field('Kategori','category',{select:true,options:[{value:'PMT',label:'PMT'},{value:'TTD',label:'Tablet tambah darah'},{value:'Vitamin',label:'Vitamin / suplementasi'},{value:'BHP',label:'Bahan habis pakai'},{value:'Alat kesehatan',label:'Alat kesehatan'},{value:'Lainnya',label:'Lainnya'}]})}{field('Stok tersedia','quantity',{type:'number',min:'0',step:'1',required:true})}{field('Batas minimum','minimum',{type:'number',min:'0',step:'1'})}{field('Satuan','unit',{placeholder:'tablet / botol / paket'})}{field('Nomor batch','batch')}{field('Kedaluwarsa','expiry',{type:'date'})}{field('Catatan','notes',{textarea:true,full:true})}</>;

            return (

                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-folder-open"></i></span><div><div className="mn">{records.length}</div><div className="ml">Total catatan</div></div></div>
                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-calendar-check"></i></span><div><div className="mn">{records.filter(r=>r.date===today).length}</div><div className="ml">Dicatat hari ini</div></div></div>
                        <div className="module-metric"><span className="mi"><i className="fa-solid fa-clock"></i></span><div><div className="mn">{records.filter(r=>r.status==='perlu_tindak_lanjut'||r.status==='perlu_dikirim'||r.status==='terjadwal').length}</div><div className="ml">Butuh perhatian</div></div></div>

                                </article>)}
                                {filteredRecords.length===0 && <div className="module-empty"><i className="fa-regular fa-folder-open text-3xl mb-2"></i><p>Belum ada catatan yang cocok.</p><p className="text-xs mt-1">Tambahkan catatan melalui formulir di samping.</p></div>}
                            </div>
                        </section>

        function MonthlyReportWorkspace({ role, isAdmin, participants, attendances, healthRecords, ancRecords, immunizations, homeVisits, referrals, logistics, educationRecords, posyanduList }) {
            const [month, setMonth] = useState(localDate().slice(0, 7));

            const monthLabel = (() => {

            })();
            const inMonth = r => String(r?.date || '').slice(0, 7) === month;
            const scoped = arr => (arr || []).filter(r => selectedPos === 'all' || r.posyandu === selectedPos);
            const activePeople = scoped(participants).filter(isActivePerson);
            const monthAttendances = scoped(attendances).filter(inMonth);
            const participantAttendances = monthAttendances.filter(x => x.type === 'participant' && x.personId);
            const cadreAttendances = monthAttendances.filter(x => x.type === 'cadre' && x.personId);
            const uniquePresent = new Set(participantAttendances.map(x => x.personId));
            const uniqueCadres = new Set(cadreAttendances.map(x => x.personId));
            const monthHealth = scoped(healthRecords).filter(inMonth);
            const monthAnc = scoped(ancRecords).filter(inMonth);
            const monthImmun = scoped(immunizations).filter(inMonth);
            const monthVisits = scoped(homeVisits).filter(inMonth);
            const monthReferrals = scoped(referrals).filter(inMonth);
            const monthEducation = scoped(educationRecords).filter(inMonth);
            const currentReferrals = scoped(referrals).filter(x => !['selesai', 'ditutup'].includes(x.status));
            const overdueVisits = scoped(homeVisits).filter(x => x.status !== 'selesai' && x.nextDate && x.nextDate < today);
            const currentStock = scoped(logistics);
            const lowStock = currentStock.filter(x => Number(x.quantity || 0) <= Number(x.minimum || 0));
            const expiredStock = currentStock.filter(x => x.expiry && x.expiry < today);
            const personById = new Map(activePeople.map(x => [x.id, x]));
            const cycleRows = ILP_CATEGORIES.map(c => {
                const targets = activePeople.filter(p => p.ilpCategory === c.id);
                const attended = new Set(participantAttendances.filter(a => (a.ilpCategory || personById.get(a.personId)?.ilpCategory) === c.id).map(a => a.personId));
                const screened = monthHealth.filter(h => (h.ilpCategory || personById.get(h.participantId)?.ilpCategory) === c.id).length;
                return { ...c, total: targets.length, attended: attended.size, screened, ratio: targets.length ? Math.round(attended.size / targets.length * 100) : 0 };
            });
            const selectedPosName = selectedPos === 'all' ? 'Semua Posyandu' : (posyanduList.find(x => x.id === selectedPos)?.name || selectedPos);
            const serviceRows = [

                ['Skrining kesehatan', monthHealth.length, 'Catatan skrining pada bulan terpilih'],

                ['Imunisasi / suplementasi', monthImmun.length, 'Catatan layanan pada bulan terpilih'],
                ['Kunjungan rumah', monthVisits.length, 'Catatan kunjungan yang dibuat pada bulan terpilih'],
                ['Rujukan dibuat', monthReferrals.length, 'Catatan rujukan yang dibuat pada bulan terpilih'],
                ['Edukasi / penyuluhan', monthEducation.length, 'Kegiatan edukasi yang dicatat'],
                ['Peserta edukasi', monthEducation.reduce((sum, x) => sum + Number(x.participantsCount || 0), 0), 'Akumulasi peserta dari catatan edukasi']
            ];
            const exportReport = () => {
                const rows = [
                    ['Periode', monthLabel, '', ''],
                    ['Wilayah', selectedPosName, '', ''],
                    ['Sasaran terdaftar aktif saat ini', activePeople.length, '', 'Bukan rekonstruksi jumlah sasaran historis'],
                    ...serviceRows.map(x => ['Layanan', x[0], x[1], x[2]]),
                    ...cycleRows.map(x => ['Siklus hidup', x.name, x.total, `Hadir unik: ${x.attended}; skrining: ${x.screened}; proporsi hadir: ${x.ratio}%`]),
                    ['Perhatian saat ini', 'Rujukan belum selesai', currentReferrals.length, 'Status terkini'],
                    ['Perhatian saat ini', 'Kunjungan rumah lewat jadwal', overdueVisits.length, 'Status terkini'],
                    ['Perhatian saat ini', 'Stok di bawah / sama dengan minimum', lowStock.length, 'Snapshot stok saat ini'],
                    ['Perhatian saat ini', 'Barang kedaluwarsa', expiredStock.length, 'Snapshot stok saat ini']
                ];
                exportToExcel(`Rekap_Bulanan_ILP_${month}`, rows, ['Bagian', 'Indikator', 'Nilai', 'Keterangan']);
            };
            return (
                <div className="module-shell monthly-report">
                    <header className="module-hero">
                        <div className="relative z-10">
                            <div className="module-eyebrow">Laporan operasional terintegrasi</div>
                            <h2>Rekap Bulanan Posyandu ILP</h2>
                            <p>Ringkasan agregat kehadiran, skrining, layanan siklus hidup, tindak lanjut, dan logistik dari catatan aplikasi.</p>
                            <div className="flex flex-wrap gap-2 mt-4"><span className="module-tag">{monthLabel}</span><span className="module-tag">{selectedPosName}</span></div>
                        </div>
                    </header>
                    <div className="module-toolbar no-print">
                        <div className="flex flex-wrap items-center gap-2">
                            <label className="text-sm font-bold" htmlFor="monthly-report-month">Bulan laporan</label>
                            <input id="monthly-report-month" type="month" className="field" style={{ maxWidth: 190 }} value={month} max={today.slice(0, 7)} onChange={e => setMonth(e.target.value || today.slice(0, 7))} />
                            {isAdmin && <select className="field" style={{ minWidth: 190 }} value={selectedPos} onChange={e => setSelectedPos(e.target.value)} aria-label="Filter Posyandu"><option value="all">Semua Posyandu</option>{posyanduList.filter(x => x.id !== 'admin').map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select>}
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button className="btn-ghost" onClick={exportReport}><i className="fa-solid fa-file-csv"></i> Ekspor CSV</button>
                            <button className="btn-primary" onClick={() => window.print()}><i className="fa-solid fa-print"></i> Cetak / Simpan PDF</button>
                        </div>
                    </div>
                    <div className="module-grid">

                            ['Sasaran aktif saat ini', activePeople.length, 'fa-users'],

                            ['Skrining kesehatan', monthHealth.length, 'fa-stethoscope'],
                            ['Layanan ibu', monthAnc.length, 'fa-person-pregnant'],
                            ['Imunisasi / suplementasi', monthImmun.length, 'fa-syringe'],
                            ['Kunjungan rumah', monthVisits.length, 'fa-house-medical'],
                            ['Rujukan dibuat', monthReferrals.length, 'fa-truck-medical'],
                            ['Kegiatan edukasi', monthEducation.length, 'fa-book-open-reader']
                        ].map(([label, value, icon]) => <div className="module-metric" key={label}><span className="mi"><i className={`fa-solid ${icon}`}></i></span><div><div className="mn">{value}</div><div className="ml">{label}</div></div></div>)}
                    </div>
                    <section className="module-card">
                        <div className="module-card-head"><div><h3>Rincian sasaran menurut siklus hidup</h3><p className="text-xs muted mt-1">Jumlah sasaran aktif adalah kondisi saat ini; kehadiran dan skrining dihitung untuk bulan terpilih.</p></div><span className="module-tag">{monthLabel}</span></div>
                        <div className="module-table-wrap"><table className="module-table"><thead><tr><th>Kelompok sasaran</th><th>Jumlah aktif</th><th>Hadir unik</th><th>Skrining</th><th>Proporsi hadir*</th></tr></thead><tbody>
                            {cycleRows.map(x => <tr key={x.id}><td>{x.name}</td><td>{x.total}</td><td>{x.attended}</td><td>{x.screened}</td><td>{x.ratio}%</td></tr>)}
                            <tr><th>Total</th><th>{activePeople.length}</th><th>{uniquePresent.size}</th><th>{monthHealth.length}</th><th>{activePeople.length ? Math.round(uniquePresent.size / activePeople.length * 100) : 0}%</th></tr>
                        </tbody></table></div>
                        <p className="text-xs muted mt-2">* Proporsi hadir dihitung dari sasaran hadir unik dibagi sasaran aktif saat ini. Bukan indikator cakupan resmi untuk periode historis.</p>
                    </section>
                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                        <section className="module-card"><div className="module-card-head"><div><h3>Rekap kegiatan pada {monthLabel}</h3><p className="text-xs muted mt-1">Akumulasi catatan sesuai tanggal kegiatan.</p></div></div><div className="module-table-wrap"><table className="module-table"><thead><tr><th>Indikator</th><th>Jumlah</th></tr></thead><tbody>{serviceRows.map(([label, value]) => <tr key={label}><td>{label}</td><td><b>{value}</b></td></tr>)}</tbody></table></div></section>
                        <section className="module-card"><div className="module-card-head"><div><h3>Perlu perhatian saat ini</h3><p className="text-xs muted mt-1">Daftar ini merupakan pengingat administratif, bukan penentuan prioritas klinis.</p></div><span className="module-tag warn">{currentReferrals.length + overdueVisits.length + lowStock.length + expiredStock.length} item</span></div>
                            <div className="space-y-3">
                                <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-truck-medical mr-2 text-rose-500"></i>Rujukan belum selesai</span><b>{currentReferrals.length}</b></div>
                                <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-calendar-xmark mr-2 text-amber-500"></i>Kunjungan rumah lewat jadwal</span><b>{overdueVisits.length}</b></div>
                                <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-box-open mr-2 text-orange-500"></i>Stok di bawah / sama dengan minimum</span><b>{lowStock.length}</b></div>
                                <div className="flex justify-between gap-3 p-3 rounded-xl bg-[var(--surface-2)]"><span><i className="fa-solid fa-calendar-xmark mr-2 text-rose-500"></i>Barang kedaluwarsa</span><b>{expiredStock.length}</b></div>
                            </div>
                        </section>
                    </div>
                    <section className="module-card">
                        <div className="module-card-head"><div><h3>Pengesahan laporan</h3><p className="text-xs muted mt-1">Isi manual setelah data diperiksa dan dicocokkan dengan register.</p></div></div>

                        </div>
                    </section>
                    <p className="module-note">Catatan: laporan ini adalah rekap internal berdasarkan data yang tersedia di aplikasi. Data sasaran aktif merupakan kondisi saat ini, sedangkan kegiatan dihitung dari tanggal catatan. Rekap ini bukan laporan resmi e-PPGBM, ASIK, SATUSEHAT, atau format Puskesmas. Cocokkan dengan register, Buku KIA, dan SOP Puskesmas sebelum diserahkan atau dipakai untuk keputusan program. Laporan cetak tidak menampilkan daftar nama warga.</p>

        function PWSWorkspace({ role, isAdmin, participants, attendances, healthRecords, ancRecords, immunizations, homeVisits, referrals, logistics, educationRecords, posyanduList }) {
            const [period,setPeriod] = useState('month');
            const [selectedPos,setSelectedPos] = useState(isAdmin ? 'all' : role);
            const now = new Date(); const today = localDate();
            const start = period==='week' ? new Date(now.getFullYear(),now.getMonth(),now.getDate()-6) : period==='year' ? new Date(now.getFullYear(),0,1) : new Date(now.getFullYear(),now.getMonth(),1);
            const startKey = localDate(start);
            const inRange = r => String(r.date||'') >= startKey && String(r.date||'') <= today;
            const scoped = arr => (arr||[]).filter(r=>selectedPos==='all'||r.posyandu===selectedPos);
            const p = scoped(participants).filter(isActivePerson);
            const a = scoped(attendances).filter(inRange);
            const h = scoped(healthRecords).filter(inRange);
            const anc = scoped(ancRecords).filter(inRange);
            const imm = scoped(immunizations).filter(inRange);
            const visits = scoped(homeVisits).filter(inRange);
            const refs = scoped(referrals);
            const stock = scoped(logistics);
            const edu = scoped(educationRecords).filter(inRange);
            const presentIds = new Set(a.filter(x=>x.type==='participant').map(x=>x.personId));
            const uniquePresent = presentIds.size;
            const notReached = p.filter(x=>!presentIds.has(x.id)).length;
            const lowStock = stock.filter(x=>Number(x.quantity||0)<=Number(x.minimum||0));
            const expiredStock = stock.filter(x=>x.expiry && x.expiry < today);
            const pendingRefs = refs.filter(x=>!['selesai','ditutup'].includes(x.status));
            const overdueVisits = scoped(homeVisits).filter(x=>x.status!=='selesai' && x.nextDate && x.nextDate < today);
            const metrics = [
                ['Warga aktif',p.length,'fa-users'],['Hadir dalam periode',uniquePresent,'fa-user-check'],['Belum hadir',notReached,'fa-user-clock'],['Skrining tercatat',h.length,'fa-stethoscope'],['Layanan ibu',anc.length,'fa-person-pregnant'],['Imunisasi / suplementasi',imm.length,'fa-syringe'],['Kunjungan rumah',visits.length,'fa-house-medical'],['Rujukan terbuka',pendingRefs.length,'fa-truck-medical'],['Kegiatan edukasi',edu.length,'fa-book-open-reader']
            ];
            const cycleData = ILP_CATEGORIES.map(c=>({ ...c,total:p.filter(x=>x.ilpCategory===c.id).length }));
            const posOptions = posyanduList.filter(x=>x.id!=='admin');
            const activity = [...a.map(x=>({...x,_type:'Kehadiran',_name:x.name||x.personId})),...h.map(x=>({...x,_type:'Skrining',_name:x.name||x.participantName})),...anc.map(x=>({...x,_type:'Layanan ibu',_name:x.name})),...imm.map(x=>({...x,_type:'Imunisasi',_name:x.name})),...visits.map(x=>({...x,_type:'Kunjungan rumah',_name:x.name})),...refs.filter(inRange).map(x=>({...x,_type:'Rujukan',_name:x.name||x.detail})),...edu.map(x=>({...x,_type:'Edukasi',_name:x.topic}))].sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).slice(0,10);
            const exportPWS = () => exportToExcel('PWS_ILP',[...activity.map(x=>[x.date||'',x._type,x._name||'',x.posyandu||'',x.status||''])],['Tanggal','Jenis kegiatan','Sasaran / topik','Posyandu','Status']);
            return (
                <div className="module-shell">
                    <header className="module-hero"><div className="relative z-10"><div className="module-eyebrow">Pemantauan wilayah setempat</div><h2>Dashboard PWS ILP</h2><p>Ringkasan jangkauan warga, pelayanan siklus hidup, kunjungan keluarga, tindak lanjut rujukan, dan kesiapan logistik.</p><div className="flex flex-wrap gap-2 mt-4"><span className="module-tag">{startKey} s.d. {today}</span><span className="module-tag">{selectedPos==='all'?'Semua posyandu':posyanduList.find(x=>x.id===selectedPos)?.name}</span></div></div></header>
