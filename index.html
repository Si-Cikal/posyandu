        function exportToExcel(filename, rows, headers) {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += headers.join(",") + "\r\n";
            rows.forEach(row => { csvContent += row.map(e => `"${(e || '').toString().replace(/"/g, '""')}"`).join(",") + "\r\n"; });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a"); link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${filename}_${new Date().toISOString().split('T')[0]}.xls`);
            document.body.appendChild(link); link.click(); link.remove();
        }

        const getAnalysis = (form, cat) => {
            let diag = [], rec = [];
            const isBalita = cat === 'balita';

            if (form.weight && form.height) {
                const h = parseFloat(form.height)/100;
                const bmi = parseFloat(form.weight) / (h*h);
                if (!isBalita) {
                    if (bmi >= 30) { diag.push("Obesitas"); rec.push("Diet rendah kalori & lemak, olahraga teratur."); }
                    else if (bmi >= 25) { diag.push("Overweight"); rec.push("Jaga pola makan, kurangi konsumsi gula berlebih."); }
                    else if (bmi < 18.5) { diag.push("Underweight"); rec.push("Tingkatkan asupan gizi sehat dan protein."); }
                }
            }
            
            if (isBalita) {
                if (form.headCirc && parseFloat(form.headCirc) < 32) { diag.push("Lingkar Kepala Kurang"); rec.push("Pantau perkembangan saraf & otak secara intensif."); }
                if (form.armCirc && parseFloat(form.armCirc) < 11.5) { diag.push("Risiko Gizi Buruk (LILA < 11.5cm)"); rec.push("Segera berikan PMT (Pemberian Makanan Tambahan) tinggi protein."); }
                if (diag.length===0 && form.weight) { diag.push("Pertumbuhan Balita Normal"); rec.push("Lanjutkan ASI/MPASI bergizi seimbang."); }
            } else {
                if (form.tension) {
                    const sys = parseInt(form.tension.split('/')[0]);
                    if (sys >= 140) { diag.push("Hipertensi (Darah Tinggi)"); rec.push("Kurangi asupan garam/natrium, rutin cek tekanan darah, kurangi stres."); }
                    else if (sys <= 90) { diag.push("Hipotensi (Darah Rendah)"); rec.push("Istirahat cukup, perbanyak asupan cairan dan makanan bergizi."); }
                }
                if (form.bloodSugar && parseFloat(form.bloodSugar) >= 200) { diag.push("Gula Darah Tinggi"); rec.push("Kurangi karbohidrat, hindari minuman manis, segera rujuk ke faskes."); }
                if (form.cholesterol && parseFloat(form.cholesterol) >= 200) { diag.push("Hiperkolesterolemia"); rec.push("Hindari makanan bersantan, gorengan, dan lemak jenuh."); }
                if (form.uricAcid && parseFloat(form.uricAcid) >= 7.0) { diag.push("Asam Urat Tinggi"); rec.push("Kurangi asupan jeroan, kacang-kacangan, dan perbanyak minum air putih."); }
                if (form.armCirc && parseFloat(form.armCirc) < 23.5 && cat === 'ibu_hamil') { diag.push("Risiko KEK Kehamilan"); rec.push("Tingkatkan asupan makanan padat kalori & protein hewani."); }
                if (form.bellyCirc && parseFloat(form.bellyCirc) > 90) { diag.push("Risiko Sindrom Metabolik"); rec.push("Olahraga kardio rutin 30 menit sehari & pantau diet."); }
                
                if (diag.length===0 && (form.weight||form.tension)) { diag.push("Indikator Normal"); rec.push("Pertahankan gaya hidup sehat (CERDIK) dan olahraga teratur."); }
            }
            return { diagnosis: diag.length ? diag.join(", ") : "Menunggu Data", recommendation: rec.length ? rec.join(" ") : "-" };
        };

            )

        function TrendChart({ title, data, color }) {
            if (!data || data.length < 2) return null;
            const width = 280; const height = 110; const padX = 25; const padY = 30;
            const vals = data.map(d => d.value);
            const max = Math.max(...vals); const min = Math.min(...vals);
            const range = max - min || 1;

            const pts = data.map((d, i) => {
                const x = padX + (i * ((width - 2 * padX) / (data.length - 1)));
                const y = height - padY - (((d.value - min) / range) * (height - 2 * padY));
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm flex-1 min-w-[260px]">
                    <h5 className="text-xs font-black text-slate-500 dark:text-slate-400 mb-2">{title}</h5>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-24 overflow-visible">
                        <line x1={padX} y1={padY} x2={width-padX} y2={padY} stroke="#cbd5e1" strokeDasharray="4" className="dark:opacity-30" />
                        <line x1={padX} y1={height-padY} x2={width-padX} y2={height-padY} stroke="#cbd5e1" strokeDasharray="4" className="dark:opacity-30" />
                        <polyline points={pts} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                        {data.map((d, i) => {
                            const x = padX + (i * ((width - 2 * padX) / (data.length - 1)));
                            const y = height - padY - (((d.value - min) / range) * (height - 2 * padY));
                            return (
                                <g key={i}>
                                    <circle cx={x} cy={y} r="4" fill="white" stroke={color} strokeWidth="2" />
                                    <text x={x} y={y - 8} fontSize="10" fill="currentColor" className="text-slate-700 dark:text-slate-200 font-black" textAnchor="middle">{d.value}</text>
                                    <text x={x} y={height} fontSize="9" fill="currentColor" className="text-slate-400 font-bold" textAnchor="middle">{d.label}</text>
                                </g>
                            )
                        })}
                    </svg>
                </div>
            );
        }

            const [isTyping, setIsTyping] = useState(false);
            const [isStreaming, setIsStreaming] = useState(false);
            const [aiMessages, setAiMessages] = useState([
                { id: 1, sender: 'ai', text: 'Halo! Saya Agen AI Pintar Posyandu ILP. Ada yang bisa saya bantu terkait analisis 5 Siklus Hidup?', isComplete: true }

            const nlpEngine = (q) => {
                const lower = q.toLowerCase();
                if (lower.includes('balita') || lower.includes('stunting')) {
                    const tot = (participants||[]).filter(p => p.ilpCategory === 'balita').length;
                    return `Analisis AI: Terdapat ${tot} balita terdaftar. Pastikan jadwal penimbangan KMS dan imunisasi dasar mereka tepat waktu untuk cegah stunting. Menu "Pencatatan Skrining" siap digunakan.`;
                } else if (lower.includes('lansia') || lower.includes('hipertensi')) {
                    const tot = (participants||[]).filter(p => p.ilpCategory === 'lansia').length;
                    return `Analisis AI: Ada ${tot} lansia terdaftar. Skrining PTM (Tekanan Darah & Gula Darah) sangat krusial di klaster ini. Pantau grafiknya di menu Rekam Medis!`;
                } else if (lower.includes('hamil')) {
                    const tot = (participants||[]).filter(p => p.ilpCategory === 'ibu_hamil').length;
                    return `Analisis AI: Terdapat ${tot} ibu hamil. Konsumsi Tablet Tambah Darah (TTD) dan pemeriksaan ANC terpadu sangat diutamakan.`;
                } else if (lower.includes('tambah') || lower.includes('daftar') || lower.includes('warga baru')) {
                    return 'Untuk menambah warga, silakan masuk ke menu "Master Data Warga ILP", pilih "Tambah Baru", isi NIK dan data diri, lalu klik Simpan.';
                } else if (lower.includes('absen') || lower.includes('hadir') || lower.includes('kamera') || lower.includes('scan')) {
                    return 'Menu "Scan Kehadiran ILP" digunakan untuk absensi. Anda bisa memakai kamera (Scan Barcode) atau mengetik ID secara manual.';
                } else if (lower.includes('cetak') || lower.includes('kartu') || lower.includes('barcode')) {
                    return 'Anda bisa mencetak kartu warga di menu "Master Data". Klik tombol "Cetak Kartu Warga" di bagian atas untuk mencetak kartu ber-barcode secara masal.';
                } else {
                    return 'Saya mencatat pertanyaan Anda. Pastikan seluruh warga rutin diskrining sesuai klaster 5 siklus hidup (Ibu Hamil, Balita, Remaja, Dewasa, Lansia) untuk mencapai desa sehat.';
                }
            };

            const handleAiSend = (e) => {
                e.preventDefault();
                if (!aiChatInput.trim() || isStreaming) return;
                const userQ = aiChatInput.trim();
                setAiChatInput('');
                
                setAiMessages(prev => [...prev, { id: Date.now(), sender: 'user', text: userQ, isComplete: true }]);
                setIsTyping(true);

                setTimeout(() => {
                    setIsTyping(false);
                    const reply = nlpEngine(userQ);
                    const newMsgId = Date.now() + 1;
                    
                    setAiMessages(prev => [...prev, { id: newMsgId, sender: 'ai', text: '', isComplete: false }]);
                    setIsStreaming(true);
                    
                    const words = reply.split(' ');
                    let currentText = '';
                    let i = 0;
                    
                    const streamInterval = setInterval(() => {
                        if (i < words.length) {
                            currentText += (i === 0 ? '' : ' ') + words[i];
                            setAiMessages(prev => prev.map(msg => msg.id === newMsgId ? { ...msg, text: currentText } : msg));
                            i++;
                            scrollToBottom();
                        } else {
                            clearInterval(streamInterval);
                            setAiMessages(prev => prev.map(msg => msg.id === newMsgId ? { ...msg, isComplete: true } : msg));
                            setIsStreaming(false);
                        }
                    }, 40);
                }, 600);
            };

            return (
                <div className="fixed bottom-28 md:bottom-24 right-4 md:right-8 z-[500] no-print flex flex-col items-end">
                    {isAiOpen && (
                        <div className="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl w-[320px] md:w-[360px] rounded-[2rem] shadow-[0_20px_50px_rgba(79,70,229,0.2)] border border-indigo-200 dark:border-slate-700 flex flex-col mb-4 overflow-hidden animate-fade-in origin-bottom-right">
                            <div className="bg-gradient-to-r from-indigo-600 to-rose-500 p-4 text-white flex justify-between items-center shadow-md relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                                <div className="flex items-center gap-3 relative z-10">
                                    <div className="bg-white/20 p-2.5 rounded-2xl border border-white/30 backdrop-blur-md shadow-inner"><i className="fa-solid fa-robot text-lg animate-bounce"></i></div>
                                    <div><h4 className="font-black text-sm tracking-wide">AI Assistant ILP</h4><p className="text-[10px] font-bold text-indigo-100 uppercase tracking-widest">Agen Cerdas Aktif</p></div>
                                </div>
                                <button onClick={()=>setIsAiOpen(false)} className="relative z-10 bg-white/20 hover:bg-white/40 w-8 h-8 rounded-full flex items-center justify-center transition-colors"><i className="fa-solid fa-xmark text-sm"></i></button>
                            </div>
                            <div className="p-4 bg-slate-50/50 dark:bg-slate-950/50 h-[300px] overflow-y-auto space-y-4 text-xs flex flex-col custom-scrollbar">
                                {aiMessages.map((m, idx) => (
                                    <div key={m.id || idx} className={`p-3.5 rounded-2xl max-w-[85%] font-bold leading-relaxed shadow-sm ${m.sender === 'user' ? 'bg-indigo-600 text-white self-end rounded-tr-sm' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 self-start rounded-tl-sm border border-slate-100 dark:border-slate-700'}`}>
                                        {m.text}
                                        {m.sender === 'ai' && !m.isComplete && (
                                            <span className="inline-block w-1.5 h-3 bg-indigo-400 ml-1 translate-y-0.5 animate-pulse"></span>
                                        )}
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-3.5 rounded-2xl rounded-tl-sm shadow-sm flex gap-1.5 w-fit self-start">
                                        <div className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: '0ms'}}></div>
                                        <div className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: '150ms'}}></div>
                                        <div className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: '300ms'}}></div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>
                            <form onSubmit={handleAiSend} className="p-3 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 flex gap-2 z-10 relative">
                                <input disabled={isStreaming} type="text" placeholder={isStreaming ? "AI sedang mengetik..." : "Tanya analisis data ILP..."} value={aiChatInput} onChange={e=>setAiChatInput(e.target.value)} className="flex-1 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-indigo-500 px-4 py-3 rounded-xl font-bold text-xs outline-none transition-all text-slate-800 dark:text-slate-100 shadow-inner disabled:opacity-60"/>
                                <button disabled={isStreaming || !aiChatInput.trim()} type="submit" className="bg-gradient-to-br from-indigo-500 to-rose-500 text-white w-12 rounded-xl font-black hover:scale-105 transition-transform shadow-md flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"><i className="fa-solid fa-paper-plane"></i></button>
                            </form>
                        </div>
                    )}
                    <button onClick={()=>setIsAiOpen(!isAiOpen)} className="bg-gradient-to-r from-indigo-600 to-rose-500 hover:from-indigo-700 hover:to-rose-600 text-white p-4 md:p-5 rounded-full shadow-[0_10px_25px_rgba(79,70,229,0.4)] flex items-center justify-center gap-3 hover:scale-110 transition-all border-2 border-white/50 dark:border-slate-700 group">
                        <i className={`fa-solid ${isAiOpen ? 'fa-xmark' : 'fa-robot'} text-2xl group-hover:rotate-12 transition-transform`}></i>
                        {!isAiOpen && <span className="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-[120px] transition-all duration-500 ease-in-out font-black text-sm">Tanya Agen AI</span>}
                    </button>
                </div>
            );
        }

        function NotificationToast({ notification }) { 
            return (<div className={`fixed top-6 right-6 z-[400] bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-2xl shadow-2xl border-l-8 p-4 flex items-center gap-3 animate-fade-in ${notification.type==='error'?'border-red-500 text-red-700 dark:text-red-300':'border-emerald-500 text-emerald-700 dark:text-emerald-300'}`}><i className={`fa-solid text-2xl ${notification.type==='error'?'fa-circle-exclamation':'fa-circle-check'}`}></i><p className="font-black">{notification.msg}</p></div>); 
        }

        function Dashboard({ isAdmin, role, attendances, cadres, participants, schedule, isPosyanduOpen, posyanduList, ilpCategories }) {
            const fCadres = isAdmin ? (cadres||[]) : (cadres||[]).filter(c => c.posyandu === role);
            const fParts = isAdmin ? (participants||[]) : (participants||[]).filter(p => p.posyandu === role);
            const today = new Date().toISOString().split('T')[0];
            const tAtt = (isAdmin ? (attendances||[]) : (attendances||[]).filter(a => a.posyandu === role)).filter(a => a.date === today);
            
            const cData = posyanduList.filter(p => p.id !== 'admin').map(pos => {
                const tot = (participants||[]).filter(pt => pt.posyandu === pos.id).length;
                const h = (attendances||[]).filter(a => a.posyandu === pos.id && a.date === today).length;
                return { name: pos.name.replace('Posyandu ', ''), Terdaftar: tot, Hadir: h };
            });

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm">
                        <div><h2 className="text-2xl font-black text-slate-800 dark:text-slate-100">Beranda Posyandu ILP (Integrasi Layanan Primer)</h2>
                            <p className="text-slate-500 dark:text-slate-400 font-bold mt-1 text-sm">Hari ini: {new Date().toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric'})}</p>
                        </div>
                        <div className={`px-5 py-3 rounded-2xl font-black flex items-center gap-3 border-2 ${isPosyanduOpen() ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 shadow-sm' : 'bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 border-red-200 dark:border-red-800'}`}>
                            <div className={`w-3 h-3 rounded-full ${isPosyanduOpen() ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></div> {isPosyanduOpen() ? 'STATUS: BUKA (MELAYANI)' : 'STATUS: TERTUTUP'}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 flex gap-4 items-center shadow-sm"><div className="w-14 h-14 flex items-center justify-center bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 rounded-2xl shadow-sm"><i className="fa-solid fa-user-group text-2xl"></i></div><div><p className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Kader Terdaftar</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100">{fCadres.length}</p></div></div>
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 flex gap-4 items-center shadow-sm"><div className="w-14 h-14 flex items-center justify-center bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 rounded-2xl shadow-sm"><i className="fa-solid fa-users-rectangle text-2xl"></i></div><div><p className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Total Warga ILP</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100">{fParts.length}</p></div></div>
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 flex gap-4 items-center shadow-sm"><div className="w-14 h-14 flex items-center justify-center bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 rounded-2xl shadow-sm"><i className="fa-solid fa-clipboard-check text-2xl"></i></div><div><p className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Kader Hadir (Hari Ini)</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100">{tAtt.filter(a=>a.type==='cadre').length}</p></div></div>
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 flex gap-4 items-center shadow-sm"><div className="w-14 h-14 flex items-center justify-center bg-purple-50 dark:bg-purple-950/60 text-purple-600 dark:text-purple-400 rounded-2xl shadow-sm"><i className="fa-solid fa-stethoscope text-2xl"></i></div><div><p className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Diperiksa (Hari Ini)</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100">{tAtt.filter(a=>a.type==='participant').length}</p></div></div>
                    </div>
                    {isAdmin && (
                        <div className="grid grid-cols-1 gap-6 mt-6">
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm"><h3 className="font-black text-lg mb-1 text-slate-800 dark:text-slate-100">Grafik Kehadiran Warga per Posyandu</h3>
                            <div className="flex items-center gap-4 mb-4 text-xs font-bold text-slate-500"><div className="flex items-center gap-1.5"><div className="w-3.5 h-3.5 bg-slate-300 dark:bg-slate-700 rounded"></div> Terdaftar</div><div className="flex items-center gap-1.5"><div className="w-3.5 h-3.5 bg-indigo-500 rounded"></div> Hadir Hari Ini</div></div>
                            <div className="h-56"><CustomBarChart data={cData} /></div></div>
                        </div>
                    )}
                </div>
            );
        }

        function MasterData({ cadres, participants, syncData, showNotification, posyanduList, role, isAdmin, healthRecords, attendances, ilpCategories }) {
            const [activeTab, setActiveTab] = useState(isAdmin ? 'cadres' : 'participants');
            const [form, setForm] = useState({ name: '', phone: '', nik: '', ilpCategory: 'balita', posyandu: isAdmin ? 'mawar1' : role });
            const [editId, setEditId] = useState(null); const [bulkPrint, setBulkPrint] = useState(null);
            const [chartItem, setChartItem] = useState(null); const [delConfirm, setDelConfirm] = useState(null);

            const handleSave = async (e) => {
                e.preventDefault();
                const pos = isAdmin ? form.posyandu : role;
                const id = editId || `${activeTab === 'cadres' ? 'KDR' : 'ILP'}-${Math.random().toString(36).substring(2,7).toUpperCase()}`;
                await syncData(activeTab, id, { ...form, posyandu: pos });
                if (editId && activeTab === 'participants') {
                    (attendances||[]).filter(a=>a.personId===editId).forEach(async (att)=>{ await syncData('attendances', att.id, { ...att, name: form.name, posyandu: pos }); });
                    (healthRecords||[]).filter(hr=>hr.participantId===editId).forEach(async (hr)=>{ await syncData('health', hr.id, { ...hr, participantName: form.name, posyandu: pos }); });
                }
                showNotification(editId ? "Data diperbarui!" : "Data baru tersimpan!");
                setForm({ name: '', phone: '', nik: '', ilpCategory: 'balita', posyandu: pos }); setEditId(null);
            };

            const executeDelete = async (id) => { await syncData(activeTab, id, null, true); showNotification("Data Berhasil Dihapus"); setDelConfirm(null); };
            const handleEdit = (item) => { setEditId(item.id); setForm({ name: item.name||'', phone: item.phone||'', nik: item.nik||'', ilpCategory: item.ilpCategory||'balita', posyandu: item.posyandu||(isAdmin?'mawar1':role) }); window.scrollTo({top:0, behavior:'smooth'}); };
            const list = activeTab === 'cadres' ? (isAdmin ? (cadres||[]) : (cadres||[]).filter(c=>c.posyandu===role)) : (isAdmin ? (participants||[]) : (participants||[]).filter(p=>p.posyandu===role));

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center flex-wrap gap-4"><h2 className="text-2xl font-black text-slate-800 dark:text-slate-100">Manajemen Warga ILP {isAdmin ? 'Global' : 'Posyandu'}</h2>
                        <div className="flex gap-2">
                            {isAdmin && activeTab==='cadres' && <button onClick={()=>setBulkPrint('cadres')} className="bg-blue-600 text-white font-bold py-2.5 px-5 rounded-2xl flex items-center gap-2 shadow-md"><i className="fa-solid fa-print"></i> Cetak Kartu Kader</button>}
                            {activeTab==='participants' && <button onClick={()=>setBulkPrint('participants')} className="bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-2xl flex items-center gap-2 shadow-md"><i className="fa-solid fa-print"></i> Cetak Kartu Warga</button>}
                        </div>
                    </div>
                    {isAdmin && (
                        <div className="flex gap-2 bg-white dark:bg-slate-900 p-2 rounded-2xl w-fit border dark:border-slate-800 shadow-sm">
                            <button className={`py-2.5 px-6 rounded-xl font-bold transition-all ${activeTab==='cadres'?'bg-indigo-600 text-white shadow-md':'bg-transparent text-slate-500'}`} onClick={()=>{setActiveTab('cadres');setEditId(null);}}>Data Kader</button>
                            <button className={`py-2.5 px-6 rounded-xl font-bold transition-all ${activeTab==='participants'?'bg-indigo-600 text-white shadow-md':'bg-transparent text-slate-500'}`} onClick={()=>{setActiveTab('participants');setEditId(null);}}>Data Warga ILP</button>
                        </div>
                    )}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm h-fit sticky top-6"><h3 className="font-black text-lg mb-4 text-indigo-600 dark:text-indigo-400 flex items-center gap-2"><i className={`fa-solid ${editId ? 'fa-pen-to-square' : 'fa-user-plus'}`}></i> {editId ? 'Edit Data' : 'Tambah Baru'}</h3>
                            <form onSubmit={handleSave} className="space-y-4">
                                <div><label className="block text-xs font-extrabold text-slate-600 dark:text-slate-400 mb-1.5 uppercase">Nama Lengkap</label><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-xl p-3.5 outline-none focus:border-indigo-500 font-bold bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100"/></div>
                                {activeTab==='cadres' && <div><label className="block text-xs font-extrabold text-slate-600 dark:text-slate-400 mb-1.5 uppercase">No. WhatsApp</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-xl p-3.5 font-mono bg-slate-50 dark:bg-slate-800 outline-none focus:border-indigo-500" placeholder="08..."/></div>}
                                {activeTab==='participants' && (
                                    <>
                                        <div><label className="block text-xs font-extrabold text-slate-600 dark:text-slate-400 mb-1.5 uppercase">NIK / No. Identitas</label><input value={form.nik} onChange={e=>setForm({...form,nik:e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-xl p-3.5 font-mono bg-slate-50 dark:bg-slate-800 outline-none focus:border-indigo-500"/></div>
                                        <div><label className="block text-xs font-extrabold text-slate-600 dark:text-slate-400 mb-1.5 uppercase">Klaster Siklus Hidup ILP</label><select value={form.ilpCategory} onChange={e=>setForm({...form,ilpCategory:e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-xl p-3.5 font-bold bg-slate-50 dark:bg-slate-800 outline-none focus:border-indigo-500">{ilpCategories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                                    </>
                                )}
                                {isAdmin && <div><label className="block text-xs font-extrabold text-slate-600 dark:text-slate-400 mb-1.5 uppercase">Lokasi Posyandu</label><select value={form.posyandu} onChange={e=>setForm({...form,posyandu:e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-xl p-3.5 font-bold bg-slate-50 dark:bg-slate-800 outline-none focus:border-indigo-500">{posyanduList.filter(p=>p.id!=='admin').map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}
                                <div className="flex gap-2 pt-2"><button type="submit" className="flex-1 bg-indigo-600 text-white font-black py-3.5 rounded-xl hover:bg-indigo-700 shadow-md">{editId ? 'Perbarui Data' : 'Simpan Data'}</button></div>
                            </form>
                        </div>
                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 shadow-sm overflow-hidden flex flex-col"><div className="overflow-x-auto flex-1 custom-scrollbar pb-2"><table className="w-full text-left whitespace-nowrap"><thead><tr className="bg-slate-50 dark:bg-slate-800/80 border-b dark:border-slate-700"><th className="p-4 text-xs font-black uppercase text-slate-500">ID & Nama</th><th className="p-4 text-xs font-black uppercase text-slate-500">Klaster / Posyandu</th><th className="p-4 text-center text-xs font-black uppercase text-slate-500">Aksi</th></tr></thead><tbody>
                            {list.map(i => {
                                const catObj = ilpCategories.find(c=>c.id===i.ilpCategory);
                                return (
                                <tr key={i.id} className="border-b dark:border-slate-800 hover:bg-slate-50/85 dark:hover:bg-slate-800/50 transition-colors text-sm">
                                    <td className="p-4 font-black text-base text-slate-800 dark:text-slate-100">{i.name}<br/><span className="text-xs font-mono text-indigo-600 dark:text-indigo-400">{i.id}</span></td>
                                    <td className="p-4"><span className="bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 px-3 py-1 rounded-xl font-bold text-xs border border-indigo-200">{activeTab==='participants' ? catObj?.name : 'Kader'}</span><br/><span className="text-[11px] text-slate-400 font-bold mt-1 inline-block">{posyanduList.find(p=>p.id===i.posyandu)?.name}</span></td>
                                    <td className="p-4 flex justify-center gap-2 items-center">
                                        {activeTab==='participants' && <button title="Riwayat Skrining & Grafik" onClick={()=>setChartItem(i)} className="w-10 h-10 flex items-center justify-center bg-purple-50 text-purple-600 rounded-xl hover:bg-purple-100"><i className="fa-solid fa-notes-medical"></i></button>}
                                        <button title="Cetak Kartu" onClick={()=>setBulkPrint([i])} className="w-10 h-10 flex items-center justify-center bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100"><i className="fa-solid fa-print"></i></button>
                                        <button title="Edit Data" onClick={()=>handleEdit(i)} className="w-10 h-10 flex items-center justify-center bg-amber-50 text-amber-600 rounded-xl hover:bg-amber-100"><i className="fa-solid fa-pen-to-square"></i></button>
                                        {delConfirm === i.id ? (<div className="flex gap-1 bg-red-50 p-1.5 rounded-xl border border-red-200"><button onClick={() => executeDelete(i.id)} className="bg-red-500 text-white px-2 py-1 rounded-lg font-black text-xs">Yakin</button><button onClick={() => setDelConfirm(null)} className="bg-slate-200 text-slate-700 px-2 py-1 rounded-lg font-black text-xs">Batal</button></div>) : (<button title="Hapus Permanen" onClick={() => setDelConfirm(i.id)} className="w-10 h-10 flex items-center justify-center bg-red-50 text-red-600 rounded-xl hover:bg-red-100"><i className="fa-solid fa-trash-can"></i></button>)}
                                    </td>
                                </tr>
                            )})}
                            {list.length === 0 && <tr><td colSpan="3" className="p-16 text-center text-slate-400 font-bold text-lg"><i className="fa-solid fa-folder-open text-5xl mb-3 opacity-30 block"></i>Belum ada data warga terdaftar.</td></tr>}
                        </tbody></table></div></div>
                    </div>
                    {bulkPrint && <BulkQRPrintModal type={activeTab} items={Array.isArray(bulkPrint) ? bulkPrint : (activeTab==='cadres'?cadres:participants)} onClose={()=>setBulkPrint(null)} posyanduList={posyanduList} role={role} isAdmin={isAdmin} ilpCategories={ilpCategories} />}
                    {chartItem && <HealthHistoryModal participant={chartItem} healthRecords={healthRecords} onClose={()=>setChartItem(null)} ilpCategories={ilpCategories} />}
                </div>
            );
        }

        function AttendanceService({ role, cadres, participants, attendances, isPosyanduOpen, schedule, syncData, showNotification }) {
            const [manualId, setManualId] = useState(''); const [useCamera, setUseCamera] = useState(false);
            const today = new Date().toISOString().split('T')[0];

            const handleScan = async (scannedId) => {
                if (!isPosyanduOpen()) return showNotification(`Sistem Tertutup. Di luar jadwal pelayanan.`, "error");
                const idToUse = scannedId || manualId; if (!idToUse) return;
                const cleanId = idToUse.trim().toUpperCase();
                const isCadre = cleanId.startsWith('KDR'); const isPart = cleanId.startsWith('ILP');
                if (!isCadre && !isPart) return showNotification("Format Barcode Tidak Dikenali!", "error");
                
                const person = isCadre ? (cadres||[]).find(c=>c.id===cleanId&&c.posyandu===role) : (participants||[]).find(p=>p.id===cleanId&&p.posyandu===role);
                if (!person) return showNotification(`ID ${cleanId} tidak terdaftar di Posyandu ini.`, "error");
                if ((attendances||[]).find(a=>a.personId===cleanId && a.date===today)) return showNotification(`${person.name} sudah hadir hari ini!`, "error");

                await syncData('attendances', `ATT-${Date.now()}`, { personId: cleanId, name: person.name, type: isCadre?'cadre':'participant', posyandu: role, date: today });
                showNotification(`BERHASIL: Kehadiran ${person.name} tercatat!`); setManualId('');
            };
            const tAtt = (attendances||[]).filter(a => a.posyandu === role && a.date === today);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-black text-slate-800 dark:text-slate-100">Scan Barcode / Kehadiran ILP</h2>
                    {!isPosyanduOpen() && <div className="bg-red-50 dark:bg-red-950/40 p-6 rounded-3xl flex gap-5 border-l-8 border-red-500 shadow-sm items-center"><i className="fa-solid fa-triangle-exclamation text-red-600 text-4xl"></i><div><p className="font-black text-red-900 dark:text-red-200 text-lg">Sistem Scanner Terkunci Otomatis</p><p className="text-sm text-red-700 dark:text-red-400 font-bold mt-1">Saat ini di luar jadwal jam/tanggal pelayanan resmi.</p></div></div>}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm">
                            <div className="flex bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl mb-6"><button onClick={()=>setUseCamera(false)} className={`flex-1 py-3 rounded-xl font-black text-sm transition-all ${!useCamera?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-keyboard mr-2"></i> Ketik Manual</button><button onClick={()=>setUseCamera(true)} className={`flex-1 py-3 rounded-xl font-black text-sm flex justify-center items-center gap-2 transition-all ${useCamera?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-camera text-base"></i> Pakai Kamera</button></div>
                            {!useCamera ? (<div className="flex gap-2"><input type="text" value={manualId} onChange={e=>setManualId(e.target.value.toUpperCase())} placeholder="Ketik ID Barcode (ILP-XXX)" className="flex-1 border-2 dark:border-slate-700 rounded-2xl p-4 font-mono font-bold outline-none focus:border-indigo-500 text-lg uppercase bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100" disabled={!isPosyanduOpen()} /><button onClick={()=>handleScan(null)} disabled={!isPosyanduOpen()||!manualId} className="bg-indigo-600 text-white font-black px-8 py-4 rounded-2xl disabled:bg-slate-300 dark:disabled:bg-slate-800 shadow-md hover:bg-indigo-700 transition-all">HADIR</button></div>) : (<CameraScanner onScan={handleScan} isPosyanduOpen={isPosyanduOpen()} />)}
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm"><h3 className="font-black text-lg mb-4 flex justify-between items-center text-slate-800 dark:text-slate-100"><span>Daftar Hadir Pos Ini</span> <span className="bg-indigo-100 text-indigo-600 px-3.5 py-1.5 rounded-full text-xs font-black">{tAtt.length} Hadir</span></h3><div className="space-y-3 h-72 overflow-y-auto pr-2 custom-scrollbar">{tAtt.map(a=>(<div key={a.id} className="flex justify-between items-center p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 hover:border-indigo-200 transition-colors"><span className="font-black text-base text-slate-800 dark:text-slate-100">{a.name}</span><span className={`text-[10px] px-3.5 py-1.5 rounded-xl font-black uppercase tracking-wider ${a.type==='cadre'?'bg-blue-100 text-blue-700':'bg-indigo-100 text-indigo-700'}`}>{a.type}</span></div>))}{tAtt.length===0 && <div className="text-center text-slate-400 font-bold py-20"><i className="fa-solid fa-users-slash text-5xl mb-3 opacity-30 block"></i>Belum ada warga discan.</div>}</div></div>

        /* Modul Kamera (Telah Dipulihkan 100%) */
        function CameraScanner({ onScan, isPosyanduOpen }) {
            const onScanRef = useRef(onScan);
            const [camError, setCamError] = useState(false);
            
            useEffect(() => { onScanRef.current = onScan; }, [onScan]);

            const startCam = () => {
                setCamError(false);
                if (isPosyanduOpen && window.Html5Qrcode) {
                    const scanner = new window.Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (t) => { onScanRef.current(t); }, () => {}).catch((e)=>{ setCamError(true); });
                    return scanner;
                }
                return null;
            };

            useEffect(() => {
                let scannerInst = startCam();
                return () => { if (scannerInst) { scannerInst.stop().then(() => scannerInst.clear()).catch(()=>{}); } };
            }, [isPosyanduOpen]);

            if (!isPosyanduOpen) return <div className="p-10 bg-slate-100 dark:bg-slate-800 text-slate-400 text-center rounded-2xl font-bold border-4 border-dashed border-slate-200 flex flex-col items-center h-64 justify-center"><i className="fa-solid fa-camera-slash text-5xl mb-4 opacity-50"></i>Kamera nonaktif karena posyandu tutup.</div>;
            return (
                <div className="text-center">
                    <div id="reader" className="w-full max-w-sm mx-auto bg-black rounded-3xl overflow-hidden shadow-inner min-h-[250px] border-4 border-indigo-200 relative flex items-center justify-center">
                        {camError && <div className="text-white p-4 font-bold text-sm"><p className="mb-3 text-rose-400"><i className="fa-solid fa-triangle-exclamation text-3xl"></i><br/>Kamera terhalang/ditolak.</p><button onClick={()=>{window.location.reload()}} className="bg-indigo-600 px-4 py-2 rounded-xl text-white font-black">Muat Ulang Halaman</button></div>}
                    </div>
                    <p className="mt-4 text-xs font-extrabold text-slate-500">Arahkan Kartu Barcode ke Kamera Anda</p>
                </div>
            );
        }

        function HealthService({ role, participants, attendances, healthRecords, syncData, showNotification, ilpCategories }) {
            const [sel, setSel] = useState(null); const [showChart, setShowChart] = useState(false);
            const [form, setForm] = useState({ weight:'', height:'', headCirc:'', armCirc:'', bellyCirc:'', tension:'', bloodSugar:'', cholesterol:'', uricAcid:'', notes:'' });

                showNotification(`Skrining kesehatan ${sel.name} tersimpan sukses!`); setShowChart(true); 
            };

            const catDetails = ilpCategories.find(c => c.id === sel?.ilpCategory) || {};
            const analysisData = sel ? getAnalysis(form, sel.ilpCategory) : {diagnosis:'', recommendation:''};

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-black text-slate-800 dark:text-slate-100">Pencatatan Skrining Kesehatan ILP</h2>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm h-[600px] flex flex-col"><h3 className="font-black text-lg mb-4 text-indigo-600 dark:text-indigo-400 border-b dark:border-slate-800 pb-3 flex items-center gap-2"><i className="fa-solid fa-clipboard-list"></i> Antrean Warga (Hadir)</h3><div className="space-y-3 overflow-y-auto pr-2 flex-1 custom-scrollbar">{pParts.map(p=>{const done = (healthRecords||[]).some(hr=>hr.participantId===p.id && hr.date===today); const cObj = ilpCategories.find(c=>c.id===p.ilpCategory); return (<button key={p.id} onClick={()=>{setSel(p);setShowChart(false);setForm({weight:'',height:'',headCirc:'',armCirc:'',bellyCirc:'',tension:'',bloodSugar:'',cholesterol:'',uricAcid:'',notes:''});}} className={`w-full text-left p-4 rounded-2xl border-2 flex justify-between items-center font-bold transition-all ${sel?.id===p.id?'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/40 shadow-md':'border-slate-100 dark:border-slate-800 hover:border-indigo-300'}`}><div><span className="text-base text-slate-800 dark:text-slate-100 block">{p.name}</span><span className="text-[11px] text-indigo-600 dark:text-indigo-400 font-extrabold">{cObj?.name}</span></div>{done&&<i className="fa-solid fa-circle-check text-emerald-500 text-xl"></i>}</button>)})}{pParts.length===0 && <div className="text-center text-slate-400 font-bold py-20"><i className="fa-solid fa-users text-5xl mb-3 opacity-30 block"></i>Belum ada warga diabsen.</div>}</div></div>
                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-3xl border dark:border-slate-800 shadow-sm">
                            {sel ? (<div>
                                <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="md:col-span-2 flex flex-wrap justify-between items-center border-b dark:border-slate-800 pb-4 mb-2 gap-4">
                                        <div>
                                            <h3 className="text-2xl font-black text-indigo-600 dark:text-indigo-400">{sel.name}</h3>
                                            <span className="bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-300 text-xs px-3 py-1 rounded-full font-black inline-block mt-1"><i className="fa-solid fa-layer-group mr-1"></i> Klaster: {catDetails.name}</span>
                                        </div>
                                        <button type="button" onClick={()=>setShowChart(true)} className="bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-300 px-5 py-2.5 rounded-2xl font-black flex items-center gap-2 hover:bg-purple-200 transition-colors shadow-sm"><i className="fa-solid fa-notes-medical text-base"></i> Riwayat Skrining</button>
                                    </div>
                                    
                                    {(sel.ilpCategory === 'balita') ? (
                                        <>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Berat Badan (kg)</label><input type="number" step="0.1" value={form.weight} onChange={e=>setForm({...form, weight: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Tinggi Badan (cm)</label><input type="number" step="0.1" value={form.height} onChange={e=>setForm({...form, height: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Lingkar Kepala (cm)</label><input type="number" step="0.1" value={form.headCirc} onChange={e=>setForm({...form, headCirc: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Lingkar Lengan (cm)</label><input type="number" step="0.1" value={form.armCirc} onChange={e=>setForm({...form, armCirc: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                        </>
                                    ) : (
                                        <>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Berat Badan (kg)</label><input type="number" step="0.1" value={form.weight} onChange={e=>setForm({...form, weight: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Tinggi Badan (cm)</label><input type="number" step="0.1" value={form.height} onChange={e=>setForm({...form, height: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Lingkar Lengan (cm)</label><input type="number" step="0.1" value={form.armCirc} onChange={e=>setForm({...form, armCirc: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Lingkar Perut (cm)</label><input type="number" step="0.1" value={form.bellyCirc} onChange={e=>setForm({...form, bellyCirc: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Tekanan Darah (mmHg)</label><input type="text" placeholder="120/80" value={form.tension} onChange={e=>setForm({...form, tension: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Gula Darah (mg/dL)</label><input type="number" value={form.bloodSugar} onChange={e=>setForm({...form, bloodSugar: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Kolesterol (mg/dL)</label><input type="number" value={form.cholesterol} onChange={e=>setForm({...form, cholesterol: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                            <div><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Asam Urat (mg/dL)</label><input type="number" step="0.1" value={form.uricAcid} onChange={e=>setForm({...form, uricAcid: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-mono text-lg bg-slate-50 dark:bg-slate-800 font-bold text-slate-800 dark:text-slate-100" /></div>
                                        </>
                                    )}

                                    <div className="md:col-span-2 bg-indigo-50 dark:bg-indigo-950/40 border-2 border-indigo-200 dark:border-indigo-800 rounded-2xl p-5 flex gap-4 items-start shadow-sm mt-2">
                                        <div className="bg-indigo-600 text-white w-12 h-12 rounded-full flex items-center justify-center shrink-0 shadow-md"><i className="fa-solid fa-robot text-2xl"></i></div>
                                        <div className="flex-1">
                                            <p className="font-black text-indigo-900 dark:text-indigo-300 mb-2 uppercase text-xs tracking-widest border-b border-indigo-200 dark:border-indigo-800 pb-2">Analisis Otomatis Sistem</p>
                                            <p className="text-sm font-bold text-rose-600 dark:text-rose-400 mb-1"><i className="fa-solid fa-heart-pulse w-5"></i> Kondisi: <span className="font-black">{analysisData.diagnosis}</span></p>
                                            <p className="text-sm font-bold text-emerald-700 dark:text-emerald-400"><i className="fa-solid fa-lightbulb w-5"></i> Tindakan: {analysisData.recommendation}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="md:col-span-2"><label className="block text-xs font-extrabold mb-1.5 text-slate-600 dark:text-slate-400 uppercase">Catatan Tambahan Petugas</label><textarea rows={2} value={form.notes} onChange={e=>setForm({...form, notes: e.target.value})} className="w-full border-2 dark:border-slate-700 rounded-2xl p-3.5 outline-none focus:border-indigo-500 font-medium bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100"></textarea></div>
                                    <div className="md:col-span-2 mt-4"><button type="submit" className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-indigo-700 transition-all text-base">Simpan Skrining ILP</button></div>
                                </form>
                            </div>) : (<div className="h-full flex flex-col items-center justify-center text-slate-400 py-24"><i className="fa-solid fa-notes-medical text-6xl mb-4 opacity-30"></i><p className="font-bold text-base">Silakan pilih warga ILP dari daftar antrean.</p></div>)}
                        </div>
                    </div>
                    {showChart && sel && <HealthHistoryModal participant={sel} healthRecords={healthRecords} onClose={()=>setShowChart(false)} ilpCategories={ilpCategories} />}
                </div>
            );
        }

        function AdminAnalyticReport({ healthRecords, posyanduList, participants, ilpCategories }) {
            const [filterPos, setFilterPos] = useState('all');

            const alerts = [];
            let totalHipertensi = 0; let totalGulaTinggi = 0; let totalKolesterolTinggi = 0; let totalAsamUratTinggi = 0;

            (healthRecords || []).forEach(hr => {
                if (filterPos !== 'all' && hr.posyandu !== filterPos) return;
                const p = (participants || []).find(part => part.id === hr.participantId);
                if (!p) return;
                
                let issues = []; let isDanger = false;
                if (hr.tension) {
                    const parts = hr.tension.split('/');
                    if (parts.length === 2) {
                        const sys = parseInt(parts[0]); const dia = parseInt(parts[1]);
                        if (sys >= 140 || dia >= 90) { issues.push(`Hipertensi (${hr.tension})`); totalHipertensi++; isDanger = true; }
                    }
                }
                if (hr.bloodSugar) {
                    const sugar = parseInt(hr.bloodSugar.toString().replace(/[^0-9]/g, ''));
                    if (sugar >= 200) { issues.push(`Gula Tinggi (${hr.bloodSugar})`); totalGulaTinggi++; isDanger = true; }
                }
                if (hr.cholesterol) {
                    const chol = parseInt(hr.cholesterol.toString().replace(/[^0-9]/g, ''));
                    if (chol >= 200) { issues.push(`Kolesterol Tinggi (${hr.cholesterol})`); totalKolesterolTinggi++; isDanger = true; }
                }
                if (hr.uricAcid) {
                    const uric = parseFloat(hr.uricAcid.toString().replace(/[^0-9.]/g, ''));
                    if (uric >= 7.0) { issues.push(`Asam Urat Tinggi (${hr.uricAcid})`); totalAsamUratTinggi++; isDanger = true; }
                }

                if (isDanger) { alerts.push({ ...hr, issues, participantInfo: p }); }
            });

            alerts.sort((a,b) => (a.date||'') > (b.date||'') ? -1 : 1);

            return (
                <div className="bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 p-8 shadow-sm space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b dark:border-slate-800 pb-4">
                        <div>
                            <h2 className="text-2xl font-black flex items-center gap-3 text-slate-800 dark:text-slate-100">
                                <i className="fa-solid fa-triangle-exclamation text-rose-500"></i> Rekap Peringatan Dini PTM
                            </h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 font-bold mt-1">
                                Deteksi otomatis risiko PTM (Hipertensi, Diabetes, Kolesterol, Asam Urat).
                            </p>
                        </div>
                        <select value={filterPos} onChange={e=>setFilterPos(e.target.value)} className="border-2 dark:border-slate-700 p-3 rounded-xl font-bold outline-none focus:border-indigo-500 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm">

({...f,startTime:e.target.value})} className="border-2 dark:border-slate-700 p-4 rounded-2xl w-full font-mono text-xl font-bold bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100"/></div><div><label className="block font-black mb-3 text-slate-700 text-sm uppercase">Jam Tutup</label><input type="time" value={f?.endTime||'12:00'} onChange={e=>setF({...f,endTime:e.target.value})} className="border-2 dark:border-slate-700 p-4 rounded-2xl w-full font-mono text-xl font-bold bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100"/></div></div><div><label className="block font-black mb-4 text-slate-700 dark:text-slate-300 text-sm uppercase">Hari Layanan Rutin</label><div className="flex flex-wrap gap-3">{dList.map(d=><button type="button" key={d.id} onClick={()=>setF(p=>({...p, days: p.days?.includes(d.id)?p.days.filter(x=>x!==d.id):[...(p.days||[]), d.id]}))} className={`px-6 py-3 rounded-full font-black text-sm border-2 transition-all ${(f?.days||[]).includes(d.id)?'bg-indigo-600 text-white border-indigo-600 shadow-md':'bg-white border-slate-200 text-slate-500'}`}>{d.n}</button>)}</div></div><button type="submit" className="w-full bg-slate-900 text-white font-black text-lg py-4 rounded-2xl shadow-xl hover:bg-black transition-all">Simpan Jadwal</button></form></div>

            const handleSub = async (e) => { 
                e.preventDefault(); 
                const cmpId = `CMP-${Date.now()}`;
                await syncData('complaints', cmpId, { ...form, date: new Date().toISOString().split('T')[0], reply: '' }); 
                showNotification("Laporan tersimpan di sistem Dasbor Admin Posyandu!"); 
                onClose(); 
            };
            
            return (
                <div className="fixed inset-0 bg-black/70 z-[150] flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl">
                        <div className="bg-indigo-600 p-6 flex justify-between text-white items-center">
                            <h3 className="font-black text-xl flex items-center gap-3"><i className="fa-solid fa-paper-plane text-2xl"></i> Laporan Warga</h3>
                            <button onClick={onClose} className="bg-white/20 w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/40"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={handleSub} className="p-6 md:p-8 space-y-5 bg-slate-50 dark:bg-slate-950">
                            <div><label className="block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase">Nama Anda</label><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-bold shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100" /></div>
                            <div><label className="block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase">Tujuan Posyandu</label><select value={form.posyandu} onChange={e=>setForm({...form,posyandu:e.target.value})} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-bold shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100">{posyanduList.filter(p=>p.id!=='admin').map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                            <div><label className="block text-xs font-black text-slate-600 dark:text-slate-400 mb-2 uppercase">Isi Pesan / Laporan</label><textarea required rows={4} value={form.message} onChange={e=>setForm({...form,message:e.target.value})} className="w-full border-2 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-indigo-500 font-medium shadow-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100"></textarea></div>
                            <button type="submit" className="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl flex justify-center items-center gap-2 shadow-lg hover:bg-indigo-700 transition-all"><i className="fa-solid fa-paper-plane text-lg"></i> Kirim Laporan ke Petugas</button>
                        </form>
                    </div>
                </div>
            );
        }

        function BulkQRPrintModal({ type, items, onClose, posyanduList, role, isAdmin, ilpCategories }) {
            const fil = isAdmin ? items : (items||[]).filter(i=>i.posyandu===role);
            return (
                <div className="fixed inset-0 bg-white dark:bg-slate-900 z-[250] flex flex-col items-center print:p-0 p-8 overflow-y-auto block custom-scrollbar">
                    <div className="w-full max-w-5xl flex flex-col print-container relative">
                        <div className="bg-white dark:bg-slate-900 py-6 flex justify-between items-center no-print border-b-2 dark:border-slate-800 mb-6 w-full sticky top-0 z-20">
                            <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-print text-indigo-600"></i> Cetak Kartu Barcode (A4 Landscape)</h3>
                            <div className="flex gap-4">
                                <button onClick={()=>window.print()} disabled={fil.length===0} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black hover:bg-indigo-700 shadow-xl disabled:bg-slate-400 flex items-center gap-2"><i className="fa-solid fa-print"></i> Print Sekarang</button>
                                <button onClick={onClose} className="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 w-12 h-12 flex justify-center items-center rounded-2xl hover:bg-slate-300"><i className="fa-solid fa-xmark text-xl"></i></button>
                            </div>
                        </div>
                        {fil.length === 0 ? (
                            <div className="text-center py-20 text-slate-500 font-bold text-xl no-print"><i className="fa-solid fa-file-circle-xmark text-6xl mb-4 opacity-50 block"></i>Belum ada data untuk dicetak di posyandu ini.</div>
                        ) : (
                            <div className="print:bg-white print:p-0 w-full">
                                <div className="flex flex-wrap gap-4 print-grid justify-center lg:justify-start w-full">
                                    {fil.map(item=>{
                                        const cObj = ilpCategories.find(c=>c.id===item.ilpCategory);
                                        return (
                                        <div key={item.id} className="print-card bg-white border-2 border-slate-200 rounded-xl flex overflow-hidden m-1 shrink-0 box-border" style={{ width: '86mm', height: '54mm' }}>
                                            
                                            {/* SISI KIRI: QR Code Aksen Ungu (Diperbarui ke Resolusi 500x500 agar sangat tajam) */}
                                            <div className="bg-indigo-50 border-r-2 border-slate-100 flex flex-col justify-center items-center p-2 relative box-border" style={{ width: '35%' }}>
                                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${item.id}&margin=1`} alt="QR" className="rounded-lg bg-white border-2 border-slate-300" style={{ width: '22mm', height: '22mm', objectFit: 'contain' }} />
                                                <span className="text-[6px] font-mono mt-1.5 text-indigo-900 font-black tracking-widest bg-white/60 px-1 py-0.5 rounded text-center leading-tight">{item.id}</span>
                                            </div>
                                            
                                            {/* SISI KANAN: Data Warga & Desain Banner */}
                                            <div className="p-2.5 flex flex-col justify-between bg-white relative box-border" style={{ width: '65%' }}>
                                                
                                                {/* BAGIAN 1: Header Teks */}
                                                <div>
                                                    <div className="flex justify-between items-start mb-1">
                                                        <div className="text-[7px] font-black text-white uppercase tracking-widest bg-indigo-600 px-1.5 py-0.5 rounded inline-block">{type==='cadres'?'KARTU KADER':'KARTU WARGA ILP'}</div>
                                                    </div>
                                                    <h4 className="font-extrabold text-[8px] text-slate-500 leading-tight mb-1 uppercase tracking-wider">{posyanduList.find(p=>p.id===item.posyandu)?.name}</h4>
                                                    <h5 className="text-[12px] font-black text-slate-900 leading-tight" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{item.name}</h5>
                                                    {type==='participants' && <p className="text-[8px] font-bold text-slate-600 mt-1">Klaster: <span className="text-indigo-700 font-black">{cObj?.name}</span></p>}
                                                </div>
                                                
                                                {/* BAGIAN 2: Ilustrasi Banner 5 Siklus ILP */}
                                                <div className="mt-1.5 flex-1 w-full bg-gradient-to-r from-indigo-50 to-rose-50 rounded-md border border-indigo-100 flex items-center px-2 overflow-hidden relative" style={{ minHeight: '12mm' }}>
                                                    <div className="absolute right-[-4px] top-[2px] opacity-10">
                                                        <i className="fa-solid fa-notes-medical text-[35px] text-indigo-800"></i>
                                                    </div>
                                                    <div className="flex flex-col z-10 w-full justify-center">
                                                        <span className="text-[5.5px] font-black text-indigo-900 uppercase tracking-wider mb-1.5">Pelayanan Primer 5 Siklus Hidup</span>
                                                        <div className="flex justify-between w-[85%] text-indigo-900 opacity-80">
                                                            <i className="fa-solid fa-person-pregnant text-[11px]" title="Ibu Hamil"></i>
                                                            <i className="fa-solid fa-baby text-[11px]" title="Balita"></i>
                                                            <i className="fa-solid fa-child-reaching text-[11px]" title="Remaja"></i>
                                                            <i className="fa-solid fa-user-tie text-[11px]" title="Dewasa"></i>
                                                            <i className="fa-solid fa-person-cane text-[11px]" title="Lansia"></i>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                {/* BAGIAN 3: Footer Link Website */}
                                                <div className="pt-1.5 border-t border-slate-200 flex items-center gap-1.5 mt-1.5">
                                                    <div className="bg-indigo-100 text-indigo-700 flex justify-center items-center rounded-full" style={{ width: '12px', height: '12px' }}>
                                                        <i className="fa-solid fa-link text-[6px]"></i>
                                                    </div>
                                                    <span className="text-[7px] font-black text-slate-600 tracking-wide">eposyandu.netlify.app</span>
                                                </div>
                                            </div>
                                        </div>
                                    );})}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        window.startReactApp = () => {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) loadingScreen.style.display = 'none';
            }
        };

        setTimeout(() => { 
            if (!window.isFirebaseLoaded) {
                window.FirebaseMod = null; 
                if (typeof window.startReactApp === 'function') { window.startReactApp(); }
            }
        }, 3000);

        if (window.isFirebaseLoaded && typeof window.startReactApp === 'function') {
            window.startReactApp();
        }
    </script>

    <div class="install-banner" id="install-banner">
        <img src="" id="install-logo" alt="">
        <div style="flex:1"><b>Pasang Posyandu ILP</b><small>Akses cepat dari layar utama HP/PC</small></div>
        <button id="install-yes">Pasang</button><button class="x" id="install-no">&#10005;</button>
    </div>
    <script>
        document.getElementById('install-logo').src = window.POS_LOGO;
        (function(){
            var dp, bar = document.getElementById('install-banner');
            window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; if(!sessionStorage.getItem('pwa_no')) bar.style.display='flex'; });
            document.getElementById('install-yes').onclick = function(){ if(dp){ dp.prompt(); dp.userChoice.then(function(){ bar.style.display='none'; dp=null; }); } };
            document.getElementById('install-no').onclick = function(){ bar.style.display='none'; try{sessionStorage.setItem('pwa_no','1');}catch(e){} };
            window.addEventListener('appinstalled', function(){ bar.style.display='none'; });
            if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
        })();
    </script>

    <div class="ios-hint" id="ios-hint">
        <img src="" id="ios-logo" alt="">
        <div style="flex:1"><b>Pasang di iPhone/iPad</b>Ketuk tombol <b style="display:inline">Bagikan</b> (kotak dengan panah) di Safari, lalu pilih <b style="display:inline">Tambah ke Layar Utama</b>.</div>
        <button id="ios-x">&#10005;</button>
    </div>
    <script>
        (function(){
            var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
            var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
            var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
            if (ios && safari && !standalone && !localStorage.getItem('ios_hint_no')) {
                document.getElementById('ios-logo').src = window.POS_LOGO;
                document.getElementById('ios-hint').style.display = 'flex';
            }
            document.getElementById('ios-x').onclick = function(){ document.getElementById('ios-hint').style.display='none'; try{localStorage.setItem('ios_hint_no','1');}catch(e){} };
        })();
    </script>
</body>
</html>
